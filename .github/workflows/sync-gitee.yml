name: Sync release to Gitee

# 把已发布的 GitHub Release 镜像到 Gitee，并维护固定清单 updates/latest.json。
#
# 触发方式：
# - workflow_call：由 `Publish updater manifest` 在 Release 发布后调用（主路径）；
# - workflow_dispatch：手工补跑任意已发布 tag（演练/回填用）；
# - release: published：只兜底"人手动发布"的 Release。注意本仓正常发版是
#   `GITHUB_TOKEN` 发布，GitHub 不会为它再启动 workflow，所以主路径必须靠上面两条，
#   不能只监听 release: published。
#
# 为什么要拆成 prepare / upload(分片) / finalize：
# - 现场（2026-11-07 演练 v5.18.78）：GitHub runner 直连 Gitee 上传约 10KB/s，
#   单个 release 74MB 串行要两个多小时；单进程 4 路并发只到 ~15KB/s，是 per-IP 限速。
# - 所以上传按文件下标分片给 5 个 job（不同 runner IP），每个分片再并发 3 路；
#   建 release、提交清单、匿名校验、清理各自只做一次。
#
# 安全：
# - GITEE_TOKEN 只从 secret 读，第一步就 ::add-mask::，脚本任何错误都会把 token 替换成 ***；
# - Gitee 只承载 **Windows/macOS 正常版（≤10MB）与 Android APK（≤20MB）**；WebView2 内置包
#   （177–189MB）与 Linux 包（AppImage/deb）只走 GitHub。单版 Gitee 占用约 75MB，
#   keep=3 约 225MB，远低于仓库 1G 配额；当前 tag 永不进入清理清单。
#
# 为什么收紧白名单（2026-11-27 v7.4.2 事故）：按「100MB 以内都传」把 ~245MB 交给 4 个分片，
# 结果 4 个分片全部 HTTP 400（6MB 的 exe 都传了 99 分钟），所有二进制缺失；更糟的是
# finalize 先提交 latest.json 再校验，客户端看到「有更新」却下载 404。现在：
# - 白名单由 `sync-gitee.mjs::skipReason` 单点定义，下载预筛与上传共用；
# - 成功判据只看 4 个桌面正常版 + Android APK；Linux/WebView2 缺失不判红；
# - finalize 先验资产、后提交清单，失败时保留上一版。
#
# 历史上 4 路并发是探针验证过的上限（单路 7.8MB 18KB/s；4 路全部 201）；分片数不要调大。

on:
  workflow_call:
    inputs:
      tag:
        description: "要同步的 tag（vX.Y.Z）"
        required: true
        type: string
      keep:
        description: "Gitee 保留最近多少个 release"
        required: false
        default: "3"
        type: string
      dry_run:
        description: "只打印清理计划，不实际删除"
        required: false
        default: false
        type: boolean
    secrets:
      GITEE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 tag（vX.Y.Z）"
        required: true
        type: string
      keep:
        description: "Gitee 保留最近多少个 release"
        required: false
        default: "3"
        type: string
      dry_run:
        description: "只打印清理计划，不实际删除"
        required: false
        default: true
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # 2026-11-23：组名**不带 tag**——Gitee 是 per-IP 限速，v7.2.5 补同步与 v7.2.6 的同步
  # 同时跑会互相抢带宽（两个大 AppImage 分片跑了近两小时未完成）。串行化到一条。
  group: sync-gitee-serial
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  GITEE_REPO: fwdq/gosslan-releases
  GITHUB_REPO: ${{ github.repository }}
  KEEP: ${{ inputs.keep || '3' }}
  DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mask Gitee token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: echo "::add-mask::$GITEE_TOKEN"

      - name: Validate tag
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "非法 tag：$TAG" >&2
            exit 1
          fi
          if ! printf '%s' "$KEEP" | grep -Eq '^[1-9][0-9]*$'; then
            echo "非法 keep：$KEEP" >&2
            exit 1
          fi
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "缺少 GITEE_TOKEN secret" >&2
            exit 1
          fi

      # 不能用 tag 的 checkout：演练 v5.18.78 时该 tag 还没有本脚本，资产改为按 tag
      # 从 GitHub API 下载。release 事件取默认分支；workflow_dispatch 取被派发的 ref（这样
      # 分支上的演练能拿到未合并的脚本）；workflow_call 取调用方（manifest job）的提交。
      - name: Checkout sync script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
          sparse-checkout: |
            scripts/sync-gitee.mjs
            scripts/updater-manifest.mjs
          fetch-depth: 1

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # gh api 偶发「退出码 0 + 空响应体」：2026-11-09 发 v5.20.2 时真实发生过 ——
          # manifest 已发布，finalize 这一行拿到空文件，jq 报 unexpected end of JSON input，
          # 整条镜像红掉，而 Gitee 固定清单停在上一版（客户端会拿到旧清单且不回落）。
          # 只在这一处重试：三步都从它取 release，取不到后面全是空转。
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPO/releases/tags/$TAG" > /tmp/release.json \
              && [ -s /tmp/release.json ]; then
              break
            fi
            echo "取 release $TAG 失败（第 ${attempt} 次）"
            [ "$attempt" -lt 5 ] || { echo "连续 5 次取不到 release $TAG"; exit 1; }
            sleep $((attempt * 3))
          done
          jq -r '.assets[] | [.id, .name, .size] | @tsv' /tmp/release.json > /tmp/assets.tsv
          # 与 sync-gitee.mjs 的 skipReason 共用同一份白名单：只下载 Gitee 承载的
          # Win/Mac 正常版（≤10MB）、Android APK（≤20MB）与签名；Linux/WebView2 不拉。
          node --input-type=module -e '
            import fs from "node:fs";
            import { skipReason } from "./scripts/sync-gitee.mjs";
            for (const line of fs.readFileSync("/tmp/assets.tsv", "utf8").trim().split("\n")) {
              if (!line) continue;
              const [id, name, size] = line.split("\t");
              if (name === "latest.json" || !skipReason(name, Number(size))) console.log(`${id}\t${name}`);
            }
          ' > /tmp/keep.tsv
          while IFS=$'\t' read -r id name; do
            gh api "repos/$GITHUB_REPO/releases/assets/$id" \
              -H "Accept: application/octet-stream" -H "Cache-Control: no-cache" > "assets/$name"
          done < /tmp/keep.tsv
          # gh api 失败会留下 0 字节文件；不拦就会把空附件传上去，finalize 也看不出来。
          while IFS=$'\t' read -r id name; do
            test -s "assets/$name" || { echo "下载失败/空文件：$name"; exit 1; }
          done < /tmp/keep.tsv
          test -s assets/latest.json
          echo "下载完成：$(find assets -type f | wc -l | tr -d ' ') 个文件"

      - name: Ensure Gitee repo/tag/release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/sync-gitee.mjs --tag "$TAG" --assets-dir assets --repo "$GITEE_REPO" \
            --keep "$KEEP" --mode prepare

  upload:
    needs: prepare
    runs-on: ubuntu-latest
    # 白名单后单版只有 ~75MB（Win/Mac 正常版 + Android APK），4 片串行约 20 分钟；
    # 留 90 分钟给 Gitee 限速抖动。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # ★ 分片 12 → 4（2026-11-24 实测）：分片不是越多越好。12 片 × 每片 3 并发 = 36 路
        # 同时打 Gitee，单连接被压到 ~2KB/s（7.8MB 传 56 分钟后 HTTP 400），总带宽反而崩了；
        # v7.2.8 的 12 片里 5 片失败。现在 4 片、每片**串行**（并发固定 1），并且脚本按
        # **字节数装箱**分支——两个 ~100MB 的 AppImage 各占一片，不再挤在同一片里串行。
        shard: [0, 1, 2, 3]
    steps:
      - name: Mask Gitee token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: echo "::add-mask::$GITEE_TOKEN"

      - name: Checkout sync script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
          sparse-checkout: |
            scripts/sync-gitee.mjs
            scripts/updater-manifest.mjs
          fetch-depth: 1

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # gh api 偶发「退出码 0 + 空响应体」：2026-11-09 发 v5.20.2 时真实发生过 ——
          # manifest 已发布，finalize 这一行拿到空文件，jq 报 unexpected end of JSON input，
          # 整条镜像红掉，而 Gitee 固定清单停在上一版（客户端会拿到旧清单且不回落）。
          # 只在这一处重试：三步都从它取 release，取不到后面全是空转。
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPO/releases/tags/$TAG" > /tmp/release.json \
              && [ -s /tmp/release.json ]; then
              break
            fi
            echo "取 release $TAG 失败（第 ${attempt} 次）"
            [ "$attempt" -lt 5 ] || { echo "连续 5 次取不到 release $TAG"; exit 1; }
            sleep $((attempt * 3))
          done
          jq -r '.assets[] | [.id, .name, .size] | @tsv' /tmp/release.json > /tmp/assets.tsv
          # 与 sync-gitee.mjs 的 skipReason 共用同一份白名单：只下载 Gitee 承载的
          # Win/Mac 正常版（≤10MB）、Android APK（≤20MB）与签名；Linux/WebView2 不拉。
          node --input-type=module -e '
            import fs from "node:fs";
            import { skipReason } from "./scripts/sync-gitee.mjs";
            for (const line of fs.readFileSync("/tmp/assets.tsv", "utf8").trim().split("\n")) {
              if (!line) continue;
              const [id, name, size] = line.split("\t");
              if (name === "latest.json" || !skipReason(name, Number(size))) console.log(`${id}\t${name}`);
            }
          ' > /tmp/keep.tsv
          while IFS=$'\t' read -r id name; do
            gh api "repos/$GITHUB_REPO/releases/assets/$id" \
              -H "Accept: application/octet-stream" -H "Cache-Control: no-cache" > "assets/$name"
          done < /tmp/keep.tsv
          # gh api 失败会留下 0 字节文件；不拦就会把空附件传上去，finalize 也看不出来。
          while IFS=$'\t' read -r id name; do
            test -s "assets/$name" || { echo "下载失败/空文件：$name"; exit 1; }
          done < /tmp/keep.tsv
          test -s assets/latest.json

      - name: Upload shard
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/sync-gitee.mjs --tag "$TAG" --assets-dir assets --repo "$GITEE_REPO" \
            --keep "$KEEP" --mode upload --shard "${{ matrix.shard }}" --shards 4

  finalize:
    needs: upload
    # 分片失败/取消也**必须**跑：它是「两仓逐个文件对齐」的最后一关（缺文件在这里红，
    # 而不是静默留在半套状态）。2026-11-23 v7.2.5 就是分片被取消 ⇒ finalize 直接跳过 ⇒
    # 整轮只显示 cancelled、没人核对 Gitee 是否齐。
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Mask Gitee token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: echo "::add-mask::$GITEE_TOKEN"

      - name: Checkout sync script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
          sparse-checkout: |
            scripts/sync-gitee.mjs
            scripts/updater-manifest.mjs
          fetch-depth: 1

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # gh api 偶发「退出码 0 + 空响应体」：2026-11-09 发 v5.20.2 时真实发生过 ——
          # manifest 已发布，finalize 这一行拿到空文件，jq 报 unexpected end of JSON input，
          # 整条镜像红掉，而 Gitee 固定清单停在上一版（客户端会拿到旧清单且不回落）。
          # 只在这一处重试：三步都从它取 release，取不到后面全是空转。
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPO/releases/tags/$TAG" > /tmp/release.json \
              && [ -s /tmp/release.json ]; then
              break
            fi
            echo "取 release $TAG 失败（第 ${attempt} 次）"
            [ "$attempt" -lt 5 ] || { echo "连续 5 次取不到 release $TAG"; exit 1; }
            sleep $((attempt * 3))
          done
          jq -r '.assets[] | [.id, .name, .size] | @tsv' /tmp/release.json > /tmp/assets.tsv
          # 与 sync-gitee.mjs 的 skipReason 共用同一份白名单：只下载 Gitee 承载的
          # Win/Mac 正常版（≤10MB）、Android APK（≤20MB）与签名；Linux/WebView2 不拉。
          node --input-type=module -e '
            import fs from "node:fs";
            import { skipReason } from "./scripts/sync-gitee.mjs";
            for (const line of fs.readFileSync("/tmp/assets.tsv", "utf8").trim().split("\n")) {
              if (!line) continue;
              const [id, name, size] = line.split("\t");
              if (name === "latest.json" || !skipReason(name, Number(size))) console.log(`${id}\t${name}`);
            }
          ' > /tmp/keep.tsv
          while IFS=$'\t' read -r id name; do
            gh api "repos/$GITHUB_REPO/releases/assets/$id" \
              -H "Accept: application/octet-stream" -H "Cache-Control: no-cache" > "assets/$name"
          done < /tmp/keep.tsv
          # gh api 失败会留下 0 字节文件；不拦就会把空附件传上去，finalize 也看不出来。
          while IFS=$'\t' read -r id name; do
            test -s "assets/$name" || { echo "下载失败/空文件：$name"; exit 1; }
          done < /tmp/keep.tsv
          test -s assets/latest.json

      - name: Verify assets, commit manifest, prune
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          args=(--tag "$TAG" --assets-dir assets --repo "$GITEE_REPO" --keep "$KEEP" --mode finalize)
          if [ "$DRY_RUN" = "1" ]; then args+=(--dry-run); fi
          node scripts/sync-gitee.mjs "${args[@]}"
