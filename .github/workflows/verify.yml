name: Verify

# =============================================================================
#  测试门禁（test gate）
#
#  ## 为什么要有这个 workflow
#
#  本仓库此前**三个 workflow 全是打包**（build / build-macos / build-android），
#  没有任何一个跑测试 —— 前端断言、Rust 用例、护栏非空转全依赖**人工记得跑**。
#  纪律很强，但没有门禁：一次漏跑就能把回归合进 main。（条数故意不写在这里：
#  写死就必然腐烂，本文件头部曾经挂着"457/503/93"三个早已对不上的数字好几天。）
#
#  真实案例（CHANGELOG 4.18.7 → 4.18.10）：BLE 分片问题连着四个版本边修边冒，
#  每一版都是人工验证过的。有这条门禁，4.18.7 的修复会当场被 4.18.9 的用例拦住。
#
#  ## 触发条件：两个都挂
#
#  `push`（任意分支）+ `pull_request`。
#
#  · 只挂 `push: [main]` 等于**合并之后**才检查，太晚；
#  · 只挂 `pull_request` 则"推上去"拿不到结果，必须先开 PR 才跑
#    （2026-09-16 实测：推了一条分支上去，API 里一个 run 都没有）；
#  · 两个都挂会让同一个分支**同时**触发两次（push 事件 + PR synchronize 事件），
#    靠下面的 concurrency 按**分支名**去重，不会真的跑两遍。
#
#  本仓库是 public ⇒ Actions 分钟数（含 macOS）免费，所以"每次推送都跑"没有成本顾虑。
#
#  ⚠️ 将来若启用 branch protection（要求 PR 上的检查通过），建议改回**只挂
#  `pull_request`**：去重是"后者取消前者"的竞态，被取消的那次在 PR 上会显示 cancelled，
#  branch protection 会因此判不通过。
#
#  ## ⚠️ 为什么是 macos-latest，而不是 ubuntu-latest
#
#  一部分代码与用例是**平台门控**的：
#
#      src-tauri/src/transport/mod.rs:15   #[cfg(all(feature = "bluetooth", target_os = "macos"))]
#      src-tauri/src/transport/mod.rs:24   #[cfg(all(feature = "bluetooth", target_os = "windows"))]
#
#  在 ubuntu 上这两块**都不编译**，对应的用例一条都不跑，而 CI 照样全绿。
#  macos-latest 是主平台（Mac 当 BLE 外设的那一半只在这里）。
#  另一半（Windows 外设）由 `rust` job 的 **windows-latest 那条腿**覆盖 ——
#  两条腿各用各的基线，因为两侧是互斥的 #[cfg]（见该 job 的注释）。
#
#  ## cargo fmt / clippy 已纳入门禁（2026-09-17）
#
#  初始版本故意不加（`cargo fmt --check` 有 517 处差异、clippy 未安装）。
#  2026-09-17 统一 fmt 全量重排 + 清理 26 条 clippy warning 后，两项均零红，
#  已纳入 rust job 的前置检查（fmt → clippy → test → manifest guard）。
#
#  ## ⚠️ 为什么 Rust job 必须先 `npm run build`
#
#  `dist/` 在 .gitignore 里、不进版本库，而 Tauri 的 `build.rs` 要读它。全新 clone 上：
#
#      error: proc macro panicked
#        --> src/lib.rs:387:16
#        = help: message: The `frontendDist` configuration is set to `"../dist"`
#                        but this path doesn't exist
#      error: could not compile `gosslan` (lib test)
#
#  即 `cargo test` **根本编不过**。所以顺序必须是 build 前端 → 再 cargo test，
#  不能调换、也不能省。
#
#  ## 两个 job 为什么各自跑一遍 npm
#
#  GitHub 的 job 之间**不共享文件系统**，所以 Rust job 必须自己产出 dist。
#  拆成两个 job 是为了并行（macOS runner 上 cargo 编译是耗时大头）。
# =============================================================================

on:
  # 任意分支推送都跑：推上去就能拿到结果，不必先开 PR（见文件头「触发条件」）。
  push:
    branches: ["**"]
    # tag 也要跑：四个 build workflow 都是 `tags: ["v*"]` 触发，而发布 job 只 `needs`
    # 构建、不等门禁。不挂 tags 的话，打一个 tag 就能把**从未跑过测试**的 commit 发出去。
    tags: ["v*"]
  # PR 上仍跑（合并前的关卡）。与上面的 push 事件可能同时触发，由 concurrency 去重。
  pull_request:
  workflow_dispatch:
  # 定时：每晚跑「护栏非空转（全量）」+「静态检查」+「供应链审计」三条腿 ——
  # 前端/Rust 腿用 job 级 `if` 在 schedule 事件下跳过，免得每晚重跑一遍。
  # （供应链审计 2026-10-24 起**每次 push / PR 也跑**；定时那一轮留着接"上游新发公告"这类漂移。）
  # ⚠️ GitHub 的 scheduled 工作流**只按默认分支（main）上的这份定义**运行 ⇒ 在 feat/* 上改
  #   cron 不会生效，这条要等它进 main 才持续跑；本分支随时可以用 workflow_dispatch 手动拉。
  schedule:
    - cron: "20 19 * * *" # UTC 19:20 = 北京 03:20

# 同一分支去重：push 事件用 `ref_name`、PR 事件用 `head_ref`，两者都取到**分支名**，
# 所以「推分支」与「开/更新 PR」会落进同一个并发组 —— 后启动的取消先启动的，不会双跑。
# （原先用 `github.ref`：push 是 `refs/heads/X`、PR 是 `refs/pull/N/merge`，会被分成两组。）
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# =============================================================================
#  ⚠️ 这一行 env 是"Change Budget 到底有没有在 CI 上跑过"的开关
#
#  `check-change-budget.mjs` 在 push 事件上要判的范围是 `github.event.before..github.sha`
#  （本次推送新引入了哪些 commit）。但 **`GITHUB_EVENT_BEFORE` 不是 Actions 的默认环境变量**
#  —— 默认只有 `GITHUB_SHA` / `GITHUB_REF_NAME` / `GITHUB_EVENT_NAME` / `GITHUB_EVENT_PATH`，
#  事件 JSON 里的 `before` 必须自己映射进来。
#
#  没映射时脚本会静默退到 `origin/<分支>..HEAD`，而 push 之后远端 ref **已经**指向 HEAD
#  ⇒ 空范围 ⇒ 判不到任何 commit。表现就是"这一步 ✅、CI 全绿"，实际什么都没看 ——
#  正是本项目最忌讳的"没守却当作守了"。（`fetch-depth: 0` 那段的注释一直说在做 before..sha
#  探测；探测代码在，输入没喂进来，于是这句说明长期是假的。）
#
#  现在零覆盖在 push-to-main 上是**硬失败**（脚本退出码 1），失败详情走 `ci-run.sh` 的注解
#  通道 ⇒ 匿名可读。所以"CI 绿"从今天起才等价于"Change Budget 真判过这次推送的 commit"。
# =============================================================================
env:
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
  # 只有**门禁自己的 workflow** 把"范围没拿到 before"判成硬失败（见 check-change-budget.mjs
  # 的退出码说明）。出包脚本也跑这道门禁，但那里空转不该打断出包 ⇒ 不开 strict。
  GOSSLAN_BUDGET_STRICT: "1"

jobs:
  # ---------------------------------------------------------------------------
  #  前端：测试 + 清单守卫 + 构建
  # ---------------------------------------------------------------------------
  frontend:
    name: 前端测试 / 清单 / 构建
    runs-on: macos-latest
    # ⚠️ 20 分钟**太紧**（2026-10-21 实测）：这条腿在 GitHub 的 macos runner 上要 **19m41s**
    # （e66e500 那轮）—— 正好卡在 20 分钟下面。后面两轮（3961fcd / c31dda2）都被这条上限
    # 掐成 `cancelled`（GitHub 对超时给的是 cancelled，不是 failure ⇒ 注解里只剩一句
    # "Process completed with exit code 1"，很容易被误读成产品红）。
    # 本机跑同一组只要 ~2.5 分钟，差的是 runner 的算力 ⇒ 这里给足余量，
    # 让"慢"与"红"彻底分开（不降低任何检查强度，只是别把慢当红）。
    timeout-minutes: 45
    # 定时事件只为了全量护栏 ⇒ 这条腿不在夜间重付。
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          # Change Budget 守门需要 git 历史：push event 的 before..sha 探测（顶部那段 env
          # 讲的就是这件事）、犯案窗口与受检范围共用同一批 commit。默认 fetch-depth=1
          # 连 HEAD~1 都没有，必须拉全历史（仓库很小，秒级）。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 安装依赖
        run: npm ci

      # ⚠️「跑哪些检查」只有一份定义：`scripts/verify.mjs` 的步骤表（这里只说"跑哪一组"）。
      # 以前两边各抄一份，已经因此腐烂过：本文件头部曾写着「457 条前端断言 + 503 条 Rust
      # 用例 + 93 条护栏」，而条数一直在动。要加/删一步 ⇒ 改 verify.mjs 的步骤表（每条必须
      # 声明 group，漏声明 verify.mjs 自己会红）。步骤级理由（--features bluetooth 不能省、
      # ci-run.sh 注解通道、fetch-depth 为 Change Budget 服务）都在 verify.mjs 的 why 里。
      - name: 跑门禁（frontend 组 —— 清单只在 scripts/verify.mjs）
        shell: bash
        run: bash scripts/ci-run.sh "verify frontend 组" node scripts/verify.mjs --group frontend

  # ---------------------------------------------------------------------------
  #  Rust：单测 + 清单守卫（macOS + Windows 两条腿）
  #
  #  ⚠️ 为什么必须有 Windows 这条腿（2026-09-16）：一部分代码是 **Windows 专属** 的：
  #
  #      src-tauri/src/transport/mod.rs:24    #[cfg(all(feature = "bluetooth", target_os = "windows"))]
  #
  #  即 `bluetooth_peripheral_windows.rs`（Windows BLE **外设**角色 / WinRT GattServiceProvider，
  #  2 条用例）。在 macOS 上它**不编译**，那 2 条用例一条都不跑，而 CI 照样全绿。
  #
  #  这不是假想的风险：`transport/bluetooth.rs` 里写着「外设侧用的是同一个函数」，
  #  而实测只有 Windows 走了共享的 `att_payload_budget` —— macOS 那一侧自己抄了一份
  #  `central_payload_mtu`（硬编码 20 / 512）。这类跨平台漂移**只有在两侧都被编译时才看得见**。
  #
  #  每条腿用**自己的**基线（`test-baseline.<平台>.txt`）：macOS 外设与 Windows 外设是
  #  互斥的 `#[cfg]`，拿 macOS 的基线去比 Windows 会把 5 条平台门控用例误判成「静默跳过」。
  # ---------------------------------------------------------------------------
  rust:
    name: Rust 单测 / 清单（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # 定时事件只为了全量护栏 ⇒ 这两条腿不在夜间重付。
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ 2026-10-22 深夜：Windows 的测试 exe 在 `windows-latest` 与 `windows-2022` 上
        # **都在加载期就死**（0xc0000139，零测试输出），fmt/clippy/打包全绿。
        # 已试过 `windows-2019` 想判别"是不是镜像侧更新"——该镜像**已退役**，作业根本不会调度
        # （页面里连作业都没有）⇒ 这条路无效，回到 `windows-latest`。
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Tauri 的 build.rs 需要 dist/（见文件头说明），必须在 cargo 之前。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 安装依赖并构建前端（cargo test 依赖 dist/）
        run: |
          npm ci
          npm run build

      # 工具链**刻意用浮动 stable**（不钉版）：钉版实验（2026-10-22 深夜）证明
      # Windows 测试 exe 的 `0xc0000139` 与工具链无关 —— 钉到 1.98.1 后同红。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 缓存盐实验（`key: rustgate-v2`）已撤：冷编 202s 后 Windows 仍同红 ⇒ 与缓存无关。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `--features bluetooth` 不能少：bluetooth 是**非默认** feature，
      # 漏掉它 BLE 模块根本不编译 ⇒ 那批用例连同被测代码一起消失，而 cargo test 全绿。
      # 这一点由下一步的清单守卫兜底（会比对基线名单）。
      #
      # 失败诊断走 `scripts/ci-run.sh`：它把关键行合成**一条多行 check 注解**。
      # 为什么必须这么做 —— CI 红了之后三条渠道只有一条能用：
      #   · `actions/jobs/{id}/logs` API → 匿名 403；
      #   · 浏览器日志页 → "Sign in to view logs"（**公开仓库也要登录**）；
      #   · check 注解 → ✅ 可匿名读 `/repos/O/R/check-runs/{job_id}/annotations`。
      #
      # ⚠️ Windows 上必须显式 `shell: bash`（用 Git Bash）——脚本依赖 tee/grep/tail/node。

      # 清单只有一份：见 verify.mjs 的 group=rust（fmt → clippy → 单测 → 测试清单守卫）。
      # `--features bluetooth` 不能省、清单守卫为什么必须跟着跑，都写在那一步的 why 里。
      - name: 跑门禁（rust 组 —— 清单只在 scripts/verify.mjs）
        shell: bash
        run: bash scripts/ci-run.sh "verify rust 组（${{ matrix.os }}）" node scripts/verify.mjs --group rust

      # Windows 的测试进程在**加载期**就死了（`0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND`，
      # 零测试输出）时，失败现场只有一行 exit code —— 看不到是哪个 DLL 的哪个符号缺。
      # 这一步只在 Windows 且前面失败时跑。
      #
      # ⚠️ 结论必须走 `::error::` 注解：**step 日志对匿名访问不可见**，而注释通道是公开的
      #   （本仓 CI 诊断一直靠这个：`ci-run.sh` 把关键行塞进注解）。所以这里把
      #   ① 测试 exe 的完整 DLL 导入名单 ② 系统 vcruntime 版本 ③ 静态 CRT 开关状态
      #   压成两三行注解，而不是只往日志里打一百行。
      - name: Windows 加载失败诊断（导入表 → 注解）
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $hit = $null
          # release 优先：verify.mjs 在 Windows 上跑的是 `cargo test --release`，
          # 产物在 target\release\deps（2026-10-23 实测：只找 debug ⇒ 诊断自己先红「找不到 exe」）。
          foreach ($dir in @('src-tauri\target\release\deps', 'target\release\deps',
                             'src-tauri\target\debug\deps', 'target\debug\deps')) {
            $cand = Get-ChildItem "$dir\gosslan_lib-*.exe" -ErrorAction SilentlyContinue |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($cand) { $hit = $cand; break }
          }
          if (-not $hit) {
            Write-Host "::error title=Windows 加载失败诊断::找不到 gosslan_lib-*.exe（构建产物路径变了）"
            exit 0
          }
          Write-Host "测试可执行文件：$($hit.FullName)（$($hit.Length) 字节）"
          $raw = & llvm-readobj --coff-imports $hit.FullName 2>&1 | Out-String
          Write-Host $raw
          $dlls = [regex]::Matches($raw, 'Name:\s*(\S+\.dll)') |
                  ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if (-not $dlls) {
            Write-Host "::error title=Windows 加载失败诊断::llvm-readobj 读不到导入表（工具缺失或 exe 损坏）"
            exit 0
          }
          Write-Host "::error title=Windows 测试 exe 导入的 DLL（$($dlls.Count) 个）::$($dlls -join ', ')"

          # ⚠️ 最可靠的一招放在最前面：**直接跑一次测试 exe**（带 `--list`，不真跑用例）。
          # Windows 的控制台程序在加载期失败时，加载器会把
          #   "The procedure entry point X could not be located in the dynamic link library Y.dll"
          # 写进 stderr —— 这就是缺哪个导出/哪个 DLL 的**直接答案**，不用再解析导入表。
          # （上一版用 llvm-readobj 解析 (DLL, 符号) 再逐个 GetProcAddress，结果解析 0 条；
          #   解析器本身成了故障点，换成这条"让系统自己说"。）
          Write-Host "== 直接运行（--list）捕获加载器错误"
          $probe = & $hit.FullName --list 2>&1 | Out-String
          Write-Host $probe
          $flat = ($probe -replace '\s+', ' ')
          $verdict = if ($flat.Trim()) { $flat.Substring(0, [Math]::Min(700, $flat.Length)) } else { '(无输出)' }
          Write-Host "::error title=Windows 加载器错误原文::$verdict"

          # 加载器报错不一定进 stderr（GUI 子系统 / 消息框会把它吞掉），但 Windows 会把
          # 「应用程序错误 1000」写进事件日志，里面带出错模块名 —— 这是第二条独立通道。
          $evs = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 20 -ErrorAction SilentlyContinue |
                 Where-Object { $_.Message -match 'gosslan' } | Select-Object -First 3
          if ($evs) {
            $evText = ($evs | ForEach-Object { ($_.Message -replace '\s+', ' ') }) -join ' ¦ '
            if ($evText.Length -gt 900) { $evText = $evText.Substring(0, 900) }
            Write-Host "::error title=Windows 事件日志（应用程序错误 1000）::$evText"
          } else {
            Write-Host "::error title=Windows 事件日志（应用程序错误 1000）::最近 20 条里没有 gosslan 记录"
          }

          # 再解析一遍导入表，这次**不锚缩进**：
          # `Name: xxx.dll` 开新的导入 DLL；函数行是 `Symbol: Foo (0)`（llvm-readobj 的
          # 真实格式 —— 前一版按 `Name:` 抓函数，一条都抓不到，所以"缺的导出"那行从未生效）。
          # 然后对每个 (DLL, 符号) 真做一次 NativeLibrary.TryGetExport —— 缺的就是罪魁。
          $pairs = New-Object System.Collections.Generic.List[object]
          $cur = $null
          foreach ($line in ($raw -split "`n")) {
            if     ($line -match 'Name:\s*(\S+\.dll)\s*$') { $cur = $Matches[1] }
            elseif ($line -match 'Symbol:\s*(\S+)' -and $cur) {
              $pairs.Add([pscustomobject]@{ Dll = $cur; Fn = $Matches[1] })
            }
          }
          if ($pairs.Count -eq 0) {
            # 把「Name:」行的**真实样子**打出来（最多 3 行）—— 解析器已经连着两版
            # 因为猜格式而空转，这一次直接把样本摆在注解里，下一版照着改。
            $all = @($raw -split "`n" | Where-Object { $_.Trim() })
            $head = ($all | Select-Object -First 12) -join ' ¦ '
            if ($head.Length -gt 900) { $head = $head.Substring(0, 900) }
            Write-Host "::error title=Windows 导入表原始样本（共 $($all.Count) 行）::$head"
            $res = & llvm-readobj --coff-resources $hit.FullName 2>&1 | Out-String
            $resFlat = ($res -replace '\s+', ' ')
            if ($resFlat.Length -gt 400) { $resFlat = $resFlat.Substring(0, 400) }
            Write-Host "::error title=Windows 资源段（看有没有 RT_MANIFEST）::$resFlat"
          } else {
            $handles = @{}
            $missing = New-Object System.Collections.Generic.List[string]
            foreach ($p in $pairs) {
              if (-not $handles.ContainsKey($p.Dll)) {
                try { $handles[$p.Dll] = [System.Runtime.InteropServices.NativeLibrary]::Load($p.Dll) }
                catch { $handles[$p.Dll] = [IntPtr]::Zero }
              }
              $h = $handles[$p.Dll]
              if ($h -eq [IntPtr]::Zero) { $missing.Add("$($p.Dll)!$($p.Fn)(DLL本身加载失败)"); continue }
              $addr = [IntPtr]::Zero
              if (-not [System.Runtime.InteropServices.NativeLibrary]::TryGetExport($h, $p.Fn, [ref]$addr)) {
                $missing.Add("$($p.Dll)!$($p.Fn)")
              }
            }
            if ($missing.Count -gt 0) {
              Write-Host "::error title=Windows 缺的导出($($pairs.Count) 项里缺 $($missing.Count) 个)::$($missing -join '; ')"
            } else {
              Write-Host "::error title=Windows 缺的导出::静态导入 $($pairs.Count) 项全部可解析 —— 问题在延迟加载/清单/并行 DLL"
            }
          }
          $vc = Get-Item C:\Windows\System32\vcruntime140*.dll -ErrorAction SilentlyContinue |
                ForEach-Object { "$($_.Name)=$($_.VersionInfo.FileVersion)" }
          $envs = (Get-ChildItem Env: | Where-Object { $_.Name -match 'CRT|VCRUNTIME|RUSTFLAGS' } |
                   ForEach-Object { "$($_.Name)=$($_.Value)" })
          Write-Host "::error title=Windows CRT 现场::vcruntime=[$($vc -join '; ')] env=[$($envs -join '; ')]"
  # ---------------------------------------------------------------------------
  #  Android 编译门禁（第三个平台）
  #
  #  ⚠️ 为什么要有这条腿：一部分代码是 **Android 专属**的：
  #
  #      transport/mod.rs:19   #[cfg(all(feature = "bluetooth", target_os = "android"))]
  #      → transport/ble_android.rs（Android BLE 外设的 JNI 桥）
  #
  #  它只在 Android 目标上编译 —— macOS / Windows 那两条腿都看不见它。
  #  真实事故（2026-09-12）：`generate_handler!` 无条件列出四个 `#[cfg(desktop)]` 命令，
  #  包装宏跟着函数被裁掉 ⇒ Android 目标 **8 个 E0433**，整个安卓包打不出来，
  #  而当时**没有任何守门**（`scripts/check-mobile.sh` 早就写好，但从未接进 CI，纯手工）。
  #
  #  这条腿只做 `cargo check` + 0 warning 判定（不起模拟器、不跑测试）——
  #  `ble_android.rs` 是 JNI 桥、测试跑不了；能拦住的是"编不过"与"有 warning"，
  #  而那正是历史上真实发生过的两种形态。
  #
  #  ⚠️ **引入当天就抓到一个真 bug**：`ble_android.rs` 的 `payload_mtu` 自己算了一遍
  #  载荷预算（硬编码 512/20，且放行 `1..=6` 这类**装不下分片头**的值 ⇒ `fragment`
  #  拒绝一切 ⇒ 整条链路发不出消息）。详见 `scripts/check-ble-constants.mjs` 的判据 C。
  #  这条腿也顺手暴露了 `cargo test` 看不见的死代码（它不编测试、只看产品码）。
  # ---------------------------------------------------------------------------
  android:
    name: Android 编译门禁（aarch64-linux-android）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 定时事件只为了全量护栏 ⇒ 这条腿不在夜间重付。
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # Tauri 的 build.rs 需要 dist/（见文件头说明），必须在 cargo 之前。
      - name: 安装依赖并构建前端（cargo check 依赖 dist/）
        run: |
          npm ci
          npm run build

      # `sdkmanager` 是 Java 工具 ⇒ 必须先有 JDK。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # ⚠️ 必须显式覆盖：该 action 的默认值是 `'tools platform-tools'`，
          # 而 Google 已于 2026-09-15 把 `tools` 包从 SDK 仓库下架 ⇒ sdkmanager 报
          # "Failed to find package 'tools'" 后 exit 1。与 build-android.yml 同一坑。
          packages: 'platform-tools'

      # 只要 NDK：`cargo check` 不需要 platform / build-tools
      #（那两样是出 APK 才要的，见 build-android.yml）。
      - name: 安装 NDK
        run: sdkmanager "ndk;27.1.12297006"

      - name: 设置 NDK 环境（check-mobile.sh 会据此找 clang/ar）
        run: |
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 失败诊断走 ci-run.sh：它把关键行合成**一条多行 check 注解**
      #（注解是唯一可匿名读取的渠道，见该脚本头部）。
      - name: 移动端编译门禁（默认 feature + --features bluetooth，各自 0 warning）
        # 清单只有一份：见 verify.mjs 的 group=android（内部就是 check-mobile.sh --bluetooth）。
        run: bash scripts/ci-run.sh "verify android 组" node scripts/verify.mjs --group android

  # ---------------------------------------------------------------------------
  #  护栏非空转（全量）—— 2026-10-19 之前**没有任何自动触发点**
  #
  #  为什么必须有这两条腿（现读口径，不是猜）：`scripts/verify.mjs` 的护栏步按 `--full` 分档 ——
  #  CI 三个 job 分别跑 `--group frontend` / `rust` / `android`，护栏那一格挂在 group=frontend，
  #  而这些路径都不带 `--full` ⇒ 传给工具的是 `--only frontend`（只扫前端标签那一批）。
  #  全量扫描（含 Rust 用例，每条都要"改坏 → 整库重编译 → 跑 → 逐字节还原"）此前只有人手动
  #  `npm run verify:full -- --full` 才会执行；本地日常批次按用户口径跳过最长那一步
  #  （`verify:local --skip-guard-sweep`）⇒ 于是它实际上没人跑。
  #
  #  ⚠️ 这一族**不许退化成 `--only` 子集**。允许的唯一分法是**按通道全覆盖**：
  #  `guards-cargo` 用 `--lane cargo --shard i/3` 三片取并集，`guards-web` 跑剩下的
  #  `--lane node,script` ⇒ 两片之和必须等于 `GUARD_LANES` 那行报的全部通道。
  #  这条覆盖关系不是靠本注释守的，由 `scripts/check-ci-guard-coverage.mjs` 现算对账
  #  （它自己也是一条护栏用例：摘掉任一条腿的 `--lane` 覆盖，那条用例必须红）。
  #  条数与耗时由扫描工具自己打印（写死在别处的数字一定腐烂）；不设 `continue-on-error`，
  #  红就是红 —— 失败诊断走 `scripts/ci-run.sh` 的注解通道（唯一可匿名读取的渠道）。
  #
  #  为什么不用 `needs`：`needs` 会让定时事件下被跳过的上游把这些也拖成 skipped；
  #  cargo 通道本来就是最慢的一腿，和各片并行跑不会互相抢 Cargo lock（各自独立 runner）。
  #  2026-10-29 起：node+script 这条腿**每次 push/PR 也跑**（13.8s 的护栏本体，整套约 5 分钟）；
  #  cargo 那条整跑 2h39m，仍只在夜间/dispatch 上跑（见文件顶部 `on.schedule` 与它的 `if`）。
  # ---------------------------------------------------------------------------
  #  cargo 通道拆 3 片并行 —— 2026-10-26 按现读耗时定的，不是拍脑袋：
  #  这一条整跑（265 条）实测 **2h39m**（run 515 / id 40237651238：`护栏非空转（全量）`
  #  从 21:54:14Z 跑到 00:33:39Z，结论 success）。本地按通道量到同一个形状：cargo 每条
  #  用例一次整库重编译 25~30s × 143 条 ⇒ 60 分钟以上是地板（`--lane` / `--shard` 就是为
  #  这次拆分加的；每次跑都打印 `GUARD_TIMING`，**要数就数那一行，别抄这里的**）。
  #  为什么不在本地并行：注入改的是同一棵工作树 ⇒ 结构上不能并行；CI 各片独立 runner 才敢拆。
  #  仓库是 public ⇒ macOS 分钟不额外计费，代价只是排队（10-19 那次排了 34 min）。
  guards-cargo:
    name: 护栏非空转 · cargo 通道（分片 ${{ matrix.shard }}/3）
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      # 一片红不许把另外两片一起吃掉：三片各自给出"哪条护栏改坏了也不红"的读数。
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # 单片 ≈ 48 条 × 25s ≈ 20 分钟，另加冷编译与排队 ⇒ 留 55 分钟，宁可慢也不静默截断。
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          # ★ 必须全量历史 —— `actions/checkout` 默认 `fetch-depth: 1` 是浅克隆。
          #   有一条用例的跑法是 `node scripts/check-change-budget.mjs --range 73d9e20~1..73d9e20`
          #   （`scripts/guard_cases/toolchain.py:435`，它特意不用 `--from-json`，因为要守的那段带
          #   `!fromJson` 条件）。浅克隆里 `73d9e20~1` 这个对象根本不存在 ⇒ git 当场报错
          #   ⇒ 注入态与「逐字节恢复核对」**都**红，报出来的形状看着像护栏坏，
          #   其实是这条 CI 腿少给历史。pack 现读 21 MiB ⇒ 全量克隆代价可接受。
          #   那条用例住 script 通道 ⇒ 真跑它的是下面的 `guards-web`，所以 `fetch-depth: 0`
          #   **两条腿都要有**；只装一条的话另一片会白红一整轮。
          fetch-depth: 0

      # 护栏里既有前端用例（跑 `node --test <点名文件>`）也有 Rust 用例（跑 `cargo test`），
      # 而 Tauri 的 build.rs 需要 dist/ ⇒ 两样都得先备好，否则整批用例会以"编译不过"的形状红掉。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 安装依赖并构建前端
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 三片共用一份缓存键 ⇒ 只有第一片付冷编译，另两片命中同一份依赖产物。
          key: guards-cargo

      - name: 护栏非空转（cargo 通道分片）
        shell: bash
        run: >
          bash scripts/ci-run.sh
          "护栏非空转 cargo 分片 ${{ matrix.shard }}/3"
          python3 scripts/verify-guards.py --lane cargo --shard ${{ matrix.shard }}/3

  #  node + script 通道：68 条收窄成 `node_test(<文件>)` 之后（2026-10-26 实测
  #  node 通道 89 条合计 133.7s、script 通道 33 条合计 32.6s），这一腿整跑不到 5 分钟，
  #  没必要再拆。⚠️ 它为什么也要 Rust 工具链：script 通道里
  #  `node scripts/check-test-manifest.mjs --only rust` 那条**内部会起 cargo** 去 dump 名单，
  #  少了工具链它会以另一种形状红（看着像清单坏，其实是环境缺件）。
  guards-web:
    name: 护栏非空转 · node + script 通道
    runs-on: macos-latest
    # 2026-10-29（审计 TST-03）：这一腿**每次 push/PR 都跑**。原先两条腿都只在
    # schedule/dispatch 上跑 ⇒ 新增或改坏的守卫最长 24 小时无人验证。
    # 这里只挪**便宜的这条**：护栏本体实测 13.8s（`verify-guards.py --lane node --lane script`），
    # 整腿含 npm ci/build 约 5 分钟；cargo 那条整跑 2h39m，留在夜间。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 同 `guards-cargo`：那条 change-budget 用例要跑真实历史，浅克隆会让它两头都红。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 安装依赖并构建前端
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 与 cargo 那三条腿分开一份键：这一腿的产物是 `--list` dump 用的壳，混用会互相顶掉。
          key: guards-web

      - name: 护栏非空转（node + script 通道）
        shell: bash
        run: >
          bash scripts/ci-run.sh
          "护栏非空转 node+script"
          python3 scripts/verify-guards.py --lane node,script

  # ---------------------------------------------------------------------------
  #  静态检查（2026-10-21 首次接入）：ruff / shellcheck / markdownlint
  #
  #  这三样在本仓此前**全为 0**。规则集刻意从"最小可守"开始（见 ruff.toml 与
  #  .markdownlint-cli2.jsonc 顶部），先让判据本身可信，再按批次加严 ——
  #  与 docs/architecture/backend-modernization.md "不一次性扫全仓"的既有口径一致。
  #  这一条腿很快（约 1 分钟），不占 push 的大头，所以每次 push / PR 都跑。
  # ---------------------------------------------------------------------------
  lint:
    name: 静态检查（ruff / shellcheck / markdownlint）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Python（ruff，固定版本）
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx run ruff==0.17.1 check scripts

      - name: Shell（shellcheck）
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning --exclude=SC2034 $(git ls-files '*.sh')

      - name: Markdown（markdownlint-cli2，固定版本）
        run: npx --yes markdownlint-cli2@0.18.1

  # ---------------------------------------------------------------------------
  #  供应链审计：cargo-deny（许可证 / 禁用项 / 来源）+ cargo-audit（RustSec）
  #
  #  ⚠️ 2026-10-24（审计 SEC-02）：原先这条腿只在 schedule / workflow_dispatch 跑，
  #  push 与 PR **完全不跑** —— 等于"依赖里出现了一条有公告的版本"可以一路合进 main，
  #  只有当晚定时的那一轮才会红，而且没人看定时红。审计要的就是"合入前拦下"，
  #  所以改成与其它腿同档：**每次 push / PR 都跑**（顺带保留 schedule 那一轮，
  #  它还能发现"上游今天刚发了新公告"这类与提交无关的漂移）。
  #  cargo-audit 本机已有、cargo-deny 在 CI 用 taiki-e/install-action 装二进制（不编译）。
  # ---------------------------------------------------------------------------
  supply-chain:
    name: 供应链审计（cargo-deny + cargo-audit）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo-deny（advisories / bans / licenses / sources）
        working-directory: src-tauri
        run: cargo deny check

      - name: cargo-audit（RustSec 漏洞库）
        working-directory: src-tauri
        # ⚠️ 这三条 --ignore 与 deny.toml 的 `[advisories].ignore` 是**同一份风险接受**，
        # 两处必须一起改：cargo-deny 与 cargo-audit 读的是同一个 RustSec 库，
        # 只改一处会出现"deny 绿、audit 红"（或反过来）的自相矛盾门禁。
        # 理由（签名校验后才解包、且只在 Windows 更新路径）写在 deny.toml 那段注释里。
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369
