name: Publish updater manifest

# 四个构建 workflow 各自创建/补充同一个 Release；本 workflow 在 tag 推上来之后
# 轮询等待 updater 产物齐（macOS .app.tar.gz + .sig、Windows 安装包 + .sig），
# 然后生成并上传 `latest.json`。少一个平台就超时红 —— 不生成"看起来能用"的残缺清单。
#
# ⚠️ 触发方式不能写 `on: release: types: [published]`（2026-10-22 review 抓到）：
#    三个构建 workflow 用的都是 `${{ github.token }}`（GITHUB_TOKEN）创建 Release，
#    而 GitHub 明确规定 **GITHUB_TOKEN 触发的事件不会再启动新的 workflow run**（防递归）。
#    于是 `published` 永远等不到 ⇒ latest.json 永远不生成，而构建全绿、没人会发现。
#    改成 tag push 触发，再轮询等 Release 与产物齐（Release 由构建 workflow 创建）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要补发清单的 tag（vX.Y.Z）"
        required: true

permissions:
  contents: write

concurrency:
  group: updater-manifest-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate tag
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "非法 tag：$RAW_TAG" >&2
            exit 1
          fi
          echo "TAG=$RAW_TAG" >> "$GITHUB_ENV"

      - name: Checkout release files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            scripts/updater-manifest.mjs
            CHANGELOG.md
            package.json
          fetch-depth: 1

      # 清单里的 version 来自 tag、url 来自 tag；tag 与 package.json 不一致时，
      # 客户端会看到"版本 5.4.1 的更新说明配 5.5.0 的包"（或者干脆不认为有新版本）。
      # 构建 workflow 不查这一条，所以必须在这里拦。
      - name: Check tag matches package.json
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "$TAG" ]; then
            echo "tag $TAG 与 package.json $pkg 不一致 ⇒ 拒绝生成清单" >&2
            exit 1
          fi

      - name: Wait for all release assets（草稿态走列表 API）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          # ★ draft-until-complete（2026-10-23）：四条构建腿现在只创建/补挂**草稿**，
          #   谁先跑完都不能把半个 Release 对外公开；发布由本 workflow 在四类产物齐了之后统一做。
          #   草稿对 `releases/tags/<tag>` 可能 404（本仓 2026-10-22 实测）⇒ 一律用列表 API 拿 id。
          # ★ 2026-10-25：列表里可能有**同 tag 的多个草稿**（并发创建事故，v5.8.0 出现过 4 个）。
          #   以前 `head -1` 会挑中空的那个、白等 45 分钟；现在取**资产最多**的那个。
          while [ "$SECONDS" -lt "$deadline" ]; do
            rel_id=$(gh api "repos/$REPO/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$TAG\")] | sort_by(.assets | length) | reverse | .[0].id // empty" 2>/dev/null | head -1 || true)
            names=""
            if [ -n "$rel_id" ]; then
              names=$(gh api "repos/$REPO/releases/$rel_id" --jq '.assets[].name' 2>/dev/null || true)
            fi
            ok=1
            # 四类产物：桌面 updater（.app.tar.gz + setup.exe）、内置 WebView2 档、
            # Android 两个 ABI、macOS dmg。签名是否成对交给 updater-manifest.mjs 做最后裁决（它会直接红）。
            for needle in \
              "Gosslan-arm64.app.tar.gz" "Gosslan-x86_64.app.tar.gz" \
              "_x64-setup.exe" "_arm64-setup.exe" \
              "_x64-setup-webview2-bundled.exe" "_arm64-setup-webview2-bundled.exe" \
              "-arm64-v8a-release.apk" "-armeabi-v7a-release.apk" \
              "_x64.dmg" "_aarch64.dmg"; do
              if ! printf '%s\n' "$names" | grep -Fq -- "$needle"; then
                echo "等待：$needle"
                ok=0
              fi
            done
            if [ "$ok" -eq 1 ]; then
              echo "四类资产齐全 ⇒ 进入收口（release id ${rel_id}）"
              echo "REL_ID=$rel_id" >> "$GITHUB_ENV"
              exit 0
            fi
            # 快速失败（2026-10-22）：构建已经红了就别再等满 45 分钟 ——
            # v5.5.17 与 v5.5.18 各白等过一整轮，而真因（签名 secret）早就写在构建注解里了。
            # 只认**每个 workflow 最新一次**运行的结论，避免被同提交上的旧失败 run 误判。
            failed=$(gh run list --repo "$REPO" --commit "$GITHUB_SHA" --limit 30 \
              --json workflowName,conclusion,createdAt \
              --jq '[group_by(.workflowName)[] | max_by(.createdAt) | select(.conclusion=="failure") | .workflowName] | join(", ")' \
              2>/dev/null || true)
            case "$failed" in
              *"Build macOS"*|*"Build Windows"*|*"Build Android"*)
                echo "::error title=构建已失败::不再等产物。失败的 workflow：${failed}（先看它的注解，签名问题的原因在那里）" >&2
                exit 1 ;;
            esac
            sleep 30
          done
          echo "等待产物超时（45 分钟）；不生成 latest.json、不发布 Release" >&2
          exit 1

      - name: Download updater assets（按资产 id，草稿也下得动）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh api "repos/$REPO/releases/$REL_ID/assets?per_page=100" \
            --jq '.[] | "\(.id)\t\(.name)"' > /tmp/assets.tsv
          while IFS=$'\t' read -r id name; do
            case "$name" in
              Gosslan-*.app.tar.gz|*.sig|*_x64-setup.exe|*_arm64-setup.exe|*.nsis.zip)
                gh api "repos/$REPO/releases/assets/$id" \
                  -H "Accept: application/octet-stream" -H "Cache-Control: no-cache" > "assets/$name" ;;
            esac
          done < /tmp/assets.tsv
          printf '下载完成：%s 个文件\n' "$(find assets -type f | wc -l | tr -d ' ')"

      - name: Build latest.json
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # REPO 必须从 env 传进来：脚本默认值只是本地调试的兜底，
          # fork 或改名后会把 url 指到别人的仓库。
          node scripts/updater-manifest.mjs \
            --dir assets --tag "$TAG" --repo "$REPO" \
            --out latest.json --changelog CHANGELOG.md

      - name: Upload latest.json（按资产 id，草稿也能传）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 重跑时同名资产会 422（already_exists）⇒ 先删后传（等价于 --clobber）。
          existing=$(gh api "repos/$REPO/releases/$REL_ID/assets?per_page=100" \
            --jq '.[] | select(.name=="latest.json") | .id' 2>/dev/null | head -1 || true)
          if [ -n "$existing" ]; then
            gh api --method DELETE "repos/$REPO/releases/assets/$existing" >/dev/null
          fi
          gh api --method POST "repos/$REPO/releases/$REL_ID/assets?name=latest.json" \
            -H "Content-Type: application/octet-stream" --input latest.json >/dev/null
          echo "latest.json 已挂到 release ${REL_ID}（仍是草稿）"

      - name: Publish Release（四类资产 + latest.json 齐了才取消草稿）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$REPO/releases/$REL_ID" -F draft=false >/dev/null
          echo "Release $TAG 已发布（桌面 updater / WebView2 / APK / dmg / latest.json 全齐）"

      - name: Verify public manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/$REPO/releases/download/$TAG/latest.json"
          for i in 1 2 3 4 5; do
            if curl -fsSL "$url" -o /tmp/latest.json; then break; fi
            sleep 10
          done
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync("/tmp/latest.json","utf8"));
            const need=["darwin-aarch64","darwin-x86_64","windows-x86_64","windows-aarch64"];
            for (const p of need) {
              if (!m.platforms?.[p]?.url || !m.platforms[p].signature) throw new Error("缺平台 "+p);
            }
            if (m.version !== process.env.TAG.replace(/^v/,"")) throw new Error("版本与 tag 不一致");
            console.log("latest.json 可公开访问，四个平台齐全，版本", m.version);
          '
