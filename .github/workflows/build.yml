name: Build Windows (x64 + ARM64)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    timeout-minutes: 60
    # 两个架构：**最新**（Windows on ARM）+ **稍老/主流**（Intel & AMD 的 x64）。
    # 不发 i686（32 位）：Windows 11 没有 32 位版本，32 位整机份额已可忽略。
    # ⚠️ NSIS 安装包没有 universal 的概念（不像 macOS 的 .app）——按架构各出一个是惯例
    # （VS Code / Chrome / Firefox 的 Windows 下载页都是这么列）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: x64
          - target: aarch64-pc-windows-msvc
            label: arm64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # 只在 tag 上跑；理由与 build-macos.yml 的同名步骤逐字相同（缺 Secret 时
      # Tauri 要等整个 release 编完才报错，annotation 里只剩一句 exit code 1）。
      - name: Preflight updater signing secrets (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            Write-Error "::error title=tag 构建缺 TAURI_SIGNING_PRIVATE_KEY::自动更新产物（NSIS + .sig）需要签名。去仓库 Settings → Secrets and variables → Actions 添加 TAURI_SIGNING_PRIVATE_KEY 与 TAURI_SIGNING_PRIVATE_KEY_PASSWORD（见 docs/updates.md §2）。"
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:PASS)) {
            Write-Host "签名私钥已配置（长度 $($env:KEY.Length)），密码为空（仅当私钥未加密时才正确）"
          } else {
            Write-Host "签名私钥已配置（长度 $($env:KEY.Length)），密码已配置"
          }

      - name: Build Windows installer (NSIS)
        # ⚠️ `--features bluetooth` 不能少：BLE 传输在 Cargo 里是**可选 feature**
        # （ADR-0015 §2：不开时依赖不下载、代码不编译）。漏了它打出来的包
        # **就是没有蓝牙**，而构建照样"成功"——设置页的蓝牙开关永远起不来。
        # 用 matrix.target 而不是 `npm run dist:win`：后者硬编码 x64，
        # 在 arm64 那个 job 里会打出 x64 包却按 arm64 命名上传。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: |
          # ⚠️ 不要用 `$args` 当局部数组再 `@args` splatting：`$args` 是 PowerShell 的
          # **自动变量**（脚本块里代表未绑定参数），赋值后能否按数组展开取决于宿主实现。
          # 2026-10-22 v5.5.0 的两次 Windows 构建都"构建成功、上传安装包失败"——
          # 上传路径按 `${{ matrix.target }}` 取，产物却不在那里，最可能就是
          # `--target` 没真正传进去（落在默认 `target/release`）。改成按分支写两条
          # 完整命令，参数一个都不过手；与 build-macos.yml 同一条口径。
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            npm run tauri -- build --features bluetooth --bundles nsis --target $env:TARGET `
              --config src-tauri/tauri.updater.conf.json
          } else {
            npm run tauri -- build --features bluetooth --bundles nsis --target $env:TARGET
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke — the shipped exe must at least LOAD
        # ⚠️ 只对**与 runner 同架构**的那条腿跑（`windows-latest` 是 x64）：
        # arm64 是交叉编译产物，在 x64 Windows 上跑必然会以"入口点/架构不匹配"失败 ——
        # 那是**冒烟自己**的问题，不是包坏了（2026-10-22 实测：arm64 腿红在 exit 1，
        # x64 腿通过 ⇒ 发行版 exe 能正常加载）。
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        # 为什么加这条（2026-10-22）：`verify` 的 Windows **单测**腿在测试 exe 加载期就死
        # （`0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND`），而发布链路一直是绿的 ——
        # 但"能打包"不等于"能加载"。这条只回答一个业务问题：**发出去的 exe 起得来吗**。
        # 判据只认"加载期死亡"：GUI 在无桌面会话下提前退出属于正常，不判红。
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $exe = "src-tauri/target/$($env:TARGET)/release/gosslan.exe"
          if (-not (Test-Path $exe)) { Write-Error "找不到 $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            $code = [uint32]$p.ExitCode
            Write-Host ("进程已退出 code=0x{0:X8}" -f $code)
            # 0xC0000139 = 入口点缺失；0xC0000135 = DLL 缺失；0xC0000142 = DLL 初始化失败
            if ($code -in @(0xC0000139, 0xC0000135, 0xC0000142)) {
              Write-Error ("exe 在**加载期**就死了（0x{0:X8}）⇒ 这个安装包发出去用户也打不开" -f $code)
              exit 1
            }
            Write-Host "不是加载期失败（GUI 无桌面会话下提前退出属正常）"
          } else {
            Write-Host "exe 已稳定运行 8s（未在加载期崩溃）"
            Stop-Process -Id $p.Id -Force
          }

      - name: Verify the installer really contains Bluetooth
        shell: pwsh
        # 旁证：开了 bluetooth feature ⇒ btleplug 会被链进去，Cargo.lock 里必然出现它。
        # 这条护栏拦的是"构建成功了但 feature 没生效"这类**静默**故障。
        run: |
          $lock = Get-Content src-tauri/Cargo.lock -Raw
          if ($lock -notmatch '(?m)^name = "btleplug"') {
            Write-Error "Cargo.lock 里没有 btleplug ⇒ 这个包没有蓝牙（是不是漏了 --features bluetooth？）"
            exit 1
          }
          Write-Host "Cargo.lock 含 btleplug —— 蓝牙 feature 已生效"

      # 失败时最需要的读数：产物到底落在哪个目录。2026-10-22 v5.5.0 两次构建都是
      # "构建成功、上传安装包失败"，而日志里看不到 target 目录树，只能猜参数有没有生效。
      - name: List bundle output (diagnostic)
        if: always()
        shell: pwsh
        run: |
          $base = "src-tauri/target/${{ matrix.target }}/release/bundle"
          if (Test-Path $base) {
            Get-ChildItem -Recurse -File $base |
              Select-Object -First 40 FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "MISSING: $base"
            Get-ChildItem "src-tauri/target" -Directory -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gosslan-windows-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # 只上传签名与 Tauri 的 updater 包（若有 .nsis.zip 一并带上）；
      # 基础 exe 已经在上一步上传，更新清单可以直接指向它。
      - name: Prepare updater artifacts (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $dir = "src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          New-Item -ItemType Directory -Force -Path updater-assets | Out-Null
          $found = 0
          Get-ChildItem $dir -Filter "*.sig" | ForEach-Object {
            $artifact = $_.FullName.Substring(0, $_.FullName.Length - 4)
            if (Test-Path $artifact) {
              Copy-Item $artifact "updater-assets/$(Split-Path $artifact -Leaf)"
              Copy-Item $_.FullName "updater-assets/$($_.Name)"
              $found += 1
            }
          }
          if ($found -eq 0) { Write-Error "没有带签名的 updater 产物（检查 TAURI_SIGNING_PRIVATE_KEY）"; exit 1 }
          Get-ChildItem updater-assets

      - name: Upload updater artifacts (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: gosslan-windows-updater-${{ matrix.label }}
          path: updater-assets/*
          if-no-files-found: error
          retention-days: 14

  # 一个 workflow 一个收尾发布 job：所有 matrix 腿打完包、产物也上传成功之后，
  # 由这**唯一一条**任务把文件挂到 Release 上。
  #
  # 为什么必须这样（2026-09-30 在 v4.31.37 上实测到）：原来是每条 matrix 腿各自调
  # `softprops/action-gh-release`，于是同一个 tag 上有多条腿并发"创建/更新同一个 Release"。
  # 那一版 Windows x64 那条腿**构建、蓝牙 feature 旁证、上传产物三步全成功**，
  # 只红在"挂发布页"那一步，而同一次 run 的 arm64 腿成功 ⇒ Release 少一份安装包，
  # 而且是**概率性**少（同批 mac 两腿与 Android 恰好都抢赢了）。
  #
  # 现在：① 每个 workflow 只发一次；② "Release 已存在"走查询而不是并发创建；
  # ③ 挂文件带退避重试（并发窗口是秒级）；④ 任何一次真失败仍然 exit 1 ——
  #    绝不加 `continue-on-error`：把发布失败静音，比少一份产物危险得多（§十五）。
  release:
    name: 挂到 GitHub Release（单一任务·带重试）
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 取出发布脚本（发布逻辑只在 scripts/ 那一处）
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/publish-release-assets.sh
          fetch-depth: 1
      - name: 取回本次构建的产物
        uses: actions/download-artifact@v4
        with:
          pattern: gosslan-windows-*
          merge-multiple: true
          path: assets
      # ★ 发布逻辑不在这里抄第三份：三份内联 shell 是同一件事的三个家（2026-09-30 那条并发红
      # 就是这样被复制三遍的）。唯一的一份在 `scripts/publish-release-assets.sh`，
      # 它的七种结局由 `scripts/publishRelease.test.ts` 用假 `gh` 在本地判（不需要凭据）。
      - name: 挂到 Release（创建幂等 + 上传退避重试）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release-assets.sh --assets assets --label base
