name: Build macOS (arm64 + x86_64)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    timeout-minutes: 60
    # **分架构出两份**，不打 universal：universal 把两份二进制拼进一个 .app，体积翻倍，
    # 而用户只可能用到其中一份（Apple 芯片 / Intel 二选一）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: arm64
          - target: x86_64-apple-darwin
            label: x86_64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (Intel + Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 只在 tag 上跑：main 的日常构建不生成 updater 产物、不需要私钥。
      # 为什么单开一步而不是塞进构建里（2026-10-22 v5.5.1 实测）：缺 Secret 时 Tauri 是在
      # **编完整个 release（约 7 分钟）之后**、签名那一步才报错 ⇒ 日志尾巴只有一句
      # "Process completed with exit code 1"，谁都看不出是配置问题。把这件事提前到第 5 秒，
      # 并且用 `::error title=` 让它出现在 GitHub 的注解里（注解只抓带 error 的行）。
      - name: Preflight updater signing secrets (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error title=tag 构建缺 TAURI_SIGNING_PRIVATE_KEY::自动更新产物（.app.tar.gz + .sig）需要签名。去仓库 Settings → Secrets and variables → Actions 添加 TAURI_SIGNING_PRIVATE_KEY（~/.tauri/gosslan-updater.key 的完整内容）与 TAURI_SIGNING_PRIVATE_KEY_PASSWORD（同名 .password 的完整内容）。步骤见 docs/updates.md §2。"
            exit 1
          fi
          # ⚠️ 只查"非空"不够（2026-10-22 实测：secrets 配好后 tag 构建仍红在签名）：
          # 把私钥按 base64 解一次，确认它真的是 minisign 私钥 —— 常见错法是**粘成文件路径**
          # 或**被截断**，那样只会在编完 7 分钟后以一句 exit code 1 收场。
          key_norm="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          if ! decoded="$(printf '%s' "$key_norm" | base64 --decode 2>/dev/null)"; then
            # 只报**非法字符的集合**（不报位置、不报内容）：合法密钥的集合必然是空的，
            # 所以这不会泄漏任何密钥字节；而它能把"贴成了路径 / 带着引号 / 被截断"直接区分开。
            bad="$(printf '%s' "$key_norm" | tr -d 'A-Za-z0-9+/=' | fold -w1 | sort -u | tr -d '\n')"
            echo "::error title=TAURI_SIGNING_PRIVATE_KEY 不是合法 base64::长度 ${#key_norm}（正确值 348，且必须是 4 的倍数）；出现非法字符：[${bad}]。正确值是 ~/.tauri/gosslan-updater.key 的**完整内容**，以 dW50cnVzdGVkIGNvbW1lbnQ6 开头，**不是路径**。若非法字符为空而长度不对 ⇒ 粘贴被截断。"
            exit 1
          fi
          case "$decoded" in
            untrusted\ comment:*) echo "私钥可解码为 minisign 私钥（base64 长度 ${#key_norm}）" ;;
            *) echo "::error title=TAURI_SIGNING_PRIVATE_KEY 不是 minisign 私钥::解出来不是以 'untrusted comment:' 开头 —— 多半是把**文件路径**填进去了，或复制时截断。"
               exit 1 ;;
          esac
          if [ -n "${PASS:-}" ]; then pstate="已配置"; else pstate="为空（仅当私钥未加密时才正确）"; fi
          echo "签名私钥已配置（长度 ${#KEY}），密码${pstate}"

          # ⚠️ 2026-10-23：私钥合法 ≠ 密码配套。v5.5.23 的两个 tag 构建都红在**编完之后**
          # 的签名步，而外部读不到 job 日志（匿名 403）⇒ 只剩一句 exit code 1。
          # 这里真的签一次临时文件，5 秒内就能在注解里看到是哪一半不对；
          # 顺带把粘贴常带的行尾空白去掉（密码文件本身 44 字节含结尾换行，正文是 43 字符）。
          key_norm="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          pass_norm="$(printf '%s' "${PASS:-}" | tr -d '\r\n')"
          printf 'gosslan release preflight\n' > "$RUNNER_TEMP/sign-preflight.txt"
          if ! TAURI_SIGNING_PRIVATE_KEY="$key_norm" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$pass_norm" \
               npm run tauri -- signer sign "$RUNNER_TEMP/sign-preflight.txt" >/dev/null 2>&1; then
            echo "::error title=签名私钥与密码不配套::私钥 ${#key_norm} 字符、密码 ${#pass_norm} 字符。正确密码是 ~/.tauri/gosslan-updater.password 去掉结尾换行后的 43 个字符（不是路径、不带 % 或换行）。"
            exit 1
          fi
          echo "签名自检通过（私钥 ${#key_norm} 字符、密码 ${#pass_norm} 字符）"

      - name: Build .app + .dmg (${{ matrix.label }})
        # ★ 为什么这里要重试而不是直接跑一条：`bundle_dmg.sh`（hdiutil attach + Finder 排版）在
        #   macOS runner 上是**已知会偶发失败**的一步。2026-09-30 实测：同一个 `x86_64` 腿
        #   11:17 那趟（v4.31.41）绿、12:23 这趟（main）红，两次输入一字未变（那次提交没动应用码也没动
        #   这份文件），日志里 vite build ✅、cargo 4m40s ✅、`Built application` ✅、`Bundling Gosslan.app` ✅，
        #   只有 `Running bundle_dmg.sh` 之后 exit 1。
        #   偶发的正确处置是**有界重试**，绝不是 `continue-on-error` —— 那会把"Release 少一档安装包"
        #   静音成绿（v4.31.37 就是这么丢的 Windows x64）。三次仍失败 ⇒ 判红，不装成功。
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 粘贴带行尾空白时（密码最常见）在这里统一去掉，别让签名在编完之后才炸。
          TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY:-}" | tr -d '[:space:]')"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" | tr -d '\r\n')"
          export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          rel="src-tauri/target/$TARGET/release"
          app="$rel/bundle/macos/Gosslan.app"
          # 只有 tag 构建生成/签名 updater 产物：main 的日常构建不需要私钥，也不会因为
          # 还没配 Secrets 而整条 CI 变红；正式发版缺 Secrets 则当场红（不静默降级）。
          #
          # ⚠️ macOS runner 的 /bin/bash 是 3.2：`set -u` 下展开**空数组** `"${arr[@]}"`
          # 会报 unbound variable ⇒ main 分支（不带 --config）的每一次构建都会红。
          # 这里按分支写两条完整命令，不依赖空数组展开。
          #
          # ⚠️ 不再让 Tauri 出 dmg（`--bundles app` 只出 .app + updater 产物）：
          #     v5.5.0 的 tag 构建在 CI 上**两个 mac job 都红**在 `--bundles dmg` 的
          #     bundle_dmg.sh —— 它在 `find_mount_dir` 里用 `grep -E` 匹配设备名，
          #     BSD grep 报 "brackets not balanced" ⇒ 找不到挂载点 ⇒ 整个 job 红，
          #     连带 updater 真正需要的 `.app.tar.gz` 都不生成。
          #     dmg 改由下一步 `hdiutil create` 直接产出（无挂载、无 AppleScript）。
          do_build() {
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              npm run tauri -- build --target "$TARGET" --features bluetooth --bundles app \
                --config src-tauri/tauri.updater.conf.json
            else
              npm run tauri -- build --target "$TARGET" --features bluetooth --bundles app
            fi
          }
          attempt=0
          while :; do
            if do_build; then
              break
            fi
            attempt=$((attempt + 1))
            # 只重试"二进制都编出来了、只有打包那一步挂"这一种形状：编译错、依赖缺、
            # 配置错重试三次只是拖慢红灯。
            if [ ! -x "$rel/gosslan" ]; then
              echo "第 $attempt 次失败且 $rel/gosslan 没产出 ⇒ 编译/链接问题，不是打包偶发，不重试" >&2
              exit 1
            fi
            if [ -d "$app" ]; then
              echo "第 $attempt 次失败但 .app 已经在 ⇒ 挂在打包之后那一步，重试没有意义" >&2
              exit 1
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "连试 $attempt 次都没打出 $TARGET 的 .app ⇒ 不再当偶发处理，判红" >&2
              exit 1
            fi
            echo "第 $attempt 次：二进制在、.app 没出 ⇒ 20s 后重试整步（cargo 有缓存）"
            sleep 20
          done
          ls -l "$rel/bundle/macos"

      - name: Package .dmg
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app="src-tauri/target/$TARGET/release/bundle/macos/Gosslan.app"
          out="src-tauri/target/$TARGET/release/bundle/dmg"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "$TARGET" in
            aarch64-apple-darwin) arch=aarch64 ;;
            x86_64-apple-darwin)  arch=x64 ;;
            *) echo "未知 target：$TARGET" >&2; exit 1 ;;
          esac
          stage=$(mktemp -d)
          # 拖拽安装的惯例：镜像根放 .app + Applications 快捷方式。
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          dmg="$out/Gosslan_${version}_${arch}.dmg"
          mkdir -p "$out"
          rm -f "$dmg"
          # `-srcfolder` 复制的是**该目录的内容**，所以传 stage（里面才是 .app）。
          hdiutil create -volname "Gosslan" -srcfolder "$stage" -ov -format UDZO "$dmg"
          rm -rf "$stage"
          ls -lh "$dmg"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: gosslan-macos-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      # updater 的 macOS 产物是 .app.tar.gz + .sig（不是 .dmg）。两腿同名，
      # 这里按 label 改成 `Gosslan-<label>.app.tar.gz`，否则 release 上后一腿会覆盖前一腿。
      - name: Prepare updater artifacts (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p updater-assets
          shopt -s nullglob
          n=0
          for f in "src-tauri/target/$TARGET/release/bundle/macos/"*.app.tar.gz; do
            cp "$f" "updater-assets/Gosslan-$LABEL.app.tar.gz"
            if [ ! -f "$f.sig" ]; then
              echo "缺少 $f.sig ⇒ 签名没有生成（检查 TAURI_SIGNING_PRIVATE_KEY）" >&2
              exit 1
            fi
            cp "$f.sig" "updater-assets/Gosslan-$LABEL.app.tar.gz.sig"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "没有 .app.tar.gz ⇒ updater 产物没有生成（检查 --config 与 createUpdaterArtifacts）" >&2
            exit 1
          fi
          ls -l updater-assets

      - name: Upload updater artifacts (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: gosslan-macos-updater-${{ matrix.label }}
          path: updater-assets/*
          if-no-files-found: error
          retention-days: 14

  # 一个 workflow 一个收尾发布 job：所有 matrix 腿打完包、产物也上传成功之后，
  # 由这**唯一一条**任务把文件挂到 Release 上。
  #
  # 为什么必须这样（2026-09-30 在 v4.31.37 上实测到）：原来是每条 matrix 腿各自调
  # `softprops/action-gh-release`，于是同一个 tag 上有多条腿并发"创建/更新同一个 Release"。
  # 那一版 Windows x64 那条腿**构建、蓝牙 feature 旁证、上传产物三步全成功**，
  # 只红在"挂发布页"那一步，而同一次 run 的 arm64 腿成功 ⇒ Release 少一份安装包，
  # 而且是**概率性**少（同批 mac 两腿与 Android 恰好都抢赢了）。
  #
  # 现在：① 每个 workflow 只发一次；② "Release 已存在"走查询而不是并发创建；
  # ③ 挂文件带退避重试（并发窗口是秒级）；④ 任何一次真失败仍然 exit 1 ——
  #    绝不加 `continue-on-error`：把发布失败静音，比少一份产物危险得多（§十五）。
  release:
    name: 挂到 GitHub Release（单一任务·带重试）
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    # ★ 2026-10-25 实锤：v5.8.0 的 Release 列表里出现了 **4 个同 tag 草稿**，只有 1 个带资产；
    #   `updater-manifest` 的 `head -1` 恰好挑中空的那个 ⇒ 白等 45 分钟超时。
    #   根因：四条腿**同时**查询"Release 不存在"→ 四条都创建成功（GitHub 不拦同 tag 并发创建）。
    #   并发组只在 `release` 任务上（构建仍并行），由 GitHub 跨 workflow 串行化同一个 tag 的发布。
    concurrency:
      group: publish-release-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # 发布门禁（`publish-release-assets.sh`）要读 verify.yml 的 run 结论；
      # 声明了 permissions 块 ⇒ 未列出的 scope 一律 none，漏了这条整步 403 ⇒ 永远不发版。
      actions: read
    steps:
      - name: 取出发布脚本（发布逻辑只在 scripts/ 那一处）
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/publish-release-assets.sh
          fetch-depth: 1
      - name: 取回本次构建的产物
        uses: actions/download-artifact@v4
        with:
          pattern: gosslan-macos-*
          merge-multiple: true
          path: assets
      # ★ 发布逻辑不在这里抄第三份：三份内联 shell 是同一件事的三个家（2026-09-30 那条并发红
      # 就是这样被复制三遍的）。唯一的一份在 `scripts/publish-release-assets.sh`，
      # 它的七种结局由 `scripts/publishRelease.test.ts` 用假 `gh` 在本地判（不需要凭据）。
      - name: 挂到 Release（创建幂等 + 上传退避重试）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release-assets.sh --assets assets --label base
