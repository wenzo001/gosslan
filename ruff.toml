# Python lint（ruff）—— 2026-10-21 首次接入。
#
# 规则集刻意从"最小可守"开始：只开会让脚本直接坏掉 / 名字写错的规则，
# 先让判据本身可信，再按批次加严。当前 `scripts/` 用默认规则会有 106 条
# （67 条 ISC004、12 条 EXE001、11 条 F401 等），那些属于后续清理项，
# 不在首次接入时一次性扫全仓（与 docs/architecture/backend-modernization.md
# "不一次性扫全仓"的既有口径一致）。
target-version = "py311"
line-length = 100

[lint]
select = [
  "E9",  # 语法/IO 类硬错误
  "F63", # 无效的 `is` 比较
  "F7",  # 语法错误（F701/F702/F704/F706/F707/F722）
  "F82", # 未定义名字（跑起来必炸）
]
