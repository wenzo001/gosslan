[package]
name = "gosslan"
version = "5.14.16"
description = "Gosslan — 无服务器 P2P 局域网即时通讯"
authors = ["wd.f"]
edition = "2021"
rust-version = "1.77"
# 这是 Tauri 应用的库/二进制 crate，不发布到 crates.io；cargo-deny 的
# `[licenses].private.ignore` 靠这个标记识别"工作区私有包"（2026-10-21）。
publish = false

# 库目标供 Tauri 加载，同时保留二进制入口
[lib]
name = "gosslan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# BLE GATT 后端（**可选**，见 [features] bluetooth 与 ADR-0015）。
# 放在主 [dependencies] 而不是某个 target 段：它跨平台（CoreBluetooth / WinRT / BlueZ / Android），
# 且因为是 optional，默认构建既不会下载也不会编译它。
#
# 这里保持**上游语义**（`version = "0.13"`）；打补丁的副本用文件末尾的
# `[patch.crates-io]` 覆盖过去 —— 这样版本约束仍然表达"我要 0.13 这条线"。
btleplug = { version = "0.13", optional = true }
# 消费 BLE 的通知流需要 `StreamExt`（btleplug 只把它作为内部依赖，不 re-export）。
# 同样 optional：默认构建不引入。
futures = { version = "0.3", optional = true }

# tray-icon：系统托盘（关闭主窗口仅隐藏到托盘，退出走托盘菜单）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 外部链接「从线上 JSON 导入」：后端拉取可绕开 WebView 的 CORS 限制。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
async-trait = "0.1"
# 启动期边界错误用 derive 生成 Display/Error/From（MIT OR Apache-2.0，MSRV 1.77 与本仓一致；
# 已在依赖树里）。决策记录与分批：docs/architecture/backend-modernization.md §2（B2）。
thiserror = "2"
# 目录递归遍历 / UTC 日期：两件事标准库都没有省心的等价物，而这两个 crate 早在依赖树里
# （walkdir 是 tauri 的间接依赖、time 是 notify-rust 的间接依赖）。2026-10-21 减冗批：
# `storage/cache_cleaner.rs` 的手写深度栈换成 walkdir（仍不跟随软链），`logging.rs` 的
# 手写 civil_from_days 换成 time。决策记录：docs/architecture/backend-modernization.md §B8。
walkdir = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
socket2 = { version = "0.5", features = ["all"] }
# `hooks` feature：给 SQLite 装 `sqlite3_progress_handler`（决策 2 的 VACUUM 时间预算靠它
# 在语句执行途中中止）。它是 `hooks = []` —— 不引入任何新依赖，Cargo.lock 不变。
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hostname = "0.3"
if-addrs = "0.13"
base64 = "0.22"
# ---- E2EE 与 P2P 安全 ----
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

# 桌面系统通知：直接用 notify-rust（与 tauri-plugin-notification 用的是同一个底层库，
# 版本也保持一致）。原因见 src/notifications.rs 头注释：插件的 show() 把真正的错误
# spawn 掉丢了，用户报"收不到通知"时无法定位。
[target.'cfg(any(target_os = "macos", windows, target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
notify-rust = "4.11"

# 单实例守卫：第二次启动（多点一次图标 / 由通知唤起）不许再起一份完整应用 ——
# 两个进程 = 两扇主窗 + 两个托盘图标 + 两份 mesh 身份，同一条好友申请会被两个进程各弹一次通知
#（用户 2026-10-14「同时启动了两个程序」）。守卫本身给开发/测试的双实例出口留了开关，
# 见 lib.rs 的 `allow_second_instance_launch`。
# ⚠️ 这里的平台清单必须与 lib.rs 注册处的 `cfg` **同一组**（上游只支持这三家桌面，
#    给 android/ios 装上会编译失败；有一条源码判据钉着两边一致）。
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# machine-uid 0.5 上游不支持 Android/iOS（`machine_id` 模块仅对 linux/macos/windows 等定义），
# 在 aarch64-linux-android 目标上会编译失败。因此仅对非移动目标引入；
# 移动端由上层回退为持久化 UUID / 主机名指纹（见 state.rs / device.rs）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
machine-uid = "0.5"
# 桌面端应用内更新：插件只支持 Windows/macOS/Linux；移动端由命令桩返回不支持。
tauri-plugin-updater = "2.14"
# 「禁止降级」的显式版本判据（2026-10-24 产品裁决，见审计 §13）。
# 官方插件的 `check()` 自己也会比较版本，但那条判据住在上游、我们无法在本仓钉住；
# 这里用自己的比较做第二道，并留下 `code=UPDATER_DOWNGRADE_BLOCKED` 的可检索痕迹。
# semver 早就在依赖树里（tauri-utils 的间接依赖），这里只是让我们自己也能用它。
semver = "1"

# Windows 剪贴板文件列表（CF_HDROP）：文件消息「复制」＝复制文件本体，
# 可在资源管理器粘贴、也可直接粘贴回聊天框发送（微信式）。
[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5"
# 崩溃现场的内存/句柄读数（`mem_diag.rs`）：`K32GetProcessMemoryInfo` + `GlobalMemoryStatusEx`
# + `GetGuiResources`，三个都是**非分配**的系统调用，所以能在分配失败钩子里安全调用。
#
# ⚠️ 这不是"新依赖"：`windows-sys` 0.61.2 已经在 `Cargo.lock` 里被别的依赖用着
# （`cargo tree -i windows-sys@0.61.2` 现算），这里只是我们自己也要用它 + 按用到的命名空间逐个开 feature。
# 写在上面的 `windows`（WinRT/BLE）不一样 —— 那个是 optional、只在 `--features bluetooth` 下存在，
# 而诊断读数必须在**每一种构建**里都在。
#
# ⚠️ feature **必须逐个点名，没有传递关系**：现读 windows-sys 0.61.2 的 Cargo.toml，
# `Win32_System_ProcessStatus`/`_Threading`/`_SystemInformation` 各自只展开到 `["Win32_System"]`，
# 而 `Win32_System_Diagnostics_ToolHelp = ["Win32_System_Diagnostics"]` 没人顺带打开。
# 2026-10-27 加"我们家那棵 WebView2 子进程树"的遍历时就漏了 ToolHelp ——
# 那段代码在 `#[cfg(target_os = "windows")]` 里，**mac 上编译与门禁全看不见**，
# 只有 Windows CI 会红（本仓的跨平台 cfg 盲区老形状，`lib_startup_config_tests.rs`
# 的 `every_windows_sys_namespace_used_is_declared_as_a_feature` 现在把它钉住了）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
# Windows 的 BLE **外设（GATT server）** 角色：btleplug 只做 central（ADR-0015 §3.1），
# 而 Windows 要能被手机/其它电脑发现与连入，就必须自己广播并提供 GATT 服务。
# 原生做法是 WinRT 的 `GattServiceProvider`，feature 列表**照抄 btleplug 的 winrtble 后端**
# （已证明这套 feature 足够完成「广播 + 服务/特征 + 通知 + 写请求」）。
#
# ⚠️ **没有引入任何新的第三方 crate**：`windows` 早就在依赖树里（btleplug 的 Windows 后端
# 依赖它），这里只是我们自己也要用它。optional ⇒ 只有 `--features bluetooth` 的 Windows
# 构建才引入（默认构建零新增依赖，与 ADR-0015 §2 的硬性约定一致）。
windows = { version = "0.62", optional = true, features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }
# WinRT 的 async 操作（`IAsyncOperation`）是"**先 `.into_future()`、再 `.join()`/`.await`**"两步：
# `into_future()` 由 `std::future::IntoFuture` 提供，而阻塞式 `join()` 在 `windows_future::Async`
# trait 上 —— `windows` crate 只 re-export **类型**、不 re-export 这个 trait，
# 所以要用 `join()` 就得自己依赖它。同样是 optional + 只在 Windows 目标上。
# （版本必须与 `windows` 0.62 内部使用的一致，否则 `IAsyncOperation` 会是两个不同的类型。）
windows-future = { version = "0.3", optional = true }

# macOS 打开文件：App Sandbox 禁止 fork /usr/bin/open（tauri-plugin-opener 在 macOS 走的正是
# 这条路径），改用 NSWorkspace.openURL —— 纯 Foundation API，沙盒应用允许调用。
# 同时给 macOS 窗口加圆角：NSWindow 没有 setCornerRadius:，正确做法是给 contentView 的
# layer 设 cornerRadius（公开 API），并关掉与圆角不兼容的系统阴影。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# 崩溃现场的内存读数（`mem_diag.rs`）：darwin 上 `getrusage(RUSAGE_SELF).ru_maxrss` 是
# **唯一不用 mach 端口、也不用 fork 命令**就能拿到的读数。`libc` 0.2.189 早就在
# `Cargo.lock` 里被别的依赖用着 ⇒ 这里不新增要下载的 crate，只是我们自己声明一次。
libc = "0.2"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSWindow", "NSView", "objc2-quartz-core"] }
# NSData/NSArray/NSError 是 security-scoped bookmark（共享目录跨重启保活）的必需 feature：
# objc2-foundation 的 feature 就是类名，书签 API 的 cfg 门要求它们同时打开。
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSData", "NSArray", "NSError"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
# macOS 的 BLE **peripheral（GATT server）** 角色：btleplug 只做 central（见 ADR-0015 §3.1），
# 而「手机与电脑不连同一个 Wi-Fi」要能互连，就必须有一侧当外设。
# optional ⇒ 只有 `--features bluetooth` 的 macOS 构建才引入（默认构建零新增依赖，与今天一致）。
objc2-core-bluetooth = { version = "0.3", optional = true }

# Android 的 BLE **外设角色**要用 JNI 调 Kotlin 侧实现（见 ADR-0015 §7.7）；
# 「用系统里的其它应用打开收到的文件」也走 JNI（见 src-tauri/src/android_open.rs）。
# btleplug 的 droidplug 后端本身已经依赖 `jni = "0.22"`（Android 目标、非 optional），
# 所以这里**没有引入任何新的第三方 crate**，只是让我们自己也能用它。
#
# ⚠️ **不能 optional**：打开文件与蓝牙无关 —— 若把它挂在 `bluetooth` feature 上，
# 没开该 feature 的构建就打不开文件（而 Android 上除了 JNI 没有别的办法把私有目录文件
# 交给别的应用，见 OpenWith.kt）。非 Android 目标不会编译本依赖。
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22" }

[dev-dependencies]
# 测试夹具的临时目录：drop 即清理，避免手写 `temp_dir().join(format!("…pid…nanos"))`。
tempfile = "3"

[features]
# 默认启用自定义协议；可扩展为自定义 deep-link 唤醒
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# BLE 传输（P3 / Phase 7）：**默认关闭** —— 不开 feature 时依赖不下载、代码不编译，
# 产物与行为与今天逐字节一致（ADR-0015 §2 的硬性约定）。
# 引入前必须先读 docs/adr/0015-ble-transport.md（项目规矩：新依赖必须 ADR）。
bluetooth = ["dep:btleplug", "dep:futures", "dep:objc2-core-bluetooth", "dep:windows", "dep:windows-future"]

# dev（`cargo test` / 本地检查用的就是这个 profile）刻意只留行号表、并关掉增量缓存。
# 实测过不这么写的代价：`src-tauri/target/debug` 长到 78G（`deps` 49G 全量调试信息 +
# `incremental` 23G / 316 个目录 —— cargo 换 hash 就另起一份、旧的从不删，而 `cargo clean gc` 不清项目 target）。
# 边界要说清：`debug = 1` 保留行号表 ⇒ panic 仍报 file:line，丢的是变量值与本帧局部符号；
# ⚠️ 绝不动 `debug-assertions` —— 那会让 `cargo test` 的断言变瞎，是拿测试换磁盘。
# 代价只付一次：改完这版第一次 `cargo test` 是冷编。
[profile.dev]
debug = 1
incremental = false

[profile.release]
# 安卓上必须是 `panic = "abort"`：Tauri 的 `mobile_entry_point` 宏用 `stop_unwind` 包住入口，
# 换成 unwind 会直接编译失败（实测 E0593: required by this bound in `stop_unwind`）。
# 因此"别让 panic 杀掉应用"不能靠 unwind，只能靠**不在启动路径上 panic**：
#   · panic hook 在 abort 之前仍会被调用 ⇒ panic 位置与消息会落进「运行日志」文件（重启后仍在，
#     用户可以直接把那条 `channel="panic"` 发给我们）；
#   · 蓝牙运行时的自动启动**从"应用启动时"改成"用户打开相关界面时"**（见 useAppStore.ensureBluetoothOn），
#     这样即使 BLE 启动路径里还有 panic，也不会表现为"打开应用就闪退"。
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.rust]
# MSVC 链接器在 `release`（LTO + codegen-units=1 + cdylib）下会往 stdout 打一行
# 「正在创建库 …gosslan_lib.dll.lib 和对象 …dll.exp」——这是 cdylib 生成导入库的**正常**
# 提示，Rust 1.98 起被 `linker_messages` lint 转成 `warning: linker stdout: …`。
# 本项目"警告零容忍"，但这行**不是缺陷、也无法通过改代码消除**（换链接参数只会换个说法），
# 所以在 rustc lint 层收掉它。**只收这一条**：其余 lint 全部保持 rustc 默认可见性。
linker_messages = "allow"

[patch.crates-io]
# ⚠️ **打过补丁的 btleplug 副本**（Gosslan 2026-09-13）。
#
# 为什么必须打补丁：上游 WinRT 后端在**连接**时用
# `BluetoothLEDevice::FromBluetoothAddressAsync(address)` —— **丢掉了扫描时已经采集到的
# 地址类型**（`args.BluetoothAddressType()` → `shared.address_type`）。
# 对**随机地址（Random）**的 BLE 外设（安卓 `BluetoothLeAdvertiser` 默认就是随机地址）
# 这会拿到一个"连不上"的设备对象：之后每次 GATT 操作都以 `Unreachable` 失败，
# 被翻成 `Not connected`，且**没有任何被拒的迹象**。
# 真机现象就是"能扫到、永远连不上"（Windows ↔ 安卓，关掉局域网只留蓝牙）。
# WinRT 其实有带地址类型的重载 `FromBluetoothAddressWithBluetoothAddressTypeAsync`。
#
# 补丁只有两处（约 30 行，都在 winrtble 里，`grep -rn "本地补丁" vendor/btleplug`）：
#   1. `ble/device.rs` 的 `BLEDevice::new` 多一个 `address_type` 参数；
#      **只有 `Random`** 才走带地址类型的重载，Public / 取不到时完全走上游原路径；
#   2. `peripheral.rs` 把 `self.shared.address_type` 映射成 WinRT 的
#      `BluetoothAddressType` 传进去。
# 对 macOS / Android / Linux 后端**零影响**（补丁只在 winrtble 内）。
#
# 用 `[patch.crates-io]`（而不是把主依赖写成 `path =`）的理由：
# 主依赖处仍保留 `version = "0.13"` 的**语义**（"我要 0.13 这条线"），
# 补丁只是把这一条线的来源换成工作区内的副本；将来升级上游时改主依赖的版本号即可，
# 不必在一堆注释里找那行 path。
#
# ⚠️ **升级 btleplug 时**：先看上游是否已修（搜 `BluetoothAddressType`），
# 修了就直接删掉本节；没修就把这两处补丁重放到新版本上。
#
# ⚠️ **构建缓存**：换成 patch 会让 `btleplug` 的 fingerprint 变化 ⇒ **首次构建会整包重编**
# （实测 Windows 上 `cargo check --features bluetooth` 约 3~13 分钟，之后恢复正常）。
# CI 上表现为"某一次突然变慢"，属预期、不是回归。
btleplug = { path = "vendor/btleplug" }
