# cargo-deny 配置（2026-10-21 首次接入）。
#
# 目标：对"依赖树本身"设一道可执行的门槛 —— 漏洞、yanked、许可证、来源。
# 尺度刻意保守：本仓有多平台目标（macOS / Windows / Linux / Android），
# 其中一部分 crate 只在特定 target 上编译；这里**不按 target 裁剪**，
# 让审计看到完整的依赖图，避免"在 Linux CI 上看不到 Windows 依赖"的假绿。
#
# 已知告警（cargo-audit 实测 2026-10-21，均为上游 transitive 依赖的
# unmaintained / unsound 提示，不是漏洞）：zvariant / zvariant_derive（unmaintained）、
# glib 0.18（unsound）。这些不是本仓直接依赖，升级路径跟随 tauri/btleplug 上游；
# 先用 warn 级别保留可见性，等上游升级后再收紧成 deny。

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
# 漏洞（vulnerability）永远是 error；unmaintained / unsound 只对**本工作区**升级成
# error，外部 transitive 依赖仍以告警呈现。理由：zvariant / glib 这类上游告警的
# 修复路径是跟随 tauri/btleplug 升级，不能在本仓用一条 deny 规则逼出大范围红。
unmaintained = "workspace"
unsound = "workspace"
# 已知不可修的三条 zip 告警走"风险接受"，理由必须写清楚，且**只在签名之后解包**：
#
#   zip 4.6.1 由 tauri-plugin-updater 2.14.0 的可选依赖引入（`zip = "4"`，仅 Windows
#   自更新解包用）。三条公告的修复版本都要求 zip >= 9.0.0，而上游 stable 最新就是
#   2.14.0（只有 3.0.0-alpha.3），本仓无法单独升 zip；`zip` feature 也不能关 ——
#   macOS 的 `.app.tar.gz` 解包（tar + flate2）与 Windows 的 zip 解包同在该 feature 下。
#
#   实际暴露面：① 解包只在 Windows 自更新路径（macOS 走 tar/flate2）；② 更新包必须先
#   通过 tauri.conf.json 里固定的 minisign 公钥校验，签名不对手根本走不到解包 ——
#   攻击者要利用本告警必须先拿到发布私钥，届时整条更新链已失守，与 zip 无关。
#   这三条待上游发版后立即删除。
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "zip 4.6.1 解包保留 SUID/SGID；仅在 minisign 校验通过后的 Windows 更新路径，上游 tauri-plugin-updater 未放开 zip 大版本" },
  { id = "RUSTSEC-2026-0368", reason = "zip 4.6.1 symlink 越界写；同上，签名校验通过后才解包，且路径仅在 Windows 自更新 asset 目录" },
  { id = "RUSTSEC-2026-0369", reason = "zip 4.6.1 经 symlink 继承 Unix 权限；同上，签名校验通过后才解包，待上游放开 zip >= 9 即删除本豁免" },
]

[licenses]
# 本仓是私有工作区（不发布到 crates.io），`gosslan` 自身没有 license 字段；
# 只对 workspace 私有包豁免，第三方依赖仍然逐个查许可证。
private = { ignore = true }
# 允许列表里预留了暂时没遇到的常见许可证（OpenSSL / bzip2 / NCSA 等），
# 它们不是错误；真遇到时不必再改一次配置。
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  # CDLA-Permissive-2.0：webpki-roots / webpki-root-certs 的根证书**数据**许可
  # （Linux Foundation 社区数据许可，允许自由再分发与修改），不是代码许可陷阱。
  "CDLA-Permissive-2.0",
  "Unlicense",
  "OpenSSL",
  "bzip2-1.0.6",
  "NCSA",
]
confidence-threshold = 0.8

[bans]
# 多版本共存是 tauri 生态的常态（不同上游锁在不同 major）；先只要求"来源可解释"，
# 不在首次接入时用 duplicate 规则制造大范围红。
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
