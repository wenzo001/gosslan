<helmet>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#0f1012;-webkit-font-smoothing:antialiased}
svg{display:block}
button{font-family:inherit}
.tr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width:1000px;height:680px;position:relative;background:#f1f2f6;overflow:hidden"><div style="height:40px;background:#e8e9ed;border-bottom:1px solid #e5e6e9;display:flex;align-items:center;padding:0 14px;flex:0 0 auto;position:relative">
    <div style="display:flex;gap:8px;width:70px"><span style="width:11px;height:11px;border-radius:999px;background:#ff5f57"></span><span style="width:11px;height:11px;border-radius:999px;background:#febc2e"></span><span style="width:11px;height:11px;border-radius:999px;background:#28c840"></span></div>
    <div style="position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600;color:#4d4f51">小院儿</div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
      <span style="height:20px;padding:0 8px;border-radius:999px;background:#daf5e5;color:#005938;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:999px;background:#00aa6f"></span>LAN · 3</span>
      <button aria-label="设置" style="width:28px;height:28px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#4d4f51"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <div style="width:28px;height:28px;border-radius:999px;background:#a0c0e3;color:#0f1012;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative;margin-left:2px">我<span style="position:absolute;right:0;bottom:0;width:8px;height:8px;border-radius:999px;background:#00aa6f;border:2px solid #e8e9ed"></span></div>
    </div>
  </div><div style="position:absolute;right:0;top:40px;bottom:0;width:420px;background:#fff;border-left:1px solid #e5e6e9;display:flex;flex-direction:column;z-index:5">
      <div style="height:52px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #eef0f3;font-size:14px;font-weight:600">群管理 · 5 位成员<button aria-label="关闭" style="margin-left:auto;width:28px;height:28px;border:0;background:transparent;color:#4d4f51">✕</button></div>
      <div style="padding:18px;overflow:hidden">
        <div style="font-size:12px;font-weight:600;margin-bottom:10px">群公告</div>
        <div style="background:#f6f8fb;border-radius:10px;padding:12px;font-size:12px;line-height:18px;color:#4d4f51">本周完成紧凑设计规范对齐，令牌以 src/style.css 为准。</div>
        <div style="font-size:12px;font-weight:600;margin:18px 0 12px">群成员</div>
        <div style="display:flex;flex-wrap:wrap;gap:10px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:80px"><div style="width:48px;height:48px;border-radius:999px;background:#356ae8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">李</div><span style="font-size:11px">李工</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:80px"><div style="width:48px;height:48px;border-radius:999px;background:#888fdd;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">张</div><span style="font-size:11px">张伟</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:80px"><div style="width:48px;height:48px;border-radius:999px;background:#00aa6f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">王</div><span style="font-size:11px">王敏</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:80px"><div style="width:48px;height:48px;border-radius:999px;background:#d58000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">陈</div><span style="font-size:11px">陈晨</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:80px"><div style="width:48px;height:48px;border-radius:999px;background:#68696c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">机</div><span style="font-size:11px">小助手</span></div></div>
      </div>
      <div style="margin-top:auto;padding:14px 18px;border-top:1px solid #eef0f3"><button style="height:32px;padding:0 14px;border:0;border-radius:8px;background:#356ae8;color:#fff;font-size:12px;font-weight:600">添加成员</button><button style="height:32px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:#cf3546;font-size:12px;font-weight:600;margin-left:8px">退出群聊</button></div>
    </div></div>
</x-dc>
