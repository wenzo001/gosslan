<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>会话列表</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#0f1012;-webkit-font-smoothing:antialiased}
svg{display:block}
</style>
</helmet>
<div style="width:1000px;height:680px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f2f6;overflow:hidden">
  <div style="height:40px;background:#e8e9ed;border-bottom:1px solid #e5e6e9;display:flex;align-items:center;padding:0 14px;flex:0 0 auto;position:relative">
    <div style="display:flex;gap:8px;width:70px"><span style="width:11px;height:11px;border-radius:999px;background:#ff5f57"></span><span style="width:11px;height:11px;border-radius:999px;background:#febc2e"></span><span style="width:11px;height:11px;border-radius:999px;background:#28c840"></span></div>
    <div style="position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600;color:#4d4f51">小院儿</div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
      <span style="height:20px;padding:0 8px;border-radius:999px;background:#daf5e5;color:#005938;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:999px;background:#00aa6f"></span>LAN · 3</span>
      <button aria-label="设置" style="width:28px;height:28px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#4d4f51"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <div style="width:28px;height:28px;border-radius:999px;background:#a0c0e3;color:#0f1012;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative;margin-left:2px">我<span style="position:absolute;right:0;bottom:0;width:8px;height:8px;border-radius:999px;background:#00aa6f;border:2px solid #e8e9ed"></span></div>
    </div>
  </div>
  <div style="flex:1;display:flex;min-height:0">
    <div style="width:64px;background:#e8e9ed;border-right:1px solid #e5e6e9;display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;flex:0 0 auto">
      <div style="display:flex;flex-direction:column;gap:8px">
        <button aria-label="聊天" onClick="{{ pickChats }}" style="width:44px;height:44px;border:0;border-radius:10px;background:{{ bgChats }};color:{{ fgChats }};display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><sc-if value="{{ selChats }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#cf3546;color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center">3</span></sc-if></button>
        <button aria-label="通讯录" onClick="{{ pickContacts }}" style="width:44px;height:44px;border:0;border-radius:10px;background:{{ bgContacts }};color:{{ fgContacts }};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
        <button aria-label="收藏" onClick="{{ pickFavorites }}" style="width:44px;height:44px;border:0;border-radius:10px;background:{{ bgFavorites }};color:{{ fgFavorites }};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3 6.5 7 .9-5 4.9 1.2 7L12 18l-6.2 3.3L7 14.3 2 9.4l7-.9z"/></svg></button>
        <button aria-label="链接" onClick="{{ pickLinks }}" style="width:44px;height:44px;border:0;border-radius:10px;background:{{ bgLinks }};color:{{ fgLinks }};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></button>
      </div>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
        <button aria-label="切换主题" style="width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#4d4f51;display:flex;align-items:center;justify-content:center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button aria-label="更多" style="width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#4d4f51;display:flex;align-items:center;justify-content:center"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
      </div>
    </div>
    <div style="width:320px;background:#f6f8fb;border-right:1px solid #e5e6e9;display:flex;flex-direction:column;flex:0 0 auto;min-height:0">
      <div style="height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;flex:0 0 auto">
        <div style="font-size:17px;line-height:22px;font-weight:600">{{ pageTitle }}</div>
        <button aria-label="新建" style="width:32px;height:32px;border:0;border-radius:8px;background:#356ae8;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div style="padding:0 12px 6px;flex:0 0 auto">
        <div style="height:36px;border-radius:8px;background:#edeef2;border:1px solid #d6d7da;display:flex;align-items:center;gap:8px;padding:0 11px;color:#68696c;font-size:13px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>{{ searchHint }}</div>
      </div>
      <div style="flex:1;overflow:hidden;min-height:0">
        <sc-for list="{{ convs }}" as="c" hint-placeholder-count="3"><div onClick="{{ c.pick }}" style="height:62px;display:flex;align-items:center;gap:12px;padding:0 14px;cursor:pointer;background:{{ c.bg }};position:relative">
          <div style="width:42px;height:42px;border-radius:999px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;background:{{ c.avatar }};position:relative">{{ c.initial }}<span style="position:absolute;right:-1px;bottom:0;width:11px;height:11px;border-radius:999px;background:{{ c.dot }};border:2px solid #f6f8fb"></span></div>
          <div style="min-width:0;flex:1">
            <div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:14.5px;line-height:20px;font-weight:{{ c.weight }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.name }}</span><span style="margin-left:auto;font-size:11px;color:#4d4f51;flex:0 0 auto">{{ c.time }}</span></div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:2px"><span style="font-size:12.5px;color:#4d4f51;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0">{{ c.preview }}</span><sc-if value="{{ c.hasUnread }}" hint-placeholder-val="{{ true }}"><span style="min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#cf3546;color:#fff;font-size:10px;font-weight:600;line-height:18px;text-align:center;flex:0 0 auto">{{ c.unread }}</span></sc-if></div>
          </div>
        </div><div style="height:1px;background:#eef0f3;margin-left:70px"></div></sc-for>
      </div>
      <div style="height:38px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 14px;border-top:1px solid #e5e6e9;background:#f6f8fb;font-size:11px;color:#68696c"><span style="display:flex;align-items:center;gap:5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>传输队列 · 2</span><span style="margin-left:auto;font-family:ui-monospace,monospace">v7.1.29</span></div>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;background:#ffffff">
      <div style="width:420px;text-align:center;padding-bottom:20px;display:flex;flex-direction:column;align-items:center">
        <div style="width:68px;height:68px;border-radius:20px;background:#fff8ea;border:1px solid #f0e5c9;display:flex;align-items:center;justify-content:center;margin-bottom:22px"><svg width="40" height="40" viewBox="0 0 48 48" fill="none"><path d="M14 20a6 6 0 0 1 12 0v1" stroke="#356ae8" stroke-width="3" stroke-linecap="round"/><rect x="10" y="21" width="28" height="20" rx="8" fill="#356ae8"/><circle cx="19" cy="31" r="2" fill="#fff"/><circle cx="29" cy="31" r="2" fill="#fff"/></svg></div>
        <div style="font-size:22px;line-height:28px;font-weight:600">选择会话，开始局域网聊天</div>
        <div style="font-size:12.5px;line-height:19px;color:#4d4f51;margin-top:8px">消息只在这台设备，不经过服务器。</div>
        <div style="font-size:12px;font-weight:600;color:#1b44aa;margin-top:6px">无服务器 · 纯 P2P · 端到端加密 · 数据仅存本机</div>
        <button style="height:36px;padding:0 16px;border:0;border-radius:8px;background:#356ae8;color:#fff;font-size:13px;font-weight:600;margin-top:20px">发起聊天</button>
        <button style="height:36px;padding:0 16px;border:1px solid #d6d7da;border-radius:8px;background:#fff;color:#0f1012;font-size:13px;font-weight:600;margin-top:8px">添加好友</button>
        <div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center">
          <span style="font-size:11px;color:#4d4f51;background:#f6f8fb;border:1px solid #e5e6e9;border-radius:999px;padding:4px 10px">● 3 台设备在线</span>
          <span style="font-size:11px;color:#4d4f51;background:#f6f8fb;border:1px solid #e5e6e9;border-radius:999px;padding:4px 10px">端到端加密</span>
          <span style="font-size:11px;color:#4d4f51;background:#f6f8fb;border:1px solid #e5e6e9;border-radius:999px;padding:4px 10px">无服务器</span>
        </div>
      </div>
      <div style="position:absolute;right:16px;bottom:14px;font-size:11px;color:#68696c">按 ⌘K 搜索，按 ⌘, 打开设置</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = this.state.rail ?? 'chats';
    const pick = (id) => () => this.setState({ rail: id });
    const tone = (id) => sel === id ? { bg:'#e5eeff', fg:'#356ae8' } : { bg:'transparent', fg:'#4d4f51' };
    const a = tone('chats'), b = tone('contacts'), c = tone('favorites'), d = tone('links');
    const convs = [
      {name:'产品设计群',initial:'设',avatar:'#356ae8',time:'10:42',preview:'李工：新的紧凑规范已经同步',unread:3,hasUnread:true,dot:'#00aa6f',weight:600,bg:'transparent',pick:()=>{}},
      {name:'张伟',initial:'张',avatar:'#888fdd',time:'09:18',preview:'收到，我这边看一下',unread:0,hasUnread:false,dot:'#00aa6f',weight:500,bg:'transparent',pick:()=>{}},
      {name:'李娜',initial:'李',avatar:'#a0e3e1',time:'昨天',preview:'好的，明天见',unread:0,hasUnread:false,dot:'#929498',weight:500,bg:'transparent',pick:()=>{}}
    ];
    const titles={chats:'聊天',contacts:'通讯录',favorites:'收藏',links:'外部链接'};
    const hints={chats:'搜索',contacts:'搜索',favorites:'搜索收藏',links:'搜索链接'};
    return {
      bgChats:a.bg, fgChats:a.fg, selChats:sel==='chats', pickChats:pick('chats'),
      bgContacts:b.bg, fgContacts:b.fg, pickContacts:pick('contacts'),
      bgFavorites:c.bg, fgFavorites:c.fg, pickFavorites:pick('favorites'),
      bgLinks:d.bg, fgLinks:d.fg, pickLinks:pick('links'),
      convs, pageTitle:titles[sel], searchHint:hints[sel]
    };
  }
}
</script>
</body>
</html>
