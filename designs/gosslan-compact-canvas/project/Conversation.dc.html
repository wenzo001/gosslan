<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>单聊会话</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#0f1012;-webkit-font-smoothing:antialiased}
svg{display:block}
</style>
</helmet>
<div style="width:1000px;height:680px;display:flex;flex-direction:column;background:#f1f2f6;overflow:hidden">
  <div style="height:40px;background:#e8e9ed;border-bottom:1px solid #e5e6e9;display:flex;align-items:center;padding:0 14px;flex:0 0 auto;position:relative">
    <div style="display:flex;gap:8px;width:70px"><span style="width:11px;height:11px;border-radius:999px;background:#ff5f57"></span><span style="width:11px;height:11px;border-radius:999px;background:#febc2e"></span><span style="width:11px;height:11px;border-radius:999px;background:#28c840"></span></div>
    <div style="position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600;color:#4d4f51">小院儿</div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
      <span style="height:20px;padding:0 8px;border-radius:999px;background:#edeef2;color:#4d4f51;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:999px;background:#00aa6f"></span>LAN · 3</span>
      <button aria-label="全局搜索" style="width:28px;height:28px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#4d4f51"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></button>
      <button aria-label="个性化设置" style="width:28px;height:28px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#4d4f51"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <div style="width:28px;height:28px;border-radius:999px;background:#a0c0e3;color:#0f1012;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative;margin-left:2px">我<span style="position:absolute;right:0;bottom:0;width:8px;height:8px;border-radius:999px;background:#00aa6f;border:2px solid #e8e9ed"></span></div>
    </div>
  </div>

  <div style="flex:1;display:flex;min-height:0">
    <!-- rail -->
    <div style="width:64px;background:#e8e9ed;border-right:1px solid #e5e6e9;display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;flex:0 0 auto">
      <div style="display:flex;flex-direction:column;gap:8px">
        <button aria-label="聊天" style="width:44px;height:44px;border:0;border-radius:10px;background:#e5eeff;color:#356ae8;display:flex;align-items:center;justify-content:center;position:relative"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
        <button aria-label="通讯录" style="width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#4d4f51;display:flex;align-items:center;justify-content:center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
        <button aria-label="收藏" style="width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#4d4f51;display:flex;align-items:center;justify-content:center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3 6.5 7 .9-5 4.9 1.2 7L12 18l-6.2 3.3L7 14.3 2 9.4l7-.9z"/></svg></button>
        <button aria-label="链接" style="width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#4d4f51;display:flex;align-items:center;justify-content:center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></button>
      </div>
    </div>

    <!-- list -->
    <div style="width:320px;background:#f6f8fb;border-right:1px solid #e5e6e9;display:flex;flex-direction:column;flex:0 0 auto;min-height:0">
      <div style="height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;flex:0 0 auto"><div style="font-size:17px;line-height:22px;font-weight:600">聊天</div><button aria-label="新建" style="width:32px;height:32px;border:0;border-radius:8px;background:#356ae8;color:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div style="padding:0 12px 6px;flex:0 0 auto"><div style="height:36px;border-radius:8px;background:#edeef2;border:1px solid #d6d7da;display:flex;align-items:center;gap:8px;padding:0 11px;color:#68696c;font-size:13px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>搜索</div></div>
      <div style="flex:1;overflow:hidden;min-height:0">
        <div style="height:62px;display:flex;align-items:center;gap:12px;padding:0 14px"><div style="width:42px;height:42px;border-radius:999px;flex:0 0 auto;background:#888fdd;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative">张<span style="position:absolute;right:-1px;bottom:0;width:11px;height:11px;border-radius:999px;background:#00aa6f;border:2px solid #f6f8fb"></span></div><div style="min-width:0;flex:1"><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:14.5px;font-weight:600">张伟</span><span style="margin-left:auto;font-size:11px;color:#4d4f51">10:42</span></div><div style="font-size:12.5px;color:#4d4f51;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">收到，我这边看一下</div></div></div><div style="height:1px;background:#eef0f3;margin-left:70px"></div>
        <div style="height:62px;display:flex;align-items:center;gap:12px;padding:0 14px"><div style="width:42px;height:42px;border-radius:999px;flex:0 0 auto;background:#a0c0e3;color:#0f1012;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative">我</div><div style="min-width:0;flex:1"><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:14.5px;font-weight:500">我</span><span style="margin-left:auto;font-size:11px;color:#4d4f51">昨天</span></div><div style="font-size:12.5px;color:#4d4f51;margin-top:2px">发给自己</div></div></div>
      </div>
      <!-- 列表页脚 -->
      <div style="height:38px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 14px;border-top:1px solid #e5e6e9;background:#f6f8fb;font-size:11px;color:#68696c"><span style="display:flex;align-items:center;gap:5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>传输队列 · 2</span><span style="margin-left:auto;font-family:ui-monospace,monospace">v7.1.29</span></div>
    </div>

    <!-- chat 单聊 -->
    <div style="flex:1;display:flex;flex-direction:column;min-width:0;background:#fff">
      <div style="height:52px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #eef0f3;background:#f6f8fb">
        <div style="width:32px;height:32px;border-radius:999px;background:#888fdd;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">张</div>
        <div style="min-width:0"><div style="font-size:15px;font-weight:600;line-height:20px;display:flex;align-items:center;gap:6px">张伟<span style="font-size:10px;color:#4d4f51;font-weight:400">手机</span></div><div style="font-size:11px;color:#00aa6f">● 在线 · 局域网直连</div></div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:2px">
          <button aria-label="共享目录" style="width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:#4d4f51;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
        </div>
      </div>
      <div style="flex:1;overflow:hidden;padding:16px 20px;background:#fff">
        <div style="text-align:center;font-size:11px;color:#68696c;margin-bottom:14px">今天 10:30</div>
        <div style="display:flex;gap:10px;margin-bottom:12px;align-items:flex-start"><div style="width:30px;height:30px;border-radius:999px;background:#888fdd;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 auto">张</div><div style="max-width:68%;background:#fff;border:1px solid #eef0f3;border-radius:14px;padding:9px 13px;font-size:13px;line-height:20px">收到，我这边看一下</div></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-bottom:12px;align-items:flex-start"><div style="max-width:68%;background:#356ae8;color:#fff;border-radius:14px;padding:9px 13px;font-size:13px;line-height:20px">好的，晚点我把原型放共享目录</div><div style="width:30px;height:30px;border-radius:999px;background:#a0c0e3;color:#0f1012;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 auto">我</div></div>
      </div>
      <!-- composer 单聊：无抖动 -->
      <div style="flex:0 0 auto;padding:8px 14px 12px;background:#f6f8fb;border-top:1px solid #eef0f3">
        <div style="background:#fff;border:1px solid #d6d7da;border-radius:22px;padding:10px 14px 8px">
          <div style="min-height:44px;font-size:13px;line-height:21px;color:#0f1012;display:flex;align-items:center"></div>
          <div style="height:32px;display:flex;align-items:center;gap:8px;margin-top:2px">
            <button aria-label="表情" style="width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:#4d4f51;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 14a5 5 0 0 0 8 0M9 9h.01M15 9h.01"/></svg></button>
            <button aria-label="代码消息" style="width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:#4d4f51;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg></button>
            <button aria-label="发送文件" style="width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:#4d4f51;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
            <button style="height:32px;padding:0 14px;border:0;border-radius:9px;background:#356ae8;color:#fff;font-size:13px;font-weight:600;margin-left:auto">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":680}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
