<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>消息右键菜单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#0f1012;-webkit-font-smoothing:antialiased}
svg{display:block}
</style>
</helmet>
<div style="width:1000px;height:680px;position:relative;background:#f1f2f6;overflow:hidden">
  <div style="height:40px;background:#e8e9ed;border-bottom:1px solid #e5e6e9;display:flex;align-items:center;padding:0 14px;position:relative">
    <div style="display:flex;gap:8px;width:70px"><span style="width:11px;height:11px;border-radius:999px;background:#ff5f57"></span><span style="width:11px;height:11px;border-radius:999px;background:#febc2e"></span><span style="width:11px;height:11px;border-radius:999px;background:#28c840"></span></div>
    <div style="position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600;color:#4d4f51">小院儿</div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
      <span style="height:20px;padding:0 8px;border-radius:999px;background:#edeef2;color:#4d4f51;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:999px;background:#00aa6f"></span>LAN · 3</span>
      <button aria-label="全局搜索" style="width:28px;height:28px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#4d4f51"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></button>
      <button aria-label="个性化设置" style="width:28px;height:28px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#4d4f51"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <div style="width:28px;height:28px;border-radius:999px;background:#a0c0e3;color:#0f1012;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative;margin-left:2px">我<span style="position:absolute;right:0;bottom:0;width:8px;height:8px;border-radius:999px;background:#00aa6f;border:2px solid #e8e9ed"></span></div>
    </div>
  </div>

  <div style="position:absolute;left:120px;top:110px;width:380px">
    <div style="display:flex;gap:10px;margin-bottom:12px;align-items:flex-start">
      <div style="width:30px;height:30px;border-radius:999px;background:#888fdd;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 auto">李</div>
      <div style="max-width:68%;background:#fff;border:1px solid #eef0f3;border-radius:14px;padding:9px 13px;font-size:13px;line-height:20px">大家早，今天把紧凑标准的令牌同步一下</div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <div style="max-width:68%;background:#356ae8;color:#fff;border-radius:14px;padding:9px 13px;font-size:13px;line-height:20px">好的，我已经按梯度改完了</div>
    </div>
  </div>

  <!-- 菜单：真实项（文本消息，无保存图片 / 无删除） -->
  <div style="position:absolute;left:430px;top:150px;width:220px;background:#fff;border-radius:10px;border:1px solid #e5e6e9;box-shadow:0 12px 32px rgba(15,16,18,0.16);padding:6px;z-index:10">
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px">复制选中内容</div>
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px">复制消息</div>
    <div style="height:1px;background:#eef0f3;margin:5px 4px"></div>
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px">置顶</div>
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px;color:#cf3546">撤回</div>
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px">以代码显示</div>
    <div style="height:1px;background:#eef0f3;margin:5px 4px"></div>
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px">引用</div>
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px">定位到引用的消息</div>
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px">转发</div>
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px">收藏</div>
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px">强提醒</div>
    <div style="height:1px;background:#eef0f3;margin:5px 4px"></div>
    <div style="height:32px;display:flex;align-items:center;padding:0 12px;border-radius:6px;font-size:13px">多选</div>
  </div>

  <div style="position:absolute;left:26px;bottom:20px;font-size:11px;color:#4d4f51;max-width:600px;line-height:17px">文本消息右键：内容操作（复制）→ 流转（置顶/撤回/引用/转发/收藏/强提醒/多选）。图片消息才额外出现「复制图片 / 保存图片」；单条消息没有「删除」，删除只在多选批量操作里。</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":680}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
