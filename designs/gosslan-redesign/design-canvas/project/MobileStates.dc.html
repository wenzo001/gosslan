<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mobile — Offline & failure states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f1;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 8px 0 2px;border-bottom:1px solid #ecede9}
  .back{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#3d4045;display:flex;align-items:center;justify-content:center}
  .hAv{width:30px;height:30px;border-radius:999px;background:#f3e2d6;color:#8a4d00;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto;position:relative}
  .hAv .dot{position:absolute;right:-1px;bottom:0;width:9px;height:9px;border-radius:999px;background:#9a9ea5;box-shadow:0 0 0 2px #fff}
  .hName{font-size:15px;line-height:20px;font-weight:600}
  .hMeta{font-size:10.5px;line-height:14px;color:#8a4d00;display:flex;align-items:center;gap:4px;margin-top:1px}
  .moreBtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#3d4045;display:flex;align-items:center;justify-content:center;margin-left:auto}
  .offline{height:34px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 14px;background:#fbf0df;color:#8a4d00;font-size:10.5px;border-bottom:1px solid #f1dfc2}
  .offline a{margin-left:auto;color:#8a4d00;font-weight:500;text-decoration:none;padding:2px 6px;border-radius:4px;background:rgba(138,77,0,.08);flex:0 0 auto}
  .msgs{flex:1;overflow:hidden;padding:6px 14px 10px}
  .day{text-align:center;font-size:10.5px;color:#8a8d92;margin:10px 0 12px}
  .run{display:flex;margin-bottom:12px;align-items:flex-start}
  .run.own{justify-content:flex-end}
  .runBody{max-width:80%;min-width:0}
  .bubble{padding:9px 13px;border-radius:18px;font-size:15px;line-height:21px;width:fit-content;max-width:100%}
  .in{background:#f0f1ed;color:#17181a;border-bottom-left-radius:6px;box-shadow:inset 0 0 0 1px #e4e5e0}
  .out{background:#2f6beb;color:#fff;border-bottom-right-radius:6px;margin-left:auto}
  .meta{display:flex;align-items:center;gap:4px;font-size:10.5px;color:#8a8d92;margin-top:4px}
  .own .meta{justify-content:flex-end}
  .failed{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#a32b22;margin-top:5px}
  .retry{color:#2356c4;font-weight:500;text-decoration:none;padding:2px 5px;border-radius:4px;background:#e8effd}
  .fileCard{width:286px;background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1px #e4e5e0;padding:10px 12px}
  .fTop{display:flex;align-items:center;gap:9px}
  .ftile{width:32px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .tBlue{background:#e8effd;color:#2356c4}.tOrange{background:#fbf0df;color:#8a4d00}.tRed{background:#fbe9e7;color:#a32b22}
  .fMain{min-width:0;flex:1}
  .fname{font-size:12.5px;line-height:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fmeta{font-size:10px;line-height:14px;color:#70747b;margin-top:1px}
  .bar{height:4px;border-radius:999px;background:#e9eae6;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px}
  .blue{background:#2f6beb}.orange{background:#d98a00}.red{background:#c0392f}
  .fActions{display:flex;gap:4px;margin-top:7px}
  .fBtn{height:28px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#2356c4;font:inherit;font-size:10.5px;font-weight:500}
  .fBtn.danger{color:#a32b22}
  .fBtn.muted{color:#70747b}
  .tag{font-size:9px;font-weight:500;border-radius:4px;padding:1px 5px}
  .tagPause{background:#fbf0df;color:#8a4d00}.tagFail{background:#fbe9e7;color:#a32b22}
  .composer{flex:0 0 auto;border-top:1px solid #ecede9;background:#fff;padding:8px 8px 8px 6px;display:flex;align-items:flex-end;gap:4px}
  .ib{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#5a5d63;display:flex;align-items:center;justify-content:center}
  .inputWrap{flex:1;min-height:40px;border-radius:20px;background:#f1f2ee;display:flex;align-items:center;padding:0 12px;margin:2px 0}
  .input{font-size:14px;line-height:19px;color:#70747b;padding:9px 0}
  .send{width:40px;height:40px;border-radius:999px;border:0;background:#2f6beb;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin:2px 0}
  .queue{display:flex;align-items:center;gap:5px;font-size:9.5px;color:#8a4d00;padding:4px 12px 0;background:#fff}
  svg{display:block}
</style>
</helmet>
<div class="phone">
  <div class="topbar">
    <button class="back" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
    <div class="hAv">林<span class="dot"></span></div>
    <div><div class="hName">林一</div><div class="hMeta"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/><path d="m3 3 18 18"/></svg>离线 · 正在重连</div></div>
    <button class="moreBtn" aria-label="更多"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </div>
  <div class="offline">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/><path d="m3 3 18 18"/></svg>
    局域网连接已断开，正在重试…
    <a href="#retry">立即重试</a>
  </div>
  <div class="msgs">
    <div class="day">今天 14:20</div>
    <div class="run"><div class="runBody"><div class="bubble in">先别发大文件，我这边信号不太好。</div><div class="meta">14:20</div></div></div>
    <div class="run own"><div class="runBody"><div class="bubble out">好，我等你回来。</div><div class="meta">14:21 已发送</div></div></div>
    <div class="run own"><div class="runBody"><div class="bubble out">文件我晚点再发一次。</div><div class="failed"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>发送失败 · 对方离线 · <a class="retry" href="#retry">重试</a></div></div></div>
    <div class="run"><div class="runBody">
      <div class="fileCard">
        <div class="fTop"><div class="ftile tOrange"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg></div><div class="fMain"><div class="fname">合照-2026.jpg</div><div class="fmeta"><span class="tag tagPause">已暂停</span> 1.7 MB / 4.1 MB</div></div></div>
        <div class="bar"><i class="orange" style="width:41%"></i></div>
        <div class="fActions"><button class="fBtn">继续</button><button class="fBtn muted">取消</button></div>
      </div>
      <div class="meta">14:22</div>
    </div></div>
    <div class="run own"><div class="runBody">
      <div class="fileCard" style="margin-left:auto">
        <div class="fTop"><div class="ftile tRed"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg></div><div class="fMain"><div class="fname">设计稿.fig</div><div class="fmeta"><span class="tag tagFail">发送失败</span> 对端已离线</div></div></div>
        <div class="bar"><i class="red" style="width:22%"></i></div>
        <div class="fActions"><button class="fBtn">重试</button><button class="fBtn danger">删除</button></div>
      </div>
    </div></div>
  </div>
  <div class="queue"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>离线时消息会排队，重连后自动发送</div>
  <div class="composer">
    <button class="ib" aria-label="添加附件"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg></button>
    <div class="inputWrap"><div class="input">发消息…（排队中）</div></div>
    <button class="send" aria-label="发送"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
