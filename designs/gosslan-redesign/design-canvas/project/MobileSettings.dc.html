<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mobile — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f1;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#f8f8f5;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 8px 0 2px;border-bottom:1px solid #e6e7e2}
  .back{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#3d4045;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .back:active{background:#ecede9}
  .topbar h1{font-size:17px;line-height:24px;font-weight:600;margin:0;flex:1}
  .body{flex:1;overflow:hidden;padding:14px 14px 10px}
  .groupTitle{font-size:10.5px;font-weight:500;color:#70747b;margin:0 6px 6px}
  .card{background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1px #e6e7e2;overflow:hidden;margin-bottom:16px}
  .row{min-height:54px;display:flex;align-items:center;gap:11px;padding:8px 14px;border-bottom:1px solid #ecede9;font-size:14px;color:#17181a;cursor:pointer}
  .row:last-child{border-bottom:0}
  .row:active{background:#fafaf7}
  .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .i1{background:#e8effd;color:#2356c4}.i2{background:#e4f3ea;color:#14663f}.i3{background:#fbf0df;color:#8a4d00}.i4{background:#ece3f6;color:#6b3fa0}.i5{background:#f1f2ee;color:#5a5d63}
  .label{flex:1;font-size:14px}
  .sub{font-size:11px;color:#8a8d92;max-width:150px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{color:#b0b3b9;flex:0 0 auto}
  .avatar{width:34px;height:34px;border-radius:999px;background:#d9e2f7;color:#2356c4;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:0 0 auto;position:relative}
  .avatar .dot{position:absolute;right:-1px;bottom:0;width:9px;height:9px;border-radius:999px;background:#22a06b;box-shadow:0 0 0 2px #fff}
  .profileMain{min-width:0;flex:1}
  .pName{font-size:14.5px;line-height:20px;font-weight:500}
  .pSub{font-size:10.5px;line-height:14px;color:#70747b;margin-top:1px}
  .danger .row{color:#a32b22}
  .danger .ico{background:#fbe9e7;color:#a32b22}
  .foot{text-align:center;font-size:10px;color:#8a8d92;line-height:16px;margin-top:6px}
  svg{display:block}
</style>
</helmet>
<div class="phone">
  <div class="topbar">
    <button class="back" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
    <h1>设置</h1>
  </div>
  <div class="body">
    <p class="groupTitle">个人</p>
    <div class="card">
      <div class="row"><div class="avatar">我<span class="dot"></span></div><div class="profileMain"><div class="pName">小院儿</div><div class="pSub">iPhone · 在线</div></div><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
    </div>

    <p class="groupTitle">应用</p>
    <div class="card">
      <div class="row"><span class="ico i5"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><span class="label">通用</span><span class="sub">简体中文</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
      <div class="row"><span class="ico i1"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="label">外观</span><span class="sub">跟随系统</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
      <div class="row"><span class="ico i4"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M9 10h6M9 13.5h4"/></svg></span><span class="label">聊天样式</span><span class="sub">14px · 跟随主题</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
      <div class="row"><span class="ico i3"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span><span class="label">通知</span><span class="sub">已开启</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
    </div>

    <p class="groupTitle">连接与数据</p>
    <div class="card">
      <div class="row"><span class="ico i2"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/><path d="M2 9a15 15 0 0 1 20 0"/></svg></span><span class="label">网络</span><span class="sub">局域网已连接</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
      <div class="row"><span class="ico i5"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></span><span class="label">存储与文件</span><span class="sub">1.2 GB / 5 GB</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
      <div class="row"><span class="ico i1"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg></span><span class="label">关于</span><span class="sub">v5.18.35</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
    </div>

    <div class="card danger">
      <div class="row"><span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span><span class="label">重置</span><span class="sub">恢复默认 / 清空数据</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
    </div>
    <div class="foot">设置自动保存 · 清空聊天数据不会删除好友与本机身份</div>
  </div>
</div>
</x-dc>

</body>
</html>
