<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f1;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#f8f8f5;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #e6e7e2}
  .topbar h1{font-size:17px;line-height:24px;font-weight:600;margin:0}
  .body{flex:1;overflow:hidden;padding:16px 14px 10px}
  .profile{display:flex;align-items:center;gap:14px;padding:8px 6px 18px}
  .avatar{width:64px;height:64px;border-radius:999px;background:#d9e2f7;color:#2356c4;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;position:relative;flex:0 0 auto}
  .avatar .dot{position:absolute;right:0;bottom:2px;width:14px;height:14px;border-radius:999px;background:#22a06b;box-shadow:0 0 0 3px #f8f8f5}
  .pMain{min-width:0;flex:1}
  .name{font-size:21px;line-height:27px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px}
  .meta{font-size:11px;line-height:16px;color:#70747b;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .meta .mono{font-family:"JetBrains Mono",monospace;font-size:10px;color:#8a8d92}
  .meta .sep{width:2px;height:2px;border-radius:999px;background:#c9cbc5;display:block}
  .edit{width:44px;height:44px;border:0;border-radius:11px;background:#f1f2ee;color:#5a5d63;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .statusBar{display:flex;align-items:center;gap:6px;background:#e4f3ea;color:#14663f;border-radius:9px;padding:8px 11px;font-size:11px;margin-bottom:16px}
  .statusBar i{width:6px;height:6px;border-radius:999px;background:#22a06b;display:block}
  .statusBar .right{margin-left:auto;font-size:10px;color:#14663f}
  .groupTitle{font-size:10.5px;font-weight:500;color:#70747b;margin:0 6px 6px}
  .card{background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1px #e6e7e2;overflow:hidden;margin-bottom:16px}
  .row{min-height:54px;display:flex;align-items:center;gap:11px;padding:0 14px;border-bottom:1px solid #ecede9;font-size:14px;color:#17181a;cursor:pointer}
  .row:last-child{border-bottom:0}
  .row:active{background:#fafaf7}
  .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .i1{background:#e8effd;color:#2356c4}.i2{background:#e4f3ea;color:#14663f}.i3{background:#fbf0df;color:#8a4d00}
  .row .label{flex:1}
  .row .sub{font-size:10.5px;color:#8a8d92;margin-left:auto}
  .chev{color:#b0b3b9}
  .about{text-align:center;font-size:10px;line-height:16px;color:#8a8d92;margin-top:22px}
  .about b{color:#5a5d63;font-weight:500}
  .tabbar{height:56px;flex:0 0 auto;background:rgba(248,248,245,.96);border-top:1px solid #e6e7e2;display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:#70747b;font:inherit;cursor:pointer;position:relative;min-height:44px}
  .tab .pill{width:46px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative}
  .tab.on{color:#2356c4}.tab.on .pill{background:#e8effd}
  .tab .lbl{font-size:10px;line-height:12px;font-weight:500}
  .tab .badge{position:absolute;top:-3px;right:4px;min-width:15px;height:15px;border-radius:999px;background:#2f6beb;color:#fff;font-size:8.5px;font-weight:600;line-height:15px;text-align:center;padding:0 3px;box-shadow:0 0 0 2px #f8f8f5}
  svg{display:block}
</style>
</helmet>
