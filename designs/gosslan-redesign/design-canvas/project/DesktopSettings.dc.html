<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Desktop — Settings window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f1;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a;-webkit-font-smoothing:antialiased}
  .win{width:780px;height:600px;display:flex;flex-direction:column;background:#fff;overflow:hidden}
  .titlebar{height:38px;background:#f1f2ee;border-bottom:1px solid #e2e3de;display:flex;align-items:center;padding:0 14px;position:relative;flex:0 0 auto}
  .lights{display:flex;gap:8px;width:70px}.light{width:11px;height:11px;border-radius:999px;background:#cfd1ca}
  .title{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:500;color:#5a5d63}
  .body{flex:1;display:flex;min-height:0}
  .side{width:200px;background:#f8f8f5;border-right:1px solid #e2e3de;padding:14px 10px;flex:0 0 auto;display:flex;flex-direction:column}
  .sideLabel{font-size:10px;font-weight:500;color:#8a8d92;letter-spacing:.03em;padding:0 9px;margin:0 0 5px}
  .sideLabel.gap{margin-top:14px}
  .navItem{height:32px;display:flex;align-items:center;gap:8px;padding:0 9px;border-radius:7px;font-size:12.5px;color:#3d4045;cursor:pointer;border:0;background:transparent;width:100%;font-family:inherit;text-align:left}
  .navItem svg{color:#70747b;flex:0 0 auto}
  .navItem:hover{background:#f1f2ee;color:#17181a}
  .navItem:hover svg{color:#5a5d63}
  .navItem.on{background:#e8effd;color:#2356c4;font-weight:500}
  .navItem.on svg{color:#2356c4}
  .navItem .after{margin-left:auto;font-size:9.5px;color:#8a8d92}
  .sideFoot{margin-top:auto;padding:10px 9px 0;border-top:1px solid #e6e7e2;font-size:9.5px;color:#8a8d92}
  .content{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
  .contentHead{height:64px;padding:14px 26px 0;flex:0 0 auto}
  .contentHead h2{font-size:19px;line-height:25px;font-weight:600;margin:0}
  .contentHead p{font-size:11.5px;line-height:16px;color:#5a5d63;margin:2px 0 0}
  .contentBody{flex:1;overflow:hidden;padding:6px 26px 0}
  .groupTitle{font-size:10.5px;font-weight:500;color:#70747b;margin:14px 0 6px;letter-spacing:.02em}
  .group{border-top:1px solid #ecede9}
  .row{min-height:50px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ecede9;padding:8px 0}
  .row:last-child{border-bottom:0}
  .rText{min-width:0;flex:1}
  .rLabel{font-size:13px;line-height:18px;font-weight:400}
  .rDesc{font-size:10.5px;line-height:15px;color:#70747b;margin-top:1px}
  .seg{display:flex;gap:2px;background:#f1f2ee;border-radius:8px;padding:2px;flex:0 0 auto}
  .seg button{height:28px;padding:0 9px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:11.5px;color:#5a5d63;cursor:pointer;display:flex;align-items:center;gap:4px}
  .seg button.on{background:#fff;color:#17181a;font-weight:500;box-shadow:0 1px 2px rgba(16,17,20,.08)}
  .swatches{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .sw{width:22px;height:22px;border-radius:999px;border:0;padding:0;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .sw.on:after{content:"";position:absolute;inset:-3px;border-radius:999px;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #2f6beb}
  .sel{height:30px;min-width:116px;border-radius:7px;background:#f1f2ee;border:0;font:inherit;font-size:11.5px;color:#17181a;padding:0 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
  .switch{width:38px;height:22px;border-radius:999px;background:#2f6beb;position:relative;flex:0 0 auto;border:0;padding:0;cursor:pointer}
  .switch:after{content:"";position:absolute;width:18px;height:18px;border-radius:999px;background:#fff;top:2px;left:18px;box-shadow:0 1px 2px rgba(16,17,20,.2)}
  .switch.off{background:#c9cbc5}
  .switch.off:after{left:2px}
  .linkAction{height:30px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:#2356c4;font:inherit;font-size:11.5px;font-weight:500;cursor:pointer;flex:0 0 auto}
  .linkAction:hover{background:#e8effd}
  .preview{margin-top:14px;border-radius:10px;background:#f8f8f5;box-shadow:inset 0 0 0 1px #e6e7e2;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .preview .pLabel{font-size:10px;color:#70747b;width:76px;flex:0 0 auto}
  .pBubbles{display:flex;flex-direction:column;gap:4px;flex:1}
  .pB{height:22px;border-radius:11px;background:#f0f1ed;box-shadow:inset 0 0 0 1px #e4e5e0;display:flex;align-items:center;padding:0 8px;font-size:10.5px;color:#3d4045;width:fit-content}
  .pB.out{background:#2f6beb;color:#fff;align-self:flex-end;box-shadow:none}
  .preview .badge{font-size:9.5px;color:#70747b;background:#fff;border-radius:4px;padding:2px 5px;box-shadow:inset 0 0 0 1px #e4e5e0}
  .foot{height:36px;border-top:1px solid #ecede9;display:flex;align-items:center;padding:0 26px;font-size:9.5px;color:#8a8d92;flex:0 0 auto}
  .foot .right{margin-left:auto;display:flex;align-items:center;gap:4px}
  svg{display:block}
</style>
</helmet>
<div class="win">
  <div class="titlebar">
    <div class="lights"><span class="light"></span><span class="light"></span><span class="light"></span></div><span class="title">设置</span>
  </div>
  <div class="body">
    <aside class="side">
      <p class="sideLabel">个人</p>
      <button class="navItem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>个人资料</button>
      <p class="sideLabel gap">应用</p>
      <button class="navItem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>通用</button>
      <button class="navItem on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>外观</button>
      <button class="navItem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M9 10h6M9 13.5h4"/></svg>聊天样式</button>
      <button class="navItem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>通知</button>
      <p class="sideLabel gap">连接与数据</p>
      <button class="navItem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/><path d="M2 9a15 15 0 0 1 20 0"/></svg>网络</button>
      <button class="navItem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>存储与文件</button>
      <button class="navItem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>关于</button>
      <button class="navItem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>重置</button>
      <div class="sideFoot">Gosslan v5.18.35<br>设置自动保存</div>
    </aside>

    <main class="content">
      <div class="contentHead"><h2>外观</h2><p>决定界面如何呈现；聊天内容本身的字号与气泡在「聊天样式」里调整。</p></div>
      <div class="contentBody">
        <p class="groupTitle">主题</p>
        <div class="group">
          <div class="row">
            <div class="rText"><div class="rLabel">外观模式</div><div class="rDesc">跟随系统，或固定为浅色 / 深色</div></div>
            <div class="seg"><button class="on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>跟随系统</button><button>浅色</button><button>深色</button></div>
          </div>
          <div class="row">
            <div class="rText"><div class="rLabel">主题色</div><div class="rDesc">用于按钮、选中态与自己发送的消息</div></div>
            <div class="swatches">
              <button class="sw on" style="background:#2f6beb" aria-label="钴蓝"></button>
              <button class="sw" style="background:#1b7f52" aria-label="松绿"></button>
              <button class="sw" style="background:#a85d00" aria-label="琥珀"></button>
              <button class="sw" style="background:#8b5cf6" aria-label="紫罗兰"></button>
              <button class="sw" style="background:#c0392f" aria-label="朱红"></button>
              <button class="sw" style="background:#0e7490" aria-label="青"></button>
              <button class="sw" style="background:linear-gradient(135deg,#f97316,#db2777 55%,#2563eb);" aria-label="自定义颜色"></button>
            </div>
          </div>
          <div class="row">
            <div class="rText"><div class="rLabel">界面字体</div><div class="rDesc">使用系统字体以获得最佳中文渲染</div></div>
            <button class="sel">系统默认 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          </div>
        </div>

        <p class="groupTitle">显示效果</p>
        <div class="group">
          <div class="row">
            <div class="rText"><div class="rLabel">减少透明度</div><div class="rDesc">标题栏与底部栏改为不透明表面</div></div>
            <button class="switch off" role="switch" aria-checked="false" aria-label="减少透明度"></button>
          </div>
          <div class="row">
            <div class="rText"><div class="rLabel">环境动效</div><div class="rDesc">背景的缓慢流动；关闭后完全静止</div></div>
            <button class="switch off" role="switch" aria-checked="false" aria-label="环境动效"></button>
          </div>
          <div class="row">
            <div class="rText"><div class="rLabel">跟随系统减少动态效果</div><div class="rDesc">已检测到系统开启；转场将只保留淡入淡出</div></div>
            <span style="font-size:10.5px;color:#14663f;background:#e4f3ea;border-radius:5px;padding:2px 7px">已开启</span>
          </div>
        </div>

        <div class="preview">
          <span class="pLabel">外观预览</span>
          <div class="pBubbles"><div class="pB">评审改到 3 点，会议室 B。</div><div class="pB out">收到，我把材料再顺一遍。</div></div>
          <span class="badge">浅色 · 钴蓝</span>
        </div>
      </div>
      <div class="foot">外观设置立即生效<span class="right"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 9-9"/></svg>已自动保存</span></div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":780,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
