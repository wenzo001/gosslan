<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mobile — Empty first run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f1;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#f8f8f5;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;padding:0 8px 0 14px;gap:10px;border-bottom:1px solid #e6e7e2}
  .me{width:32px;height:32px;border-radius:999px;background:#d9e2f7;color:#2356c4;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;position:relative;flex:0 0 auto}
  .me .dot{position:absolute;right:-1px;bottom:0;width:10px;height:10px;border-radius:999px;background:#22a06b;box-shadow:0 0 0 2px #f8f8f5}
  .topbar h1{font-size:17px;line-height:24px;font-weight:600;margin:0;flex:1}
  .topBtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#3d4045;display:flex;align-items:center;justify-content:center;margin-right:-6px}
  .topBtn:active{background:#ecede9}
  .searchWrap{padding:6px 14px 0;flex:0 0 auto}
  .search{height:36px;border-radius:9px;background:#f1f2ee;display:flex;align-items:center;gap:7px;padding:0 10px;color:#70747b;font-size:13px}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 36px 60px;text-align:center}
  .eicon{width:68px;height:68px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px #e6e7e2;color:#70747b;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .empty h2{font-size:20px;line-height:26px;font-weight:600;margin:0 0 7px;letter-spacing:-.01em}
  .empty p{font-size:12.5px;line-height:19px;color:#5a5d63;margin:0 0 20px}
  .empty p b{color:#3d4045;font-weight:500}
  .primary{height:46px;padding:0 20px;border:0;border-radius:11px;background:#2f6beb;color:#fff;font:inherit;font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;cursor:pointer}
  .primary:active{background:#2459ce}
  .secondary{margin-top:10px;height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#2356c4;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer}
  .discover{margin-top:26px;width:100%;max-width:300px;background:#fff;border-radius:11px;box-shadow:inset 0 0 0 1px #e6e7e2;padding:10px 12px;display:flex;align-items:center;gap:9px}
  .radar{width:30px;height:30px;border-radius:999px;background:#e4f3ea;color:#14663f;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .dMain{min-width:0;flex:1;text-align:left}
  .dTitle{font-size:11.5px;font-weight:500;color:#17181a}
  .dSub{font-size:10px;color:#70747b;margin-top:1px;display:flex;align-items:center;gap:4px}
  .dSub i{width:5px;height:5px;border-radius:999px;background:#22a06b;display:block}
  .meta{display:flex;align-items:center;justify-content:center;gap:10px;font-size:10px;color:#8a8d92;margin-top:18px}
  .meta .sep{width:1px;height:9px;background:#d9dbd5}
  .tabbar{height:56px;flex:0 0 auto;background:rgba(248,248,245,.96);border-top:1px solid #e6e7e2;display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:#70747b;font:inherit;cursor:pointer;position:relative;min-height:44px}
  .tab .pill{width:46px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .tab.on{color:#2356c4}.tab.on .pill{background:#e8effd}
  .tab .lbl{font-size:10px;line-height:12px;font-weight:500}
  svg{display:block}
</style>
</helmet>
<div class="phone">
  <div class="topbar"><div class="me">我<span class="dot"></span></div><h1>聊天</h1><button class="topBtn" aria-label="新建会话"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="searchWrap"><div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>搜索会话、联系人或消息</div></div>
  <div class="empty">
    <div class="eicon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M8.5 9h7M8.5 12.5h4.5"/></svg></div>
    <h2>还没有会话</h2>
    <p>在同一局域网内添加好友即可开始。<br><b>消息只保存在这台设备，不经过服务器。</b></p>
    <button class="primary"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加好友</button>
    <button class="secondary">创建群聊</button>
    <div class="discover"><div class="radar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M5 12a7 7 0 0 1 14 0M2 12a10 10 0 0 1 20 0"/></svg></div><div class="dMain"><div class="dTitle">正在局域网内发现设备</div><div class="dSub"><i></i>4 台设备在线 · 已自动刷新</div></div></div>
    <div class="meta"><span>纯 P2P</span><span class="sep"></span><span>端到端加密</span><span class="sep"></span><span>无服务器</span></div>
  </div>
  <nav class="tabbar" aria-label="主导航">
    <button class="tab on" aria-current="page"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M9 10h6M9 13.5h4"/></svg></span><span class="lbl">聊天</span></button>
    <button class="tab"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M17 4.5a3 3 0 0 1 0 5.5M21 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/></svg></span><span class="lbl">通讯录</span></button>
    <button class="tab"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.8-5.4 2.8 1-6-4.4-4.3 6.1-.9Z"/></svg></span><span class="lbl">收藏</span></button>
    <button class="tab"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span class="lbl">我的</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
