<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mobile — Chats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f1;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#f8f8f5;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .topbar{height:56px;display:flex;align-items:center;padding:0 12px 0 14px;gap:10px;flex:0 0 auto;background:#f8f8f5;border-bottom:1px solid #e6e7e2}
  .me{width:32px;height:32px;border-radius:999px;background:#d9e2f7;color:#2356c4;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;position:relative;flex:0 0 auto}
  .me .dot{position:absolute;right:-1px;bottom:0;width:10px;height:10px;border-radius:999px;background:#22a06b;box-shadow:0 0 0 2px #f8f8f5}
  .topbar h1{font-size:17px;line-height:24px;font-weight:600;margin:0;flex:1}
  .topBtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#3d4045;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-right:-8px}
  .topBtn:active{background:#ecede9}
  .searchWrap{padding:6px 14px 8px;flex:0 0 auto}
  .search{height:36px;border-radius:9px;background:#f1f2ee;display:flex;align-items:center;gap:7px;padding:0 10px;color:#70747b;font-size:13px}
  .section{padding:8px 16px 2px;font-size:11px;font-weight:500;color:#70747b;display:flex;align-items:center;gap:6px}
  .pin{font-size:9px;background:#ecede9;border-radius:4px;padding:1px 5px;color:#70747b}
  .rows{flex:1;overflow:hidden;min-height:0}
  .row{height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative}
  .row:active{background:#f1f2ee}
  .avatar{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex:0 0 auto;position:relative}
  .avatar.sq{border-radius:12px}
  .g4{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:2px;padding:5px;background:#e8effd}
  .g4 span{border-radius:3px;display:block}.g4 .g1{background:#9db8ef}.g4 .g2{background:#e3b28d}.g4 .g3{background:#9bcfb0}.g4 .g4c{background:#c4a9e0}
  .a2{background:#f3e2d6;color:#8a4d00}.a3{background:#dcefe3;color:#14663f}.a4{background:#ece3f6;color:#6b3fa0}.a5{background:#f6e0e0;color:#a32b22}
  .pdot{position:absolute;right:-1px;bottom:0;width:11px;height:11px;border-radius:999px;background:#22a06b;box-shadow:0 0 0 2px #f8f8f5}
  .pdot.off{background:#9a9ea5}
  .rmain{min-width:0;flex:1}
  .rline{display:flex;align-items:baseline;gap:8px}
  .rname{font-size:15px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unread .rname{font-weight:600}
  .rtime{margin-left:auto;font-size:11px;line-height:14px;color:#70747b;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .rprev{display:flex;align-items:center;gap:6px;margin-top:2px}
  .rprev > span:first-of-type{font-size:13px;line-height:18px;color:#5a5d63;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .rbadge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#2f6beb;color:#fff;font-size:10px;font-weight:600;line-height:18px;text-align:center;flex:0 0 auto}
  .mute{color:#70747b;display:flex;flex:0 0 auto}
  .divider{height:1px;background:#ecede9;margin-left:72px}
  .tabbar{height:56px;flex:0 0 auto;background:rgba(248,248,245,.96);border-top:1px solid #e6e7e2;display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:#70747b;font:inherit;cursor:pointer;position:relative;min-height:44px}
  .tab .pill{width:46px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative}
  .tab.on{color:#2356c4}
  .tab.on .pill{background:#e8effd}
  .tab .lbl{font-size:10px;line-height:12px;font-weight:500}
  .tab .badge{position:absolute;top:-3px;right:5px;min-width:15px;height:15px;border-radius:999px;background:#2f6beb;color:#fff;font-size:8.5px;font-weight:600;line-height:15px;text-align:center;padding:0 3px;box-shadow:0 0 0 2px #f8f8f5}
  .tab .dotb{position:absolute;top:3px;right:9px;width:7px;height:7px;border-radius:999px;background:#2f6beb;box-shadow:0 0 0 2px #f8f8f5}
  .g4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
  svg{display:block}
</style>
</helmet>
<div class="phone">
  <div class="topbar">
    <div class="me">我<span class="dot"></span></div>
    <h1>聊天</h1>
    <button class="topBtn" aria-label="新建会话"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="searchWrap"><div class="search" role="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>搜索会话、联系人或消息</div></div>
  <div class="section"><span class="pin">置顶</span></div>
  <div class="rows">
    <div class="row unread">
      <div class="avatar sq g4"><span class="g1"></span><span class="g2"></span><span class="g3"></span><span class="g4c"></span></div>
      <div class="rmain"><div class="rline"><span class="rname">设计组</span><span class="rtime">11:34</span></div><div class="rprev"><span>[文件] 评审材料-v3.pdf</span><span class="rbadge">3</span></div></div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="avatar a2">林<span class="pdot"></span></div>
      <div class="rmain"><div class="rline"><span class="rname">林一</span><span class="rtime">14:32</span></div><div class="rprev"><span>好，我五分钟后到</span></div></div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="avatar a3">周<span class="pdot off"></span></div>
      <div class="rmain"><div class="rline"><span class="rname">周岚</span><span class="rtime">昨天</span></div><div class="rprev"><span>那套配色舒服多了</span><span class="mute"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/><path d="m3 3 18 18"/></svg></span></div></div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="avatar a4">阿<span class="pdot"></span></div>
      <div class="rmain"><div class="rline"><span class="rname">阿泽</span><span class="rtime">周二</span></div><div class="rprev"><span>你：收到，我把材料再顺一遍</span></div></div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="avatar sq a5"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M17 4.5a3 3 0 0 1 0 5.5M21 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/></svg></div>
      <div class="rmain"><div class="rline"><span class="rname">家人群</span><span class="rtime">10/28</span></div><div class="rprev"><span>妈：记得吃饭</span></div></div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="avatar a2">苏<span class="pdot off"></span></div>
      <div class="rmain"><div class="rline"><span class="rname">苏晚</span><span class="rtime">10/24</span></div><div class="rprev"><span>好的，明天见</span></div></div>
    </div>
    <div class="divider"></div>
  </div>
  <nav class="tabbar" aria-label="主导航">
    <button class="tab on" aria-current="page"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M9 10h6M9 13.5h4"/></svg><span class="badge">3</span></span><span class="lbl">聊天</span></button>
    <button class="tab"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M17 4.5a3 3 0 0 1 0 5.5M21 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/></svg><span class="dotb"></span></span><span class="lbl">通讯录</span></button>
    <button class="tab"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.8-5.4 2.8 1-6-4.4-4.3 6.1-.9Z"/></svg></span><span class="lbl">收藏</span></button>
    <button class="tab"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span class="lbl">我的</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
