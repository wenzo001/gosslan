<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mobile — Friend profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f1;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 8px 0 2px;border-bottom:1px solid #ecede9}
  .back{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#3d4045;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .back:active{background:#f1f2ee}
  .topbar h1{font-size:17px;line-height:24px;font-weight:600;margin:0;flex:1}
  .topBtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#3d4045;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-right:-4px}
  .content{flex:1;overflow:hidden;padding:24px 20px 20px}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center}
  .bigAv{width:76px;height:76px;border-radius:999px;background:#f3e2d6;color:#8a4d00;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;position:relative}
  .bigAv .pdot{width:14px;height:14px;right:1px;bottom:2px;box-shadow:0 0 0 3px #fff}
  .pdot{position:absolute;width:14px;height:14px;border-radius:999px;background:#22a06b;display:block}
  .name{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.01em;margin:12px 0 3px}
  .status{font-size:11.5px;color:#14663f;display:flex;align-items:center;gap:5px;font-weight:500}
  .status i{width:6px;height:6px;border-radius:999px;background:#22a06b;display:block}
  .actions{display:flex;gap:8px;width:100%;margin:18px 0 20px}
  .btn{flex:1;height:44px;border:0;border-radius:10px;font:inherit;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
  .primary{background:#2f6beb;color:#fff}.primary:active{background:#2459ce}
  .secondary{background:#f1f2ee;color:#17181a;box-shadow:inset 0 0 0 1px #e4e5e0}
  .card{border-radius:12px;box-shadow:inset 0 0 0 1px #e6e7e2;overflow:hidden}
  .row{min-height:52px;display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #ecede9}
  .row:last-child{border-bottom:0}
  .k{font-size:12.5px;color:#5a5d63;flex:0 0 auto}
  .v{margin-left:auto;font-size:12.5px;color:#17181a;text-align:right;display:flex;align-items:center;gap:6px;justify-content:flex-end;min-width:0}
  .v.mono{font-family:"JetBrains Mono",monospace;font-size:11px;color:#3d4045}
  .tag{font-size:9.5px;font-weight:500;color:#14663f;background:#e4f3ea;border-radius:4px;padding:1px 5px}
  .tag.blue{color:#2356c4;background:#e8effd}
  .lock{width:18px;height:18px;border-radius:5px;background:#e8effd;color:#2356c4;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .sectionTitle{font-size:10.5px;font-weight:500;color:#70747b;margin:18px 0 7px}
  .danger{border-radius:12px;box-shadow:inset 0 0 0 1px #f0d9d6;overflow:hidden;margin-top:18px}
  .dangerRow{height:50px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;color:#a32b22}
  .dangerRow:active{background:#fbe9e7}
  .dangerRow .sub{margin-left:auto;font-size:10.5px;color:#8a8d92}
  .safe{display:flex;align-items:center;gap:8px;background:#f8f8f5;border-radius:10px;padding:10px 12px;margin-top:12px}
  .safe .sh{width:30px;height:30px;border-radius:8px;background:#e8effd;color:#2356c4;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .safe p{font-size:10.5px;line-height:15px;color:#5a5d63;margin:0}
  .safe b{color:#17181a;font-weight:500;display:block;font-size:11px;margin-bottom:1px}
  svg{display:block}
</style>
</helmet>
<div class="phone">
  <div class="topbar">
    <button class="back" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
    <h1>好友资料</h1>
    <button class="topBtn" aria-label="更多"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </div>
  <div class="content">
    <div class="hero">
      <div class="bigAv">林<span class="pdot"></span></div>
      <h2 class="name">林一</h2>
      <div class="status"><i></i>在线 · 局域网直达</div>
      <div class="actions"><button class="btn primary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/></svg>发消息</button><button class="btn secondary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>共享目录</button></div>
    </div>

    <div class="card">
      <div class="row"><span class="k">连接方式</span><span class="v"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2356c4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="14" height="10" rx="2"/><path d="M16 9h5v5h-5"/><path d="M6 19h6"/></svg>局域网 · 0 跳 <span class="tag">直达</span></span></div>
      <div class="row"><span class="k">局域网地址</span><span class="v mono">192.168.1.24:53317</span></div>
      <div class="row"><span class="k">设备</span><span class="v">iPhone 15 · iOS 18.2</span></div>
      <div class="row"><span class="k">对端版本</span><span class="v">Gosslan 5.18.35 <span class="tag blue">一致</span></span></div>
      <div class="row"><span class="k">安全码</span><span class="v mono">4F2A 9C1D 77B0 E614</span></div>
      <div class="row"><span class="k">加密</span><span class="v"><span class="lock"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>端到端加密</span></div>
    </div>

    <div class="safe"><div class="sh"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6Z"/><path d="m9 12 2 2 4-4"/></svg></div><p><b>安全码已核验</b>对方设备与密钥未变化；如安全码改变，请先通过其他渠道确认。</p></div>

    <div class="danger"><div class="dangerRow"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="m17 8 5 5M22 8l-5 5"/></svg>删除好友<span class="sub">保留聊天记录</span></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
