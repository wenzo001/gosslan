<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Desktop — Chats / empty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f1;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a;-webkit-font-smoothing:antialiased}
  .app{width:1000px;height:680px;display:flex;flex-direction:column;background:#f4f4f1;overflow:hidden}
  .titlebar{height:40px;background:#ecece8;border-bottom:1px solid #e2e3de;display:flex;align-items:center;padding:0 14px;flex:0 0 auto;position:relative}
  .lights{display:flex;gap:8px;width:76px}
  .light{width:11px;height:11px;border-radius:999px;background:#cfd1ca}
  .title{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:500;color:#5a5d63;pointer-events:none}
  .tbRight{margin-left:auto;display:flex;align-items:center;gap:10px}
  .conn{display:flex;align-items:center;gap:5px;font-size:11px;color:#14663f;background:#e4f3ea;border-radius:999px;padding:3px 8px}
  .conn i{width:6px;height:6px;border-radius:999px;background:#22a06b;display:block}
  .tbBtn{width:28px;height:28px;border:0;background:transparent;border-radius:7px;color:#5a5d63;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .tbBtn:hover{background:#e2e3de;color:#17181a}
  .workspace{flex:1;display:flex;min-height:0}
  .rail{width:64px;background:#ecece8;border-right:1px solid #e2e3de;display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;flex:0 0 auto}
  .me{width:34px;height:34px;border-radius:999px;background:#d9e2f7;color:#2356c4;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative;margin-bottom:18px;cursor:pointer}
  .me .dot{position:absolute;right:-1px;bottom:0;width:10px;height:10px;border-radius:999px;background:#22a06b;box-shadow:0 0 0 2px #ecece8}
  .nav{display:flex;flex-direction:column;gap:6px}
  .nav button{width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:#5a5d63;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .nav button:hover{background:#e2e3de;color:#17181a}
  .nav button.on{background:#e8effd;color:#2356c4}
  .nav .badge{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:999px;background:#2f6beb;color:#fff;font-size:9px;font-weight:600;line-height:16px;text-align:center;padding:0 4px;box-shadow:0 0 0 2px #ecece8}
  .railBottom{margin-top:auto;display:flex;flex-direction:column;gap:4px}
  .list{width:320px;background:#f8f8f5;border-right:1px solid #e2e3de;display:flex;flex-direction:column;flex:0 0 auto;min-height:0}
  .listHead{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;flex:0 0 auto}
  .listHead h2{font-size:17px;line-height:24px;font-weight:600;margin:0}
  .newBtn{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#5a5d63;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .newBtn:hover{background:#f1f2ee;color:#17181a}
  .searchWrap{padding:0 12px 8px;flex:0 0 auto}
  .search{height:34px;border-radius:8px;background:#f1f2ee;display:flex;align-items:center;gap:7px;padding:0 10px;color:#70747b;font-size:12px}
  .search .kbd{margin-left:auto;font-size:10px;font-family:"JetBrains Mono",monospace;color:#8a8d92;background:#f8f8f5;border-radius:4px;padding:1px 4px}
  .section{padding:8px 16px 4px;font-size:11px;font-weight:500;color:#70747b;display:flex;align-items:center;gap:6px}
  .section .pin{font-size:9px;background:#ecede9;border-radius:4px;padding:1px 5px;color:#70747b}
  .rows{flex:1;overflow:hidden;min-height:0}
  .row{height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;cursor:pointer;position:relative}
  .row:hover{background:#f3f4ef}
  .row.sel{background:#e8effd}
  .avatar{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex:0 0 auto;position:relative}
  .avatar.sq{border-radius:12px}
  .a1{background:#d9e2f7;color:#2356c4}.a2{background:#f3e2d6;color:#8a4d00}.a3{background:#dcefe3;color:#14663f}.a4{background:#ece3f6;color:#6b3fa0}.a5{background:#f6e0e0;color:#a32b22}
  .pdot{position:absolute;right:-1px;bottom:0;width:11px;height:11px;border-radius:999px;background:#22a06b;box-shadow:0 0 0 2px #f8f8f5}
  .row.sel .pdot{box-shadow:0 0 0 2px #e8effd}
  .pdot.off{background:#9a9ea5}
  .rmain{min-width:0;flex:1}
  .rline{display:flex;align-items:baseline;gap:8px}
  .rname{font-size:15px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unread .rname{font-weight:600}
  .rtime{margin-left:auto;font-size:11px;line-height:14px;color:#70747b;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .rprev{display:flex;align-items:center;gap:6px;margin-top:2px}
  .rprev > span:first-of-type{font-size:13px;line-height:18px;color:#5a5d63;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .rbadge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#2f6beb;color:#fff;font-size:10px;font-weight:600;line-height:18px;text-align:center;flex:0 0 auto}
  .mute{color:#70747b;display:flex;flex:0 0 auto}
  .divider{height:1px;background:#ecede9;margin-left:72px}
  .listFoot{height:42px;border-top:1px solid #e2e3de;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:11.5px;color:#5a5d63;background:#f8f8f5;flex:0 0 auto;cursor:pointer}
  .listFoot:hover{background:#f1f2ee}
  .listFoot .n{min-width:16px;height:16px;border-radius:999px;background:#e8effd;color:#2356c4;font-size:9px;font-weight:600;line-height:16px;text-align:center;padding:0 4px}
  .listFoot .chev{margin-left:auto;color:#8a8d92}
  .main{flex:1;background:#fff;display:flex;align-items:center;justify-content:center;min-width:0}
  .empty{width:360px;text-align:center;padding-bottom:16px}
  .eicon{width:64px;height:64px;border-radius:18px;background:#f4f4f1;box-shadow:inset 0 0 0 1px #e6e7e2;color:#70747b;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  .empty h3{font-size:20px;line-height:26px;font-weight:600;margin:0 0 7px;letter-spacing:-.01em}
  .empty p{font-size:13px;line-height:19px;color:#5a5d63;margin:0 0 20px}
  .empty p b{font-weight:500;color:#3d4045}
  .cta{display:flex;justify-content:center;gap:8px}
  .btn{height:36px;padding:0 14px;border:0;border-radius:8px;font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .primary{background:#2f6beb;color:#fff}
  .primary:hover{background:#2459ce}
  .ghost{background:transparent;color:#2356c4}
  .ghost:hover{background:#e8effd}
  .meta{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:11px;color:#70747b}
  .meta .sep{width:1px;height:10px;background:#e6e7e2}
  .g4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
  svg{display:block}
</style>
</helmet>
<div class="app">
  <div class="titlebar">
    <div class="lights"><span class="light"></span><span class="light"></span><span class="light"></span></div>
    <span class="title">Gosslan</span>
    <div class="tbRight">
      <span class="conn"><i></i>局域网已连接 · 4 台设备</span>
      <button class="tbBtn" aria-label="全局搜索"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></button>
    </div>
  </div>
  <div class="workspace">
    <div class="rail">
      <div class="me" title="我的资料">我<span class="dot"></span></div>
      <div class="nav">
        <button class="on" aria-label="聊天" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M9 10h6M9 13.5h4"/></svg></button>
        <button aria-label="通讯录"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M17 4.5a3 3 0 0 1 0 5.5M21 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/></svg><span class="badge">2</span></button>
        <button aria-label="收藏"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.8-5.4 2.8 1-6-4.4-4.3 6.1-.9Z"/></svg></button>
        <button aria-label="链接"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg></button>
      </div>
      <div class="railBottom">
        <button class="tbBtn" aria-label="切换外观"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button class="tbBtn" aria-label="更多"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      </div>
    </div>

    <div class="list">
      <div class="listHead">
        <h2>聊天</h2>
        <button class="newBtn" aria-label="新建会话"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="searchWrap">
        <div class="search" role="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>搜索会话、联系人或消息<span class="kbd">⌘K</span></div>
      </div>
      <div class="section"><span class="pin">置顶</span></div>
      <div class="rows">
        <div class="row unread">
          <div class="avatar sq a1"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M17 4.5a3 3 0 0 1 0 5.5M21 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/></svg></div>
          <div class="rmain">
            <div class="rline"><span class="rname">设计组</span><span class="rtime">11:34</span></div>
            <div class="rprev"><span>[文件] 评审材料-v3.pdf</span><span class="rbadge">3</span></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="row">
          <div class="avatar a2">林<span class="pdot"></span></div>
          <div class="rmain">
            <div class="rline"><span class="rname">林一</span><span class="rtime">14:32</span></div>
            <div class="rprev"><span>好，我五分钟后到</span></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="row">
          <div class="avatar a3">周<span class="pdot off"></span></div>
          <div class="rmain">
            <div class="rline"><span class="rname">周岚</span><span class="rtime">昨天</span></div>
            <div class="rprev"><span>那套配色舒服多了</span><span class="mute"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/><path d="m3 3 18 18"/></svg></span></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="row">
          <div class="avatar a4">阿<span class="pdot"></span></div>
          <div class="rmain">
            <div class="rline"><span class="rname">阿泽</span><span class="rtime">周二</span></div>
            <div class="rprev"><span>你：收到，我把材料再顺一遍</span></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="row">
          <div class="avatar sq a5"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M17 4.5a3 3 0 0 1 0 5.5M21 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/></svg></div>
          <div class="rmain">
            <div class="rline"><span class="rname">家人群</span><span class="rtime">10/28</span></div>
            <div class="rprev"><span>妈：记得吃饭</span></div>
          </div>
        </div>
        <div class="divider"></div>
      </div>
      <div class="listFoot">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
        任务中心
        <span class="n">2</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </div>
    </div>

    <div class="main">
      <div class="empty">
        <div class="eicon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M8.5 9h7M8.5 12.5h4.5"/></svg></div>
        <h3>选择一个会话</h3>
        <p>消息只保存在这台设备，不经过服务器。<br><b>纯 P2P · 端到端加密 · 局域网内直达</b></p>
        <div class="cta">
          <button class="btn primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加好友</button>
          <button class="btn ghost">创建群聊</button>
        </div>
        <div class="meta"><span>4 台设备在线</span><span class="sep"></span><span>消息自动保存在本机</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
