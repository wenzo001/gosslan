<style>

  body{margin:0;background:#f4f4f1;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#f8f8f5;display:flex;flex-direction:column;overflow:hidden}

  .topBtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#3d4045;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-right:-4px}

  .chip{height:30px;padding:0 11px;border:0;border-radius:999px;background:#fff;color:#5a5d63;font:inherit;font-size:12px;box-shadow:inset 0 0 0 1px #e4e5e0;display:flex;align-items:center;gap:4px;flex:0 0 auto;cursor:pointer}
  .chip.on{background:#e8effd;color:#2356c4;box-shadow:none;font-weight:500}
  .chip .n{font-size:9.5px;color:#8a8d92}.chip.on .n{color:#2356c4}
  .rows{flex:1;overflow:hidden;min-height:0;background:#fff}
  .row{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid #ecede9;position:relative;min-height:70px}
  .row:active{background:#fafaf7}
  .type{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
  .tText{background:#e8effd;color:#2356c4}.tImg{background:#e4f3ea;color:#14663f}.tFile{background:#fbf0df;color:#8a4d00}.tCard{background:#ece3f6;color:#6b3fa0}
  .main{min-width:0;flex:1}
  .title{font-size:14.5px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:24px}
  .sub{font-size:11.5px;line-height:16px;color:#70747b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .date{font-size:10px;color:#8a8d92;margin-top:3px}
  .more{position:absolute;right:6px;top:8px;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:#8a8d92;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .more:active{background:#f1f2ee}
  .tabbar{height:56px;flex:0 0 auto;background:rgba(248,248,245,.96);border-top:1px solid #e6e7e2;display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:#70747b;font:inherit;cursor:pointer;position:relative;min-height:44px}
  .tab .pill{width:46px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative}
  .tab.on{color:#2356c4}.tab.on .pill{background:#e8effd}
  .tab .lbl{font-size:10px;line-height:12px;font-weight:500}
  .tab .badge{position:absolute;top:-3px;right:4px;min-width:15px;height:15px;border-radius:999px;background:#2f6beb;color:#fff;font-size:8.5px;font-weight:600;line-height:15px;text-align:center;padding:0 3px;box-shadow:0 0 0 2px #f8f8f5}
  svg{display:block}
</style>
