<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#1f2329;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#f7f8fa;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;padding:0 8px 0 14px;gap:10px;border-bottom:1px solid #e5e6eb;background:#f7f8fa}
  .me{width:32px;height:32px;border-radius:999px;background:#dcd3ff;color:#1f5ae8;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;position:relative;flex:0 0 auto;box-shadow:0 0 0 2px #fff,0 4px 10px rgba(31,35,41,.18)}
  .me .dot{position:absolute;right:-1px;bottom:0;width:10px;height:10px;border-radius:999px;background:#07c160;box-shadow:0 0 0 2px #f7f8fa}
  .topbar h1{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:19px;line-height:25px;font-weight:600;margin:0;flex:1}
  .topBtn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#3a3f47;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-right:-6px}
  .topBtn:active{background:#f2f3f5}
  .searchWrap{padding:7px 14px 5px;flex:0 0 auto}
  .search{height:38px;border-radius:11px;background:#f2f3f5;display:flex;align-items:center;gap:7px;padding:0 11px;color:#8a9099;font-size:12.5px}
  .section{padding:8px 16px 2px;font-size:10px;font-weight:700;color:#8a9099;display:flex;align-items:center;gap:6px;letter-spacing:.03em}
  .pinTag{font-size:10px;background:#fff7e6;color:#9a6b00;border-radius:5px;padding:1px 6px;display:inline-flex;align-items:center;gap:3px}
  .rows{flex:1;overflow:hidden;min-height:0}
  .row{height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative}
  .row:active{background:#f7f8fa}
  .avatar{width:46px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto;position:relative;box-shadow:0 0 0 2px #f7f8fa,0 4px 12px rgba(31,35,41,.16)}
  .avatar.sq{border-radius:14px}
  .g4{background:linear-gradient(#b9c8f6,#b9c8f6) left top/calc(50% - 1px) calc(50% - 1px) no-repeat,linear-gradient(#e8b28a,#e8b28a) right top/calc(50% - 1px) calc(50% - 1px) no-repeat,linear-gradient(#9fdbcd,#9fdbcd) left bottom/calc(50% - 1px) calc(50% - 1px) no-repeat,linear-gradient(#cbbbe2,#cbbbe2) right bottom/calc(50% - 1px) calc(50% - 1px) no-repeat,#e8f0ff}
  .a2{background:#f5e6dc;color:#8a4b22}.a3{background:#e0f5ef;color:#068a4a}.a4{background:#eee6f7;color:#6b4aa3}.a5{background:#ffecec;color:#d93a3a}.a6{background:#f8f1e2;color:#9a6b00}
  .pdot{position:absolute;right:-1px;bottom:0;width:11px;height:11px;border-radius:999px;background:#07c160;box-shadow:0 0 0 2px #f7f8fa}
  .pdot.off{background:#a9a2b8}
  .rmain{min-width:0;flex:1}
  .rline{display:flex;align-items:baseline;gap:8px}
  .rname{font-size:15px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unread .rname{font-weight:600}
  .rtime{margin-left:auto;font-size:10.5px;line-height:14px;color:#8a9099;font-variant-numeric:tabular-nums}
  .rprev{display:flex;align-items:center;gap:6px;margin-top:2px}
  .rprev > span:first-of-type{font-size:13px;line-height:18px;color:#5a6068;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .rbadge{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#fa5151;color:#fff;font-size:10px;font-weight:700;line-height:19px;text-align:center;flex:0 0 auto;box-shadow:0 4px 8px rgba(31,35,41,.28)}
  .mute{color:#8a9099;display:flex;flex:0 0 auto}
  .divider{height:1px;background:#eef0f2;margin-left:74px}
  .tabbar{height:60px;flex:0 0 auto;background:rgba(251,248,255,.96);border-top:1px solid #e5e6eb;display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:#8a9099;font:inherit;cursor:pointer;position:relative;min-height:44px}
  .tab .pill{width:48px;height:27px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative}
  .tab.on{color:#1f5ae8}
  .tab.on .pill{background:linear-gradient(135deg,#e8f0ff,#e8f0ff);box-shadow:inset 0 0 0 1px #d6e3ff}
  .tab .lbl{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:10px;line-height:12px;font-weight:600}
  .tab .badge{position:absolute;top:-3px;right:3px;min-width:15px;height:15px;border-radius:999px;background:#fa5151;color:#fff;font-size:10px;font-weight:700;line-height:15px;text-align:center;padding:0 3px;box-shadow:0 3px 7px rgba(31,35,41,.32),0 0 0 2px #f7f8fa}
  svg{display:block}
</style>
