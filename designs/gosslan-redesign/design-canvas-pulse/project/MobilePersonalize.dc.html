<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pulse — Mobile personalize</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#1f2329;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#f7f8fa;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 8px 0 2px;border-bottom:1px solid #e5e6eb;background:#f7f8fa}
  .back{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#3a3f47;display:flex;align-items:center;justify-content:center}
  .topbar h1{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:18px;font-weight:600;margin:0;flex:1}
  .saved{font-size:10px;font-weight:600;color:#068a4a;background:#e8f8ee;border-radius:999px;padding:3px 7px;margin-right:4px}
  .body{flex:1;overflow:hidden;padding:12px 14px 10px}
  .preview{background:#fff;border-radius:18px;box-shadow:inset 0 0 0 1px #eef0f2,0 12px 30px rgba(31,35,41,.12);overflow:hidden;margin-bottom:14px}
  .pvh{height:42px;display:flex;align-items:center;gap:8px;padding:0 11px;border-bottom:1px solid #eef0f2}
  .pvAv{width:28px;height:28px;border-radius:999px;background:#f5e6dc;color:#8a4b22;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;box-shadow:0 0 0 2px #fff,0 0 0 4px #ffd8c4}
  .pvName{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:12.5px;font-weight:600}
  .pvMeta{font-size:10px;color:#068a4a;margin-top:1px}
  .pvb{padding:10px 11px 9px;background:linear-gradient(180deg,#f7f8fa,#fff)}
  .pvDay{text-align:center;font-size:8px;color:#8a9099;margin-bottom:7px}
  .pvRun{display:flex;margin-bottom:6px}
  .pvRun.own{justify-content:flex-end}
  .pvB{padding:7px 10px;border-radius:16px;font-size:12px;line-height:17px;width:fit-content;max-width:82%}
  .pvIn{background:#f2f3f5;color:#1f2329;border-bottom-left-radius:5px;box-shadow:inset 0 0 0 1px #e5e6eb}
  .pvOut{background:#2f6bff;color:#fff;border-bottom-right-radius:5px;box-shadow:0 4px 12px rgba(31,35,41,.18)}
  .pvR{display:flex;gap:3px;margin-top:-2px;margin-left:5px}
  .pvR span{height:19px;padding:0 6px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #e5e6eb;display:flex;align-items:center;gap:2px;font-size:10px;color:#5a6068}
  .pvc{display:flex;align-items:center;gap:5px;padding:7px 9px;border-top:1px solid #eef0f2}
  .pvField{flex:1;height:28px;border-radius:999px;background:#f2f3f5;display:flex;align-items:center;padding:0 9px;font-size:10px;color:#8a9099}
  .pvSend{width:26px;height:26px;border-radius:999px;background:#2f6bff;display:flex;align-items:center;justify-content:center;color:#fff}
  .sec{margin-bottom:13px}
  .label{display:flex;align-items:baseline;gap:5px;font-size:10px;font-weight:700;color:#5a6068;margin:0 2px 7px}
  .label span{font-weight:400;color:#8a9099;font-size:10px}
  .swRow{display:flex;gap:8px;align-items:center}
  .sw{width:31px;height:31px;border-radius:999px;border:0;padding:0;position:relative;box-shadow:inset 0 0 0 1px rgba(23,18,38,.06)}
  .sw.on:after{content:"";position:absolute;inset:-4px;border-radius:999px;box-shadow:0 0 0 2px #f7f8fa,0 0 0 3.5px #2f6bff}
  .sw.custom{background:conic-gradient(#fa5151,#ffb400,#07c160,#2f6bff,#fa5151)}
  .sw.custom:after{content:"";position:absolute;inset:4px;border-radius:999px;background:#f7f8fa}
  .pals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .pal{background:#fff;border-radius:11px;box-shadow:inset 0 0 0 1px #e5e6eb;padding:7px;text-align:left}
  .pal.on{box-shadow:inset 0 0 0 2px #2f6bff}
  .pal .n{font-size:10px;font-weight:600;color:#5a6068;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pal.on .n{color:#1f5ae8}
  .bars{display:flex;gap:2px}
  .bars span{height:9px;border-radius:5px;flex:1;display:block}
  .card{background:#fff;border-radius:13px;box-shadow:inset 0 0 0 1px #e5e6eb;overflow:hidden;margin-bottom:13px}
  .row{min-height:46px;display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1px solid #eef0f2}
  .row:last-child{border-bottom:0}
  .rText{flex:1;min-width:0}
  .rLabel{font-size:11.5px;font-weight:500}
  .rDesc{font-size:10px;color:#8a9099;margin-top:1px}
  .switch{width:42px;height:24px;border-radius:999px;background:#2f6bff;position:relative;border:0;padding:0;flex:0 0 auto}
  .switch:after{content:"";position:absolute;width:20px;height:20px;border-radius:999px;background:#fff;top:2px;left:20px;box-shadow:0 1px 2px rgba(23,18,38,.2)}
  .switch.off{background:#cfc6e2}.switch.off:after{left:2px}
  .sliderRow{display:flex;align-items:center;gap:9px;padding:8px 11px 11px}
  .sizeA{font-weight:700;color:#8a9099;flex:0 0 auto}
  .slider{flex:1;height:4px;border-radius:999px;background:#eef0f2;position:relative}
  .slider .fill{position:absolute;left:0;top:0;bottom:0;width:52%;background:#2f6bff;border-radius:999px}
  .slider .knob{position:absolute;left:52%;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(23,18,38,.2),inset 0 0 0 1px #e5e6eb}
  .sizeVal{font-family:"JetBrains Mono",monospace;font-size:10px;color:#1f5ae8;background:#e8f0ff;border-radius:5px;padding:2px 5px}
  .reset{width:100%;height:40px;border:0;border-radius:12px;background:transparent;color:#1f5ae8;font:inherit;font-size:11.5px;font-weight:600}
  .reset:active{background:#e8f0ff}
  .foot{text-align:center;font-size:10px;line-height:13px;color:#8a9099}
  svg{display:block}
</style>
<style>
/* v2.2 compact apple-like geometry */
.card{border-radius:16px}
.pal{border-radius:14px}
</style>
</helmet>
<div class="phone">
  <div class="topbar"><button class="back" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.5 8.5 12l6.5 6.5"/></svg></button><h1>个性化</h1><span class="saved">已保存</span></div>
  <div class="body">
    <div class="preview">
      <div class="pvh"><div class="pvAv">林</div><div><div class="pvName">林一</div><div class="pvMeta">在线 · 局域网</div></div></div>
      <div class="pvb">
        <div class="pvDay">今天 14:20</div>
        <div class="pvRun"><div class="pvB pvIn">在楼下咖啡店等你。</div></div>
        <div class="pvRun own"><div class="pvB pvOut">好，我五分钟后到。</div></div>
        <div class="pvRun"><div class="pvB pvIn">评审改到 3 点。</div></div>
        <div class="pvR"><span>🔥 2</span><span>♥ 1</span></div>
      </div>
      <div class="pvc"><div class="pvField">发消息…</div><div class="pvSend"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18.5v-12M7.5 11 12 6.5l4.5 4.5"/></svg></div></div>
    </div>

    <div class="sec">
      <p class="label">主题色 <span>主按钮 / 选中 / 自己消息</span></p>
      <div class="swRow"><button class="sw on" style="background:#2f6bff"></button><button class="sw" style="background:#fa5151"></button><button class="sw" style="background:#07c160"></button><button class="sw" style="background:#ffb400"></button><button class="sw" style="background:#3b82f6"></button><button class="sw" style="background:#ff7ab6"></button><button class="sw custom"></button></div>
    </div>

    <div class="sec">
      <p class="label">气泡配色 <span>会同步给聊天对象</span></p>
      <div class="pals">
        <div class="pal on"><div class="n">默认</div><div class="bars"><span style="background:#f2f3f5;box-shadow:inset 0 0 0 1px #e5e6eb"></span><span style="background:#2f6bff"></span></div></div>
        <div class="pal"><div class="n">红色</div><div class="bars"><span style="background:#fff0f0;box-shadow:inset 0 0 0 1px #ffecec"></span><span style="background:#fa5151"></span></div></div>
        <div class="pal"><div class="n">绿色</div><div class="bars"><span style="background:#e8fbf7;box-shadow:inset 0 0 0 1px #e0f5ef"></span><span style="background:#07c160"></span></div></div>
        <div class="pal"><div class="n">金色</div><div class="bars"><span style="background:#fff9e8;box-shadow:inset 0 0 0 1px #fff1c9"></span><span style="background:#ffb400"></span></div></div>
        <div class="pal"><div class="n">深灰</div><div class="bars"><span style="background:#eef0f2;box-shadow:inset 0 0 0 1px #e5e6eb"></span><span style="background:#2c2f33"></span></div></div>
        <div class="pal"><div class="n">自定义</div><div class="bars"><span style="background:#f2f3f5"></span><span style="background:linear-gradient(135deg,#2f6bff,#fa5151)"></span></div></div>
      </div>
    </div>

    <div class="card">
      <div class="row"><div class="rText"><div class="rLabel">字号</div><div class="rDesc">正文 12–16px</div></div><span class="sizeVal">14px</span></div>
      <div class="sliderRow"><span class="sizeA" style="font-size:10px">A</span><div class="slider"><div class="fill"></div><div class="knob"></div></div><span class="sizeA" style="font-size:18px">A</span></div>
      <div class="row"><div class="rText"><div class="rLabel">界面动效</div><div class="rDesc">界面切换与消息动画；关闭后只保留淡入淡出</div></div><button class="switch off" role="switch" aria-checked="false" aria-label="环境动效"></button></div>
      <div class="row"><div class="rText"><div class="rLabel">减少透明度</div><div class="rDesc">标题栏与底栏不透明</div></div><button class="switch off" role="switch" aria-checked="false" aria-label="减少透明度"></button></div>
    </div>

    <button class="reset">恢复默认</button>
    <div class="foot">气泡配色会同步；主题色只影响本机。<br>所有设置即时保存。</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
