<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#1f2329;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#f7f8fa;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;padding:0 8px 0 16px;gap:8px;border-bottom:1px solid #e5e6eb}
  .topbar h1{font-size:17px;line-height:24px;font-weight:600;margin:0;flex:1}
  .cnt{font-size:10.5px;color:#8a9099;background:#f2f3f5;border-radius:999px;padding:1px 7px}
  .topBtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#3a3f47;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-right:-4px}
  .searchWrap{padding:6px 14px 4px;flex:0 0 auto}
  .search{height:36px;border-radius:9px;background:#f2f3f5;display:flex;align-items:center;gap:7px;padding:0 10px;color:#8a9099;font-size:13px}
  .chips{display:flex;gap:6px;padding:6px 14px 8px;overflow:hidden;flex:0 0 auto}
  .chip{height:30px;padding:0 11px;border:0;border-radius:999px;background:#fff;color:#5a6068;font:inherit;font-size:12px;box-shadow:inset 0 0 0 1px #e5e6eb;display:flex;align-items:center;gap:4px;flex:0 0 auto;cursor:pointer}
  .chip.on{background:#e8f0ff;color:#1f5ae8;box-shadow:none;font-weight:500}
  .chip .n{font-size:10.5px;color:#8a9099}.chip.on .n{color:#1f5ae8}
  .rows{flex:1;overflow:hidden;min-height:0;background:#fff}
  .row{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid #eef0f2;position:relative;min-height:70px}
  .row:active{background:#fafaf7}
  .type{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
  .tText{background:#e8f0ff;color:#1f5ae8}.tImg{background:#e8f8ee;color:#068a4a}.tFile{background:#f8f1e2;color:#8a4b22}.tCard{background:#eee6f7;color:#6b4aa3}
  .main{min-width:0;flex:1}
  .title{font-size:14.5px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:24px}
  .sub{font-size:11.5px;line-height:16px;color:#8a9099;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .date{font-size:10px;color:#8a9099;margin-top:3px}
  .more{position:absolute;right:6px;top:8px;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:#8a9099;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .more:active{background:#f2f3f5}
  .tabbar{height:56px;flex:0 0 auto;background:rgba(248,248,245,.96);border-top:1px solid #e5e6eb;display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:#8a9099;font:inherit;cursor:pointer;position:relative;min-height:44px}
  .tab .pill{width:46px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative}
  .tab.on{color:#1f5ae8}.tab.on .pill{background:#e8f0ff}
  .tab .lbl{font-size:10px;line-height:12px;font-weight:500}
  .tab .badge{position:absolute;top:-3px;right:4px;min-width:15px;height:15px;border-radius:999px;background:#2f6bff;color:#fff;font-size:10px;font-weight:600;line-height:15px;text-align:center;padding:0 3px;box-shadow:0 0 0 2px #f7f8fa}
  svg{display:block}
</style>
