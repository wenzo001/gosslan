<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pulse — Mobile group</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#1f2329;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 8px 0 2px;background:rgba(255,255,255,.92);border-bottom:1px solid #eef0f2;z-index:2;backdrop-filter:blur(10px)}
  .back{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#3a3f47;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .back:active{background:#f2f3f5}
  .gAv{width:34px;height:34px;border-radius:13px;flex:0 0 auto;box-shadow:0 0 0 2px #fff,0 0 0 4px #e8f0ff}
  .g4{background:linear-gradient(#b9c8f6,#b9c8f6) left top/calc(50% - 1px) calc(50% - 1px) no-repeat,linear-gradient(#e8b28a,#e8b28a) right top/calc(50% - 1px) calc(50% - 1px) no-repeat,linear-gradient(#9fdbcd,#9fdbcd) left bottom/calc(50% - 1px) calc(50% - 1px) no-repeat,linear-gradient(#cbbbe2,#cbbbe2) right bottom/calc(50% - 1px) calc(50% - 1px) no-repeat,#e8f0ff}
  .hText{min-width:0}
  .hName{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:15px;line-height:20px;font-weight:600}
  .hMeta{font-size:10px;line-height:14px;color:#5a6068;display:flex;align-items:center;gap:4px;margin-top:1px}
  .hMeta i{width:5px;height:5px;border-radius:999px;background:#07c160;display:block}
  .hMeta b{color:#068a4a;font-weight:600}
  .moreBtn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#3a3f47;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:auto}
  .pinBar{height:36px;flex:0 0 auto;background:#fff7e6;border-bottom:1px solid #ffe9ad;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:10.5px;color:#8a5a00}
  .pinBar .ic{display:flex;color:#9a6b00}
  .pinBar b{font-weight:600;color:#5a3b00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pinBar .tag{margin-left:auto;font-size:10px;font-weight:700;color:#068a4a;background:#e8f8ee;border-radius:999px;padding:2px 6px;flex:0 0 auto}
  .msgs{flex:1;overflow:hidden;padding:7px 14px 8px;position:relative;background:radial-gradient(420px 300px at 85% 0%,#ffffff 0%,#fff 70%)}
  .day{text-align:center;font-size:10.5px;color:#8a9099;margin:9px 0 12px}
  .run{display:flex;gap:7px;margin-bottom:12px;align-items:flex-start}
  .run.own{justify-content:flex-end}
  .av{width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:0 0 auto;margin-top:2px;box-shadow:0 0 0 2px #fff}
  .a2{background:#f5e6dc;color:#8a4b22}.a3{background:#e0f5ef;color:#068a4a}.a4{background:#eee6f7;color:#6b4aa3}
  .runBody{max-width:76%;min-width:0}
  .name{font-size:10px;line-height:14px;color:#8a9099;margin:0 0 3px 2px}
  .bubble{padding:9px 13px;border-radius:20px;font-size:15px;line-height:21px;width:fit-content;max-width:100%}
  .in{background:#f2f3f5;color:#1f2329;border-bottom-left-radius:6px;box-shadow:inset 0 0 0 1px #e5e6eb}
  .out{background:#2f6bff;color:#fff;border-bottom-right-radius:6px;margin-left:auto;box-shadow:0 8px 20px rgba(31,35,41,.22)}
  .meta{display:flex;align-items:center;gap:4px;font-size:10px;color:#8a9099;margin-top:4px}
  .own .meta{justify-content:flex-end;color:#068a4a;font-weight:500}
  .mention{color:#1f5ae8;background:#e8f0ff;border-radius:5px;padding:0 4px;font-weight:600}
  .out .mention{color:#fff;background:rgba(255,255,255,.22)}
  .card{width:272px;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1px #e5e6eb,0 8px 22px rgba(31,35,41,.10);padding:10px 12px}
  .cardTop{display:flex;align-items:center;gap:6px;font-size:10px;color:#8a9099;margin-bottom:5px}
  .pill{font-size:10px;font-weight:700;color:#d93a3a;background:#ffecec;border-radius:999px;padding:2px 6px}
  .cardTitle{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:12.5px;line-height:17px;font-weight:600;color:#1f2329;margin-bottom:6px}
  .cardMeta{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#5a6068}
  .minis{display:flex}
  .minis span{width:15px;height:15px;border-radius:999px;border:1.5px solid #fff;margin-left:-4px;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:700}
  .minis span:first-child{margin-left:0}
  .cardBar{height:3px;border-radius:2px;background:#eef0f2;margin-top:7px;overflow:hidden}
  .cardBar i{display:block;height:100%;width:60%;background:#2f6bff;border-radius:2px}
  .file{display:flex;align-items:center;gap:9px;padding:9px 11px;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 1px #e5e6eb,0 4px 14px rgba(31,35,41,.08);width:240px}
  .ftile{width:32px;height:38px;border-radius:8px;background:#e8f0ff;color:#1f5ae8;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .fname{font-size:12.5px;font-weight:600;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:168px;color:#1f2329}
  .fmeta{font-size:10px;color:#8a9099;line-height:14px}
  .reacts{display:flex;gap:5px;margin-top:-2px;margin-left:7px}
  .react{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #e5e6eb,0 2px 8px rgba(31,35,41,.10);font-size:11px;color:#5a6068}
  .receipt{display:inline-flex;align-items:center;gap:4px}
  .avatars{display:flex}
  .avatars span{width:13px;height:13px;border-radius:999px;border:1.5px solid #fff;margin-left:-4px;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:700}
  .avatars span:first-child{margin-left:0}
  .composerWrap{flex:0 0 auto;padding:0 10px 10px}
  .composer{background:#fff;border-radius:22px;box-shadow:0 12px 30px rgba(31,35,41,.16),inset 0 0 0 1px #eef0f2;padding:6px 7px 6px 9px;display:flex;align-items:flex-end;gap:4px}
  .ib{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:#8a9099;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ib:active{background:#f2f3f5}
  .input{flex:1;min-height:38px;padding:9px 1px;font-size:15px;line-height:20px;color:#8a9099;display:flex;align-items:center}
  .send{width:40px;height:40px;border-radius:999px;border:0;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 6px 14px rgba(31,35,41,.28)}
  svg{display:block}
</style>
<style>.composerWrap{padding:0}.composer{margin:0;padding:8px 10px;background:#fff;border-top:1px solid #eef0f2;border-radius:0;box-shadow:none}</style>
<style>.msgs{background:#fff}</style>
<style>
/* edge cases: long names, long words, tight rows */
.hText{min-width:0;flex:1}
.hName,.hMeta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble{overflow-wrap:anywhere;word-break:break-word}
.quote{overflow-wrap:anywhere}
.pinBar b{max-width:calc(100% - 40px)}
</style>
<style>
/* v2.2 compact apple-like geometry */
.topbar{height:52px}
.gAv{width:32px;height:32px;border-radius:12px}
.hName{font-size:15px;line-height:20px}
.hMeta{font-size:10.5px;line-height:14px}
.hText{flex:1}
.msgs{padding:6px 12px 8px}
.run{margin-bottom:10px}
.bubble{padding:8px 12px;border-radius:20px;font-size:14.5px;line-height:20px}
.meta{font-size:10.5px}
.fname{font-size:12.5px;line-height:17px;max-width:176px}
.composer{padding:7px 8px 7px 9px;border-radius:20px}
.input{min-height:36px;padding:8px 11px;border-radius:10px}
.send{width:34px;height:34px}
</style>
</helmet>
