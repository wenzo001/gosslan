<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#1f2329;-webkit-font-smoothing:antialiased}
  .app{width:1000px;height:680px;display:flex;flex-direction:column;background:#f2f3f5;overflow:hidden}
  .titlebar{height:40px;background:#e9ebee;border-bottom:1px solid #e5e6eb;display:flex;align-items:center;padding:0 12px;flex:0 0 auto;position:relative;z-index:3}
  .lights{display:flex;gap:8px;width:76px}.light{width:11px;height:11px;border-radius:999px;background:#cfc6e2}
  .title{position:absolute;left:0;right:0;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:12px;font-weight:600;color:#5a6068;letter-spacing:.02em}
  .tbRight{margin-left:auto;display:flex;align-items:center;gap:6px}
  .conn{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#068a4a;background:#e8f8ee;border-radius:999px;padding:3px 8px}
  .conn i{width:6px;height:6px;border-radius:999px;background:#07c160;display:block;box-shadow:0 0 0 2px rgba(0,194,168,.16)}
  .tbBtn{width:30px;height:30px;border:0;background:transparent;border-radius:9px;color:#5a6068;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .tbBtn:hover{background:#e8f0ff;color:#1f2329}
  .me{width:28px;height:28px;border-radius:999px;background:#dcd3ff;color:#1f5ae8;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;box-shadow:0 0 0 2px #fff,0 4px 10px rgba(31,35,41,.18);position:relative;margin-left:2px}
  .me .dot{position:absolute;right:-1px;bottom:0;width:9px;height:9px;border-radius:999px;background:#07c160;box-shadow:0 0 0 2px #e9ebee}
  .workspace{flex:1;display:flex;min-height:0}
  .rail{width:64px;background:#e9ebee;border-right:1px solid #e5e6eb;display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;flex:0 0 auto}
  .nav{display:flex;flex-direction:column;gap:6px}
  .nav button{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:#6f6488;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .nav button:hover{background:#e8f0ff;color:#1f2329}
  .nav button.on{background:linear-gradient(135deg,#e8f0ff,#e8f0ff);color:#1f5ae8;box-shadow:inset 0 0 0 1px #d6e3ff}
  .nav .badge{position:absolute;top:-3px;right:-2px;min-width:17px;height:17px;border-radius:999px;background:#fa5151;color:#fff;font-size:10px;font-weight:700;line-height:17px;text-align:center;padding:0 4px;box-shadow:0 4px 8px rgba(31,35,41,.32),0 0 0 2px #e9ebee}
  .railBottom{margin-top:auto;display:flex;flex-direction:column;gap:4px}
  .list{width:320px;background:#f7f8fa;border-right:1px solid #e5e6eb;display:flex;flex-direction:column;flex:0 0 auto;min-height:0}
  .listHead{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px}
  .listHead h2{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:18px;line-height:24px;font-weight:600;margin:0}
  .newBtn{width:32px;height:32px;border:0;border-radius:10px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px rgba(31,35,41,.24)}
  .newBtn:hover{filter:brightness(1.06)}
  .searchWrap{padding:0 12px 6px}
  .search{height:36px;border-radius:10px;background:#f2f3f5;display:flex;align-items:center;gap:7px;padding:0 11px;color:#8a9099;font-size:12px}
  .search .kbd{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10px;color:#8a9099;background:#f7f8fa;border-radius:5px;padding:1px 5px;box-shadow:inset 0 0 0 1px #e5e6eb}
  .section{padding:9px 16px 4px;font-size:10.5px;font-weight:600;color:#8a9099;display:flex;align-items:center;gap:6px}
  .pinTag{font-size:10px;background:#fff7e6;color:#9a6b00;border-radius:5px;padding:1px 6px;display:inline-flex;align-items:center;gap:3px}
  .rows{flex:1;overflow:hidden;min-height:0}
  .row{height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;cursor:pointer;position:relative}
  .row:hover{background:#f7f8fa}
  .avatar{width:46px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto;position:relative;box-shadow:0 0 0 2px #f7f8fa,0 4px 12px rgba(31,35,41,.16)}
  .avatar.sq{border-radius:14px}
  .g4{background:linear-gradient(#b9c8f6,#b9c8f6) left top/calc(50% - 1px) calc(50% - 1px) no-repeat,linear-gradient(#e8b28a,#e8b28a) right top/calc(50% - 1px) calc(50% - 1px) no-repeat,linear-gradient(#9fdbcd,#9fdbcd) left bottom/calc(50% - 1px) calc(50% - 1px) no-repeat,linear-gradient(#cbbbe2,#cbbbe2) right bottom/calc(50% - 1px) calc(50% - 1px) no-repeat,#e8f0ff}
  .a2{background:#f5e6dc;color:#8a4b22}.a3{background:#e0f5ef;color:#068a4a}.a4{background:#eee6f7;color:#6b4aa3}.a5{background:#ffecec;color:#d93a3a}.a6{background:#f8f1e2;color:#9a6b00}
  .pdot{position:absolute;right:-1px;bottom:0;width:11px;height:11px;border-radius:999px;background:#07c160;box-shadow:0 0 0 2px #f7f8fa}
  .pdot.off{background:#a9a2b8}
  .rmain{min-width:0;flex:1}
  .rline{display:flex;align-items:baseline;gap:8px}
  .rname{font-size:15px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unread .rname{font-weight:600}
  .rtime{margin-left:auto;font-size:10.5px;line-height:14px;color:#8a9099;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .rprev{display:flex;align-items:center;gap:6px;margin-top:2px}
  .rprev > span:first-of-type{font-size:13px;line-height:18px;color:#5a6068;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .rbadge{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#fa5151;color:#fff;font-size:10px;font-weight:700;line-height:19px;text-align:center;flex:0 0 auto;box-shadow:0 4px 8px rgba(31,35,41,.28)}
  .mute{color:#8a9099;display:flex;flex:0 0 auto}
  .divider{height:1px;background:#eef0f2;margin-left:74px}
  .listFoot{height:44px;border-top:1px solid #e5e6eb;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:11.5px;color:#5a6068;background:#f7f8fa;cursor:pointer}
  .listFoot:hover{background:#f7f8fa}
  .listFoot .n{min-width:17px;height:17px;border-radius:999px;background:#e8f0ff;color:#1f5ae8;font-size:10px;font-weight:700;line-height:17px;text-align:center;padding:0 4px}
  .listFoot .chev{margin-left:auto;color:#8a9099}
  .main{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;overflow:hidden;background:radial-gradient(680px 500px at 52% 42%,#f7f8fa 0%,#ffffff 66%)}
  .haloWrap{position:relative;width:420px;text-align:center;padding-bottom:20px}
  .halo{position:absolute;left:50%;top:48px;transform:translate(-50%,-50%);width:300px;height:300px;pointer-events:none}
  .halo span{position:absolute;inset:0;border-radius:999px;border:1px solid rgba(31,35,41,.16)}
  .halo span:nth-child(2){inset:34px;border-color:rgba(31,35,41,.18)}
  .halo span:nth-child(3){inset:68px;border-color:rgba(0,194,168,.20)}
  .orb{width:96px;height:96px;border-radius:30px;background:#2f6bff;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 22px;box-shadow:0 18px 40px rgba(31,35,41,.32),inset 0 1px 0 rgba(255,255,255,.35);position:relative}
  .orb:after{content:"";position:absolute;inset:-8px;border-radius:36px;border:1.5px dashed rgba(31,35,41,.22);transform:rotate(8deg)}
  .spark{position:absolute;width:10px;height:10px;border-radius:999px}
  .sp1{background:#fa5151;right:-22px;top:8px;box-shadow:0 0 0 4px rgba(31,35,41,.12)}
  .sp2{background:#07c160;left:-26px;bottom:18px;width:8px;height:8px;box-shadow:0 0 0 4px rgba(0,194,168,.12)}
  .sp3{background:#ffb400;right:8px;bottom:-20px;width:7px;height:7px;box-shadow:0 0 0 4px rgba(31,35,41,.14)}
  h3{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.035em;margin:0 0 8px}
  h3 em{font-style:normal;background:#2f6bff;-webkit-background-clip:text;background-clip:text;color:transparent}
  .haloWrap p{font-size:13px;line-height:20px;color:#5a6068;margin:0 0 20px}
  .haloWrap p b{font-weight:600;color:#1f2329}
  .cta{display:flex;justify-content:center;gap:9px}
  .btn{height:42px;padding:0 17px;border:0;border-radius:12px;font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
  .primary{background:#2f6bff;color:#fff;box-shadow:0 10px 24px rgba(31,35,41,.28)}
  .primary:hover{filter:brightness(1.06)}
  .ghost{background:#fff;color:#3a3f47;box-shadow:inset 0 0 0 1px #e5e6eb,0 4px 14px rgba(31,35,41,.08)}
  .ghost:hover{background:#f7f8fa}
  .chips{display:flex;justify-content:center;gap:8px;margin-top:24px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#5a6068;background:#fff;border-radius:999px;padding:4px 9px;box-shadow:inset 0 0 0 1px #e5e6eb}
  .chip i{width:5px;height:5px;border-radius:999px;display:block}
  .c1 i{background:#2f6bff}.c2 i{background:#07c160}.c3 i{background:#fa5151}
  .hint{position:absolute;right:18px;bottom:16px;display:flex;align-items:center;gap:6px;font-size:10.5px;color:#8a9099}
  svg{display:block}
</style>
