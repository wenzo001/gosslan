<!-- @dsCard group="Navigation" height=360 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Navigation — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:22px;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#1f2329}
  .row{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
  .rail{width:64px;height:300px;background:#e9ebee;border:1px solid #e2e3de;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:12px 0 10px}
  .me{width:34px;height:34px;border-radius:999px;background:#dcd3ff;color:#1f5ae8;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative;margin-bottom:18px}
  .me .dot{position:absolute;right:-1px;bottom:0;width:10px;height:10px;border-radius:999px;background:#07c160;box-shadow:0 0 0 2px #e9ebee}
  .nav{display:flex;flex-direction:column;gap:6px}
  .nav button{width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:#5a6068;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
  .nav button.on{background:#e8f0ff;color:#1f5ae8}
  .nav .badge{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:999px;background:#fa5151;color:#fff;font-size:9px;font-weight:600;line-height:16px;text-align:center;padding:0 4px;box-shadow:0 0 0 2px #e9ebee}
  .bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px}
  .ib{width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:#5a6068;display:flex;align-items:center;justify-content:center}
  .phone{width:300px;background:#f7f8fa;border:1px solid #e2e3de;border-radius:14px;overflow:hidden}
  .top{height:52px;display:flex;align-items:center;padding:0 12px;gap:9px;border-bottom:1px solid #e5e6eb}
  .top .a{width:30px;height:30px;border-radius:999px;background:#dcd3ff;color:#1f5ae8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
  .top h3{font-size:15px;font-weight:600;margin:0;flex:1}
  .top .plus{width:30px;height:30px;border-radius:8px;background:#f2f3f5;color:#5a6068;display:flex;align-items:center;justify-content:center}
  .tabbar{height:56px;border-top:1px solid #e5e6eb;background:rgba(248,248,245,.96);display:flex;align-items:stretch}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8a9099}
  .tab .pill{width:46px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .tab.on{color:#1f5ae8}.tab.on .pill{background:#e8f0ff}
  .tab .lbl{font-size:10px;font-weight:500}
  .caption{font-size:10px;color:#8a9099;margin-top:8px;text-align:center}
  svg{display:block}
</style>
<style>h1,h2,h3,h4,.name,.rname,.title,.fname,.cardTitle,.bigEmpty h3{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="rail">
        <div class="me">我<span class="dot"></span></div>
        <div class="nav">
          <button class="on" aria-label="聊天"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M9 10h6M9 13.5h4"/></svg></button>
          <button aria-label="通讯录"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M17 4.5a3 3 0 0 1 0 5.5M21 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/></svg><span class="badge">2</span></button>
          <button aria-label="收藏"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.8-5.4 2.8 1-6-4.4-4.3 6.1-.9Z"/></svg></button>
          <button aria-label="链接"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg></button>
        </div>
        <div class="bottom"><div class="ib"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div><div class="ib"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></div></div>
      </div>
      <div class="caption">Desktop rail · 64px</div>
    </div>
    <div>
      <div class="phone">
        <div class="top"><div class="a">我</div><h3>聊天</h3><div class="plus"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div></div>
        <div class="tabbar">
          <div class="tab on"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M9 10h6M9 13.5h4"/></svg></span><span class="lbl">聊天</span></div>
          <div class="tab"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M17 4.5a3 3 0 0 1 0 5.5M21 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/></svg></span><span class="lbl">通讯录</span></div>
          <div class="tab"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.8-5.4 2.8 1-6-4.4-4.3 6.1-.9Z"/></svg></span><span class="lbl">收藏</span></div>
          <div class="tab"><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span class="lbl">我的</span></div>
        </div>
      </div>
      <div class="caption">Mobile tab bar · 56px + safe area</div>
    </div>
    <div style="flex:1;min-width:260px;max-width:320px">
      <div style="background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1px #e5e6eb;padding:14px">
        <p style="font-size:11px;font-weight:500;color:#8a9099;margin:0 0 7px">Title bar · 40px</p>
        <div style="height:38px;background:#e9ebee;border-radius:8px;display:flex;align-items:center;padding:0 10px;gap:6px">
          <span style="width:9px;height:9px;border-radius:999px;background:#cfd1ca"></span><span style="width:9px;height:9px;border-radius:999px;background:#cfd1ca"></span><span style="width:9px;height:9px;border-radius:999px;background:#cfd1ca"></span>
          <span style="margin:0 auto;font-size:10px;color:#5a6068">Gosslan</span>
          <span style="font-size:9px;color:#068a4a;background:#e8f8ee;border-radius:999px;padding:2px 6px">LAN · 4</span>
        </div>
        <p style="font-size:10px;line-height:15px;color:#8a9099;margin:10px 0 0">No floating layers above the caption. Window controls follow the platform.</p>
      </div>
    </div>
  </div>
</body>
</html>
