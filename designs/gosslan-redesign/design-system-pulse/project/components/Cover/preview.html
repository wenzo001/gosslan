<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Gosslan Pulse — cover</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#1f2329}
  .cover{width:960px;height:300px;position:relative;overflow:hidden;background:#f2f3f5}
  .text{position:absolute;left:48px;bottom:24px;width:440px}
  .name{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:88px;line-height:.92;font-weight:600;letter-spacing:-.035em;margin:0}
  .tag{font-size:13px;line-height:19px;color:#5a6068;margin:14px 0 0;max-width:360px}
  .kicker{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#8a9099;margin:0 0 12px}
  svg{position:absolute;inset:0;display:block}
</style>
</head>
<body>
<div class="cover">
  <!-- Cover derivation
       blocks: Pulse violet #2f6bff (400×150 bleeding right), deep ink #1f2329 (200×150),
               Spark red #fa5151 (90×150), Green #07c160 (90×150), neutral #e9ebee (100×150).
       arrangement: unequal horizontal bands on the 480px right zone; one tall violet slab on top,
                    the signal strip below; nothing crosses x=480; name on the lilac ground.
       pattern: concentric pulse rings cut from the violet slab at 24px pitch (one ring set),
                because the brand's core signal is "same room, same moment" on the LAN.
       scales: 4/8px steps; radius full for rings; no shadows, no gradients in the cover itself. -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect width="960" height="300" fill="#f2f3f5"/>
    <rect x="560" y="0" width="400" height="150" fill="#2f6bff"/>
    <rect x="480" y="150" width="200" height="150" fill="#1f2329"/>
    <rect x="680" y="150" width="90" height="150" fill="#fa5151"/>
    <rect x="770" y="150" width="90" height="150" fill="#07c160"/>
    <rect x="860" y="150" width="100" height="150" fill="#e9ebee"/>
    <g fill="none" stroke="#f2f3f5" stroke-width="3">
      <circle cx="640" cy="75" r="18" opacity=".9"/>
      <circle cx="640" cy="75" r="40" opacity=".6"/>
      <circle cx="640" cy="75" r="64" opacity=".35"/>
    </g>
    <g fill="#f2f3f5" opacity=".8">
      <circle cx="724" cy="32" r="3"/><circle cx="748" cy="32" r="3"/><circle cx="772" cy="32" r="3"/>
      <circle cx="724" cy="56" r="3"/><circle cx="748" cy="56" r="3"/><circle cx="772" cy="56" r="3"/>
      <circle cx="724" cy="80" r="3"/><circle cx="748" cy="80" r="3"/><circle cx="772" cy="80" r="3"/>
      <circle cx="724" cy="104" r="3"/><circle cx="748" cy="104" r="3"/><circle cx="772" cy="104" r="3"/>
    </g>
    <circle cx="496" cy="174" r="5" fill="#07c160"/>
  </svg>
  <div class="text">
    <p class="kicker">Design system · v2.2</p>
    <h1 class="name">Gosslan<br>Pulse</h1>
    <p class="tag">为小团队设计的局域网聊天。紧凑、圆润、清晰。</p>
  </div>
</div>
</body>
</html>
