<!-- @dsCard group="Inputs" height=360 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Input — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#1f2329}
  .label{font-size:11px;font-weight:500;color:#8a9099;margin:0 0 8px;letter-spacing:.02em}
  .field{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#f2f3f5;border-radius:8px;color:#8a9099;font-size:13px;margin-bottom:8px}
  .field.focused{box-shadow:0 0 0 2px #fff,0 0 0 4px #2f6bff;background:#fff;color:#1f2329}
  .field.error{box-shadow:0 0 0 2px #fff,0 0 0 4px #f04452;background:#fff}
  .field .value{color:#1f2329}
  .caret{width:1.5px;height:17px;background:#2f6bff;margin-left:-4px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .hint{font-size:12px;color:#8a9099;margin:0 0 18px}
  .err{font-size:12px;color:#d93a3a;margin:0 0 18px;display:flex;align-items:center;gap:4px}
  .composer{border-top:1px solid #eef0f2;padding:10px 16px 12px;background:#ffffff;display:flex;align-items:flex-end;gap:8px}
  .tools{display:flex;align-items:center;gap:2px;padding-bottom:2px}
  .ib{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:8px;color:#5a6068;cursor:pointer}
  .ib:hover{background:#f2f3f5;color:#1f2329}
  .input{flex:1;min-height:38px;padding:9px 4px;font-size:14px;line-height:20px;color:#1f2329;background:transparent}
  .input .ph{color:#8a9099}
  .send{width:36px;height:36px;border-radius:999px;border:0;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .send.disabled{background:#f2f3f5;color:#8a9099;cursor:default}
  .dark{background:#242628;border-radius:12px;padding:0;margin-top:18px;overflow:hidden}
  .dark .composer{background:#242628;border-top-color:#2c2f33}
  .dark .input{color:#f2f3f5}
  .dark .input .ph{color:#8a9099}
  .dark .ib{color:#b4b8be}
  .dark .send{background:#4c88ff}
  svg{display:block}
</style>
<style>h1,h2,h3,h4,.name,.rname,.title,.fname,.cardTitle,.bigEmpty h3{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}</style>
</head>
<body>
  <p class="label">Search at rest, focused, error</p>
  <div class="field"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>搜索会话、联系人或消息</div>
  <div class="field focused"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><span class="value">周会</span><span class="caret" aria-hidden="true"></span></div>
  <p class="hint">输入即筛选；⌘K 从任意页面聚焦。</p>
  <div class="field error"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>昵称不能超过 24 个字符</div>
  <p class="err"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>请缩短后重试，已输入的内容不会丢失。</p>
  <p class="label">Composer — light / dark</p>
  <div class="composer">
    <div class="tools">
      <button class="ib" aria-label="添加附件"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg></button>
      <button class="ib" aria-label="发送图片"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m4 18 5-5 4 4 2-2 5 5"/></svg></button>
      <button class="ib" aria-label="表情"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4 4 0 0 0 7 0M9 9.5v.5M15 9.5v.5"/></svg></button>
    </div>
    <div class="input"><span class="ph">发消息给 林一…</span></div>
    <button class="send" aria-label="发送"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
  <div class="dark">
    <div class="composer">
      <div class="tools">
        <button class="ib" aria-label="添加附件"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg></button>
        <button class="ib" aria-label="发送图片"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m4 18 5-5 4 4 2-2 5 5"/></svg></button>
      </div>
      <div class="input"><span class="ph">输入消息…</span></div>
      <button class="send disabled" aria-label="发送" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</body>
</html>
