<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Gosslan Still — cover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f1;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a}
  .cover{width:960px;height:300px;position:relative;overflow:hidden;background:#f4f4f1}
  .text{position:absolute;left:48px;bottom:26px;width:440px}
  .name{font-size:96px;line-height:.92;font-weight:600;letter-spacing:-.035em;margin:0}
  .tag{font-size:13px;line-height:19px;color:#5a5d63;margin:14px 0 0;max-width:360px}
  .kicker{font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#70747b;margin:0 0 12px}
  svg{position:absolute;inset:0;display:block}
</style>
</head>
<body>
<div class="cover">
  <!-- Cover derivation
       blocks: accent #2f6beb (400×150, bleeding right), surface-content #1b1c1f (200×150),
               success #1b7f52 (90×150), accent-soft #e8effd (190×150, bleeding right)
       arrangement: unequal horizontal bands on a 480px right zone; nothing crosses x=480;
                    the name sits on the warm ground at bottom-left.
       pattern: presence dots — a 24px pitch grid of 3px discs cut from the accent block,
                because the product's core signal is "which devices are on this LAN".
       scales: 8px pitch multiples, radius-xs 4px for the small success tile, no shadows. -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect width="960" height="300" fill="#f4f4f1"/>
    <rect x="560" y="0" width="400" height="150" fill="#2f6beb"/>
    <rect x="480" y="150" width="200" height="150" fill="#1b1c1f"/>
    <rect x="680" y="150" width="90" height="150" rx="0" fill="#1b7f52"/>
    <rect x="770" y="150" width="190" height="150" fill="#e8effd"/>
    <g fill="#f4f4f1" opacity=".72">
      <circle cx="584" cy="24" r="3"/><circle cx="608" cy="24" r="3"/><circle cx="632" cy="24" r="3"/><circle cx="656" cy="24" r="3"/><circle cx="680" cy="24" r="3"/><circle cx="704" cy="24" r="3"/><circle cx="728" cy="24" r="3"/><circle cx="752" cy="24" r="3"/>
      <circle cx="584" cy="48" r="3"/><circle cx="608" cy="48" r="3"/><circle cx="632" cy="48" r="3"/><circle cx="656" cy="48" r="3"/><circle cx="680" cy="48" r="3"/><circle cx="704" cy="48" r="3"/><circle cx="728" cy="48" r="3"/><circle cx="752" cy="48" r="3"/>
      <circle cx="584" cy="72" r="3"/><circle cx="608" cy="72" r="3"/><circle cx="632" cy="72" r="3"/><circle cx="656" cy="72" r="3"/><circle cx="680" cy="72" r="3"/><circle cx="704" cy="72" r="3"/><circle cx="728" cy="72" r="3"/><circle cx="752" cy="72" r="3"/>
      <circle cx="584" cy="96" r="3"/><circle cx="608" cy="96" r="3"/><circle cx="632" cy="96" r="3"/><circle cx="656" cy="96" r="3"/><circle cx="680" cy="96" r="3"/><circle cx="704" cy="96" r="3"/><circle cx="728" cy="96" r="3"/><circle cx="752" cy="96" r="3"/>
      <circle cx="584" cy="120" r="3"/><circle cx="608" cy="120" r="3"/><circle cx="632" cy="120" r="3"/><circle cx="656" cy="120" r="3"/><circle cx="680" cy="120" r="3"/><circle cx="704" cy="120" r="3"/><circle cx="728" cy="120" r="3"/><circle cx="752" cy="120" r="3"/>
    </g>
    <circle cx="488" cy="164" r="3" fill="#ecedef" opacity=".5"/>
  </svg>
  <div class="text">
    <p class="kicker">Design system · v1.0</p>
    <h1 class="name">Gosslan<br>Still</h1>
    <p class="tag">冷静、贴近原生的局域网通讯。消息优先于容器，状态始终可见。</p>
  </div>
</div>
</body>
</html>
