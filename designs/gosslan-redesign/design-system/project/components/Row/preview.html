<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Row — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:#f8f8f5;font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17181a}
  .shell{width:344px;background:#f8f8f5;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px #e6e7e2}
  .head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#f8f8f5}
  .head h3{font-size:17px;line-height:24px;font-weight:600;margin:0}
  .head button{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#5a5d63;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .head button:hover{background:#f1f2ee;color:#17181a}
  .search{margin:0 12px 8px;height:34px;border-radius:8px;background:#f1f2ee;display:flex;align-items:center;gap:7px;padding:0 10px;color:#70747b;font-size:12px}
  .group{font-size:11px;font-weight:500;color:#70747b;padding:8px 16px 4px;display:flex;align-items:center;gap:6px}
  .row{height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;cursor:pointer}
  .row:hover{background:#f3f4ef}
  .row.selected{background:#e8effd}
  .row.selected:hover{background:#e2ebfc}
  .avatar{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex:0 0 auto;position:relative}
  .avatar.sq{border-radius:12px}
  .a1{background:#d9e2f7;color:#2356c4}
  .a2{background:#f3e2d6;color:#8a4d00}
  .a3{background:#dcefe3;color:#14663f}
  .a4{background:#ece3f6;color:#6b3fa0}
  .a5{background:#f6e0e0;color:#a32b22}
  .dot{position:absolute;right:-1px;bottom:0;width:11px;height:11px;border-radius:999px;background:#22a06b;box-shadow:0 0 0 2px #f8f8f5}
  .row.selected .dot{box-shadow:0 0 0 2px #e8effd}
  .offline{background:#9a9ea5}
  .main{min-width:0;flex:1}
  .line1{display:flex;align-items:baseline;gap:8px}
  .name{font-size:15px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unread .name{font-weight:600}
  .time{margin-left:auto;font-size:11px;line-height:14px;color:#70747b;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .line2{display:flex;align-items:center;gap:6px;margin-top:2px}
  .preview{font-size:13px;line-height:18px;color:#5a5d63;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .unread .preview{color:#3d4045}
  .badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#2f6beb;color:#fff;font-size:10px;font-weight:600;line-height:18px;text-align:center;flex:0 0 auto}
  .muted{color:#70747b;flex:0 0 auto;display:flex}
  .pin{font-size:10px;font-weight:500;color:#70747b;background:#ecede9;border-radius:4px;padding:1px 5px}
  .divider{height:1px;background:#ecede9;margin-left:72px;margin-right:0}
  .contact .row{height:64px}
  .act{width:30px;height:30px;border:0;border-radius:8px;background:#f1f2ee;color:#5a5d63;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .act:hover{background:#e8effd;color:#2356c4}
  svg{display:block}
</style>
</head>
<body>
  <div class="shell">
    <div class="head">
      <h3>聊天</h3>
      <button aria-label="新建会话"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>搜索会话、联系人或消息</div>
    <div class="group"><span class="pin">置顶</span></div>
    <div class="row unread">
      <div class="avatar sq a1"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M17 4.5a3 3 0 0 1 0 5.5M21 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/></svg></div>
      <div class="main">
        <div class="line1"><span class="name">设计组</span><span class="time">11:34</span></div>
        <div class="line2"><span class="preview">[文件] 评审材料-v3.pdf</span><span class="badge">3</span></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="row selected">
      <div class="avatar a2">林<span class="dot"></span></div>
      <div class="main">
        <div class="line1"><span class="name">林一</span><span class="time">14:32</span></div>
        <div class="line2"><span class="preview">好，我五分钟后到</span></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="avatar a3">周<span class="dot offline"></span></div>
      <div class="main">
        <div class="line1"><span class="name">周岚</span><span class="time">昨天</span></div>
        <div class="line2"><span class="preview">那套配色舒服多了</span><span class="muted"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/><path d="m3 3 18 18"/></svg></span></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="avatar a4">阿<span class="dot"></span></div>
      <div class="main">
        <div class="line1"><span class="name">阿泽</span><span class="time">周二</span></div>
        <div class="line2"><span class="preview">你：收到，我把材料再顺一遍</span></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="avatar sq a5"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3"/><path d="M17 4.5a3 3 0 0 1 0 5.5M21 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/></svg></div>
      <div class="main">
        <div class="line1"><span class="name">家人群</span><span class="time">10/28</span></div>
        <div class="line2"><span class="preview">妈：记得吃饭</span></div>
      </div>
    </div>
    <div class="divider"></div>
  </div>

  <div class="group" style="padding-left:0;margin-top:18px">Contacts</div>
  <div class="shell contact">
    <div class="row">
      <div class="avatar a1">张<span class="dot"></span></div>
      <div class="main">
        <div class="line1"><span class="name">张野</span><span class="time">在线</span></div>
        <div class="line2"><span class="preview" style="color:#14663f">局域网可达 · 192.168.1.24</span></div>
      </div>
      <button class="act" aria-label="发消息"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/></svg></button>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="avatar a4">陈<span class="dot offline"></span></div>
      <div class="main">
        <div class="line1"><span class="name">陈默</span><span class="time">离线</span></div>
        <div class="line2"><span class="preview">上次见面 · 10 月 21 日</span></div>
      </div>
      <button class="act" aria-label="发消息"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/></svg></button>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="avatar" style="background:#e8effd;color:#2356c4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="8.5" cy="7" r="3.2"/><path d="M18 8v6M15 11h6"/></svg></div>
      <div class="main">
        <div class="line1"><span class="name">新的朋友</span><span class="time">2 条申请</span></div>
        <div class="line2"><span class="preview">李知远 请求添加你为好友</span><span class="badge">2</span></div>
      </div>
    </div>
  </div>
</body>
</html>
